<svg xmlns="http://www.w3.org/2000/svg" width="760" height="615" viewBox="0 0 760 615" role="img" aria-labelledby="title desc"><title id="title">Lifting a ground resolution step</title><desc id="desc">Standardized-apart parents resolve with a most general unifier to E. Grounding by the combined substitution equals first unifying by μ and then grounding by ρ. Every literal in a pivot fiber must be deleted.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#245b4b" stroke-width="1.2"/></marker></defs>
<rect width="760" height="615" fill="#f3f4ef"/>
<text x="380" y="29" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">general clauses</text>
<text x="150" y="81" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#303b34">C<tspan baseline-shift="super" font-size="75%">e</tspan></text>
<text x="590" y="81" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#303b34">D<tspan baseline-shift="super" font-size="75%">o</tspan></text>
<path d="M150 100 L590 100" fill="none" stroke="#245b4b" stroke-width="1.5"/>
<text x="380" y="148" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#245b4b">E = ((C<tspan baseline-shift="super" font-size="75%">e</tspan> ∖ S) ∪ (D<tspan baseline-shift="super" font-size="75%">o</tspan> ∖ T))μ</text>
<text x="656" y="105" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">resolve with μ</text>
<path d="M150 110 L150 277" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M590 110 L590 277" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="120" y="213" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#245b4b">γ</text>
<text x="620" y="213" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#245b4b">γ</text>
<path d="M380 165 L380 328" fill="none" stroke="#245b4b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="405" y="253" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#245b4b">ρ</text>
<text x="150" y="315" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#303b34">Cσ = C<tspan baseline-shift="super" font-size="75%">e</tspan>γ</text>
<text x="590" y="315" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#303b34">Dτ = D<tspan baseline-shift="super" font-size="75%">o</tspan>γ</text>
<path d="M150 342 L590 342" fill="none" stroke="#245b4b" stroke-width="1.5"/>
<text x="380" y="388" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b">G = (Cσ ∖ {A}) ∪ (Dτ ∖ {¬A}) = Eρ</text>
<text x="380" y="432" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">γ = ρ ⋆ μ on every variable</text>
<path d="M40 458 L720 458" fill="none" stroke="#8ea38a" stroke-width="1.5"/>
<text x="127" y="503" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#303b34">P(x<tspan baseline-shift="sub" font-size="75%">0</tspan>)</text>
<text x="127" y="558" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#303b34">P(x<tspan baseline-shift="sub" font-size="75%">1</tspan>)</text>
<path d="M187 499 L350 524" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M187 552 L350 530" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="403" y="535" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#245b4b">P(a)</text>
<path d="M98 468 L156 526" fill="none" stroke="#956b60" stroke-width="2"/>
<path d="M98 526 L156 468" fill="none" stroke="#956b60" stroke-width="2"/>
<path d="M98 523 L156 581" fill="none" stroke="#956b60" stroke-width="2"/>
<path d="M98 581 L156 523" fill="none" stroke="#956b60" stroke-width="2"/>
<path d="M374 499 L432 557" fill="none" stroke="#956b60" stroke-width="2"/>
<path d="M374 557 L432 499" fill="none" stroke="#956b60" stroke-width="2"/>
<text x="590" y="512" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">delete the whole fiber</text>
<text x="590" y="547" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">before taking the image</text>
</svg>
