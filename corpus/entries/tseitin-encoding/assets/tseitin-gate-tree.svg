<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc"><title id="title">Tseitin gates for p or q and r</title><desc id="desc">The atom gates have values a=0,b=1,c=1. The conjunction gate e=1 feeds the disjunction gate z=1, which is asserted by the root unit clause.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" viewBox="0 0 8 8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 L2.5 4 Z" fill="#245b4b"/></marker></defs>
<rect width="760" height="470" fill="#f3f4ef"/>
<text x="380" y="32" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">A = p ∨ (q ∧ r)</text>
<rect x="260" y="51" width="200" height="43" rx="6" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.2"/>
<text x="360" y="79" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#245b4b">root clause: (z)</text>
<text x="125" y="405" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#303b34">p = 0</text>
<path d="M125 376 L125.0 338.0" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="125" cy="309" r="29" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.3"/>
<text x="125" y="309" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#245b4b" dominant-baseline="central">a = 0</text>
<text x="190" y="354" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">2 clauses</text>
<text x="390" y="405" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#303b34">q = 1</text>
<path d="M390 376 L390.0 338.0" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="390" cy="309" r="29" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.3"/>
<text x="390" y="309" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#245b4b" dominant-baseline="central">b = 1</text>
<text x="455" y="354" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">2 clauses</text>
<text x="640" y="405" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#303b34">r = 1</text>
<path d="M640 376 L640.0 338.0" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="640" cy="309" r="29" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.3"/>
<text x="640" y="309" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#245b4b" dominant-baseline="central">c = 1</text>
<text x="705" y="354" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">2 clauses</text>
<path d="M411.26477654830836 289.28175265520497 L478.73522345169164 226.718247344795" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M616.5611416093777 291.9231174582609 L523.4388583906223 224.0768825417391" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="500" cy="207" r="29" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.3"/>
<text x="500" y="207" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="27" fill="#245b4b" dominant-baseline="central">∧</text>
<text x="565" y="214" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#245b4b">e = 1</text>
<path d="M147.48380364448528 290.68392581156564 L307.51619635551475 160.31607418843436" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M472.91249678931854 196.64301347826884 L357.08750321068146 152.35698652173116" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="330" cy="142" r="29" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.3"/>
<text x="330" y="142" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="27" fill="#245b4b" dominant-baseline="central">∨</text>
<text x="395" y="149" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#245b4b">z = 1</text>
<path d="M330.0 113.0 L330 94" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380" y="449" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">3 × 2 atom clauses + 2 × 3 connective clauses + 1 root clause = 13</text>
</svg>
