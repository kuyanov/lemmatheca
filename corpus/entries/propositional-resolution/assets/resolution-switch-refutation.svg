<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="title desc"><title id="title">The switch-clause resolution refutation</title><desc id="desc">Premises {p,q} and {not p} resolve on p to {q}; resolving that with premise {not q} on q gives the empty clause.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" viewBox="0 0 8 8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 L2.5 4 Z" fill="#245b4b"/></marker></defs>
<rect width="760" height="310" fill="#f3f4ef"/>
<text x="380" y="32" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">premise leaves are grey; derived clauses are green</text>
<text x="180" y="93" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="27" fill="#73796f">{p,q}</text>
<text x="390" y="93" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="27" fill="#73796f">{¬p}</text>
<path d="M111 115 L459 115" fill="none" stroke="#245b4b" stroke-width="1.5"/>
<text x="493" y="122" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#245b4b">p</text>
<text x="285" y="161" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="27" fill="#245b4b">{q}</text>
<text x="590" y="161" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="27" fill="#73796f">{¬q}</text>
<path d="M183 187 L678 187" fill="none" stroke="#245b4b" stroke-width="1.5"/>
<text x="704" y="194" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#245b4b">q</text>
<text x="430" y="242" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="32" fill="#245b4b">∅</text>
<text x="430" y="286" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">the empty-clause root refutes the three premises</text>
</svg>
