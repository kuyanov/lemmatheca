<svg xmlns="http://www.w3.org/2000/svg" width="420" height="540" viewBox="0 0 420 540" role="img" aria-labelledby="title desc">
  <title id="title">An alternating extension walk</title>
  <desc id="desc">Solid arrows apply the given injection f. Dashed arrows follow existing pairs in reverse. The walk begins at an unused input and ends at an unused output.</desc>
  <defs>
    <marker id="tip" markerWidth="7" markerHeight="7" refX="8" refY="4" orient="auto" viewBox="0 0 8 8"><path d="M0 0 L8 4 L0 8 Z" fill="#45695f"/></marker>
    <marker id="old-tip" markerWidth="7" markerHeight="7" refX="8" refY="4" orient="auto" viewBox="0 0 8 8"><path d="M0 0 L8 4 L0 8 Z" fill="#6c7280"/></marker>
  </defs>
  <rect width="420" height="540" fill="#fff"/>
  <g fill="none" stroke-width="2">
    <path d="M97.14 70.49 L312.86 139.51" stroke="#45695f" marker-end="url(#tip)"/>
    <path d="M312.86 150.49 L97.14 219.51" stroke="#6c7280" stroke-dasharray="6 5" marker-end="url(#old-tip)"/>
    <path d="M97.14 230.49 L312.86 299.51" stroke="#45695f" marker-end="url(#tip)"/>
    <path d="M312.86 310.49 L97.14 379.51" stroke="#6c7280" stroke-dasharray="6 5" marker-end="url(#old-tip)"/>
    <path d="M97.14 390.49 L312.86 459.51" stroke="#45695f" marker-end="url(#tip)"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <g fill="#45695f"><text x="205" y="80">f</text><text x="205" y="240">f</text><text x="205" y="400">f</text></g>
    <g fill="#626977"><text x="205" y="160">M⁻¹</text><text x="205" y="320">M⁻¹</text></g>
  </g>
  <g fill="#fff" stroke-width="2">
    <circle cx="80" cy="65" r="18" stroke="#267153"/>
    <circle cx="330" cy="145" r="18" stroke="#6c7280"/>
    <circle cx="80" cy="225" r="18" stroke="#6c7280"/>
    <circle cx="330" cy="305" r="18" stroke="#6c7280"/>
    <circle cx="80" cy="385" r="18" stroke="#6c7280"/>
    <circle cx="330" cy="465" r="18" stroke="#267153"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" fill="#28332f" text-anchor="middle" dominant-baseline="central">
    <text x="80" y="65">x₀</text><text x="330" y="145">y₀</text>
    <text x="80" y="225">x₁</text><text x="330" y="305">y₁</text>
    <text x="80" y="385">x₂</text><text x="330" y="465">y₂</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" fill="#267153" text-anchor="middle">
    <text x="80" y="25">unused input</text>
    <text x="330" y="510">unused output</text>
  </g>
</svg>
