<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img" aria-labelledby="title desc">
  <title id="title">Successive points satisfy successively more requirements</title>
  <desc id="desc">Columns show b zero through b four. Row A i is shaded from column i onward, indicating membership. Earlier cells are unshaded and may be exceptions.</desc>
  <rect width="760" height="370" fill="#f3f4ef"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#252d29" text-anchor="middle">
    <text x="270" y="48">b₀</text><text x="352" y="48">b₁</text><text x="434" y="48">b₂</text><text x="516" y="48">b₃</text><text x="598" y="48">b₄</text><text x="670" y="48">…</text>
    <text x="142" y="92">A₀</text><text x="142" y="136">A₁</text><text x="142" y="180">A₂</text><text x="142" y="224">A₃</text><text x="142" y="268">A₄</text>
  </g>
  <g fill="#e0eadf">
    <rect x="229" y="65" width="410" height="44"/><rect x="311" y="109" width="328" height="44"/>
    <rect x="393" y="153" width="246" height="44"/><rect x="475" y="197" width="164" height="44"/><rect x="557" y="241" width="82" height="44"/>
  </g>
  <g stroke="#cbd1c5" stroke-width="1" fill="none">
    <path d="M229 65H639V285H229Z M311 65V285 M393 65V285 M475 65V285 M557 65V285 M229 109H639 M229 153H639 M229 197H639 M229 241H639"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#245b4b" text-anchor="middle">
    <text x="270" y="93">∈</text><text x="352" y="93">∈</text><text x="434" y="93">∈</text><text x="516" y="93">∈</text><text x="598" y="93">∈</text>
    <text x="352" y="137">∈</text><text x="434" y="137">∈</text><text x="516" y="137">∈</text><text x="598" y="137">∈</text>
    <text x="434" y="181">∈</text><text x="516" y="181">∈</text><text x="598" y="181">∈</text>
    <text x="516" y="225">∈</text><text x="598" y="225">∈</text><text x="598" y="269">∈</text>
    <text x="670" y="93">…</text><text x="670" y="137">…</text><text x="670" y="181">…</text><text x="670" y="225">…</text><text x="670" y="269">…</text>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#73796f">
    <rect x="185" y="322" width="16" height="16" fill="#e0eadf" stroke="#a7b4a0"/>
    <text x="212" y="336">Guaranteed membership</text>
    <text x="445" y="336">Blank cells may be exceptions</text>
  </g>
</svg>
