<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title desc"><title id="title">Opening a slot under a quantifier</title><desc id="desc">The available outer slot z0 is replaced by t. The internal binder and its occurrence are renamed from z1 to z0; free names inside t remain free.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" viewBox="0 0 8 8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 L2.5 4 Z" fill="#245b4b"/></marker></defs>
<rect width="760" height="410" fill="#f3f4ef"/>
<text x="184" y="35" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">one available outer slot</text>
<text x="584" y="35" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">the outer slot has been removed</text>
<text x="185" y="90" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="27" fill="#245b4b">∀z<tspan baseline-shift="sub" font-size="75%">1</tspan></text>
<path d="M185 102 L185.0 145.0" fill="none" stroke="#245b4b" stroke-width="1.5"/>
<circle cx="185" cy="169" r="24" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.3"/>
<text x="185" y="169" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b" dominant-baseline="central">R</text>
<path d="M167.35720364020614 185.27057886514322 L95 252" fill="none" stroke="#245b4b" stroke-width="1.5"/>
<path d="M202.64279635979386 185.27057886514322 L275 252" fill="none" stroke="#245b4b" stroke-width="1.5"/>
<text x="95" y="278" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#245b4b">z<tspan baseline-shift="sub" font-size="75%">0</tspan></text>
<text x="275" y="278" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#303b34">z<tspan baseline-shift="sub" font-size="75%">1</tspan></text>
<path d="M216 79 C323 85 327 219 275 252" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
<text x="585" y="90" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="27" fill="#245b4b">∀z<tspan baseline-shift="sub" font-size="75%">0</tspan></text>
<path d="M585 102 L585.0 145.0" fill="none" stroke="#245b4b" stroke-width="1.5"/>
<circle cx="585" cy="169" r="24" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.3"/>
<text x="585" y="169" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b" dominant-baseline="central">R</text>
<path d="M567.3572036402062 185.27057886514322 L495 252" fill="none" stroke="#245b4b" stroke-width="1.5"/>
<path d="M602.6427963597938 185.27057886514322 L675 252" fill="none" stroke="#245b4b" stroke-width="1.5"/>
<text x="495" y="278" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#245b4b">t</text>
<text x="675" y="278" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#303b34">z<tspan baseline-shift="sub" font-size="75%">0</tspan></text>
<path d="M616 79 C723 85 727 219 675 252" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
<path d="M310 165 L457 165" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="383" y="135" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">z<tspan baseline-shift="sub" font-size="75%">0</tspan> ↦ t</text>
<text x="383" y="205" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">z<tspan baseline-shift="sub" font-size="75%">1</tspan> ↦ z<tspan baseline-shift="sub" font-size="75%">0</tspan></text>
<rect x="440" y="309" width="235" height="51" rx="6" fill="none" stroke="#8ea38a" stroke-width="1.2"/>
<text x="557" y="342" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#245b4b">free names in t stay free</text>
<text x="180" y="343" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">R(z<tspan baseline-shift="sub" font-size="75%">0</tspan>,z<tspan baseline-shift="sub" font-size="75%">1</tspan>) is the old body</text>
</svg>
