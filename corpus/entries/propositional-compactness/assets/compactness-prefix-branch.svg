<text x="550" y="177" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#245b4b">1</text>
<text x="54" y="176" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">level 1</text>
<path d="M560 188 L630 236" fill="none" stroke="#245b4b" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="640" cy="260" r="25" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.3"/>
<text x="640" y="267" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#245b4b">11</text>
<text x="54" y="266" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">level 2</text>
<path d="M650 278 L675 326" fill="none" stroke="#245b4b" stroke-width="2" marker-end="url(#arrow)"/>
