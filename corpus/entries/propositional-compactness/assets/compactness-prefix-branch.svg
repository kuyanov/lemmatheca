<text x="390" y="425" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#245b4b">union of the surviving prefixes: v(p<tspan baseline-shift="sub" font-size="75%">n</tspan>) = 1 for every n</text>
