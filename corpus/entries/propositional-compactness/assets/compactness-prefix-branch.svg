<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">Compatible prefixes for the all-true theory</title><desc id="desc">At successive levels only the all-one prefix survives the requirements p_n. Prefixes ending in zero are rejected when that atom is assigned; the surviving prefixes form one compatible branch.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#245b4b" stroke-width="1.2"/></marker></defs>
<rect width="760" height="460" fill="#f3f4ef"/>
<text x="380" y="33" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">Γ = {p<tspan baseline-shift="sub" font-size="75%">0</tspan>, p<tspan baseline-shift="sub" font-size="75%">1</tspan>, p<tspan baseline-shift="sub" font-size="75%">2</tspan>, …}</text>
<circle cx="380" cy="80" r="25" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.3"/>
