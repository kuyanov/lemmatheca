<path d="M368 98 L197 146" fill="none" stroke="#8ea38a" stroke-width="1.5"/>
<text x="185" y="177" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#73796f">0</text>
<path d="M207 162 L223 178" fill="none" stroke="#956b60" stroke-width="2"/>
<path d="M207 178 L223 162" fill="none" stroke="#956b60" stroke-width="2"/>
