<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">Compatible prefixes for the all-true theory</title><desc id="desc">At successive levels only the all-one prefix survives the requirements p_n. Prefixes ending in zero are rejected when that atom is assigned; the surviving prefixes form one compatible branch.</desc>
