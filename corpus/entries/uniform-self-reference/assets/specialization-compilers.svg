<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
<title id="title">Specialization through two compilers</title><desc id="desc">Starting with a psi index n, compile with c to a standard phi index, specialize that index at a, then compile back with b. The resulting psi program at x agrees with the original psi program at the pair of a and x, including divergence.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" viewBox="0 0 10 9" refX="8.7" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#245b4b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="350" fill="#f3f4ef"/>
<text x="28" y="36" font-family="Georgia, Times New Roman, serif" font-size="23" text-anchor="start" fill="#252d29">Specialize by translating to the standard numbering</text>
<text x="28" y="68" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="start" fill="#73796f">The parameter a is fixed; every box contains a program index.</text>
<rect x="24" y="116" width="116" height="76" rx="5" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="82.0" y="141" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#73796f">ψ-index</text>
<text x="82.0" y="171" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#245b4b">n</text>
<rect x="184" y="116" width="132" height="76" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="250.0" y="141" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#73796f">φ-index</text>
<text x="250.0" y="171" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#245b4b">c(n)</text>
<rect x="360" y="116" width="148" height="76" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="434.0" y="141" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#73796f">φ-index</text>
<text x="434.0" y="171" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#245b4b">s(c(n),a)</text>
<rect x="552" y="116" width="184" height="76" rx="5" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="644.0" y="141" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#73796f">ψ-index</text>
<text x="644.0" y="171" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#245b4b">b(s(c(n),a))</text>
<path d="M140.6 154.0L183.4 154.0" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="162.0" y="104" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#245b4b">c</text>
<path d="M316.6 154.0L359.4 154.0" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="338.0" y="104" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#245b4b">s(·,a)</text>
<path d="M508.6 154.0L551.4 154.0" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="530.0" y="104" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#245b4b">b</text>
<text x="380" y="252" font-family="Georgia, Times New Roman, serif" font-size="24" text-anchor="middle" fill="#245b4b">ψ<tspan baseline-shift="sub" font-size="70%">b(s(c(n),a))</tspan>(x) ≃ ψ<tspan baseline-shift="sub" font-size="70%">n</tspan>(⟨a,x⟩)</text>
<text x="380" y="302" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="middle" fill="#73796f">The arrows transform names; the equality compares partial behavior.</text>
</svg>
