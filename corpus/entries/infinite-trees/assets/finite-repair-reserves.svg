<circle cx="665" cy="300" r="13" fill="#f3f4ef" stroke="#a7b5a6" stroke-width="1.6"/>
<text x="665" y="307" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">5</text>
<circle cx="665" cy="339" r="13" fill="#f3f4ef" stroke="#8b6d48" stroke-width="1.6"/>
<text x="665" y="346" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">6</text>
