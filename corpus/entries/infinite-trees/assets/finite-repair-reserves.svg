<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
<title id="title">Repairing collisions while protecting reserved values</title><desc id="desc">Before repair, replacing f on A by g collides at value four and hits the reserve six. After repair the two new arguments are sent to fresh values one and three. A lower ladder shows exact h extensions and reserves growing one value at each stage.</desc>
<rect width="760" height="620" fill="#f3f4ef"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#356653" stroke-width="1.4"/></marker><marker id="grey-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#768278" stroke-width="1.4"/></marker></defs>
<text x="380.0" y="34" font-family="Georgia, Times New Roman, serif" font-size="23" text-anchor="middle" fill="#29352e" font-weight="bold">Repair only the bad new arguments; keep the reserve unused</text>
<text x="185" y="78" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">Before repair</text>
<rect x="53" y="101" width="59" height="112" rx="8" fill="#dce9dc" stroke="#a7b5a6" stroke-width="1.2"/>
<circle cx="82" cy="124" r="16" fill="#f3f4ef" stroke="#356653" stroke-width="1.6"/>
<text x="82" y="131" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">0</text>
<circle cx="82" cy="191" r="16" fill="#f3f4ef" stroke="#356653" stroke-width="1.6"/>
<text x="82" y="198" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">1</text>
<circle cx="82" cy="258" r="16" fill="#f3f4ef" stroke="#356653" stroke-width="1.6"/>
<text x="82" y="265" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">2</text>
<circle cx="82" cy="325" r="16" fill="#f3f4ef" stroke="#356653" stroke-width="1.6"/>
<text x="82" y="332" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">3</text>
<circle cx="290" cy="105" r="13" fill="#f3f4ef" stroke="#a7b5a6" stroke-width="1.6"/>
<text x="290" y="112" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">0</text>
<circle cx="290" cy="144" r="13" fill="#f3f4ef" stroke="#a7b5a6" stroke-width="1.6"/>
<text x="290" y="151" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">1</text>
<circle cx="290" cy="183" r="13" fill="#f3f4ef" stroke="#a7b5a6" stroke-width="1.6"/>
<text x="290" y="190" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">2</text>
<circle cx="290" cy="222" r="13" fill="#f3f4ef" stroke="#a7b5a6" stroke-width="1.6"/>
<text x="290" y="229" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">3</text>
<circle cx="290" cy="261" r="13" fill="#f3f4ef" stroke="#a7b5a6" stroke-width="1.6"/>
<text x="290" y="268" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">4</text>
<circle cx="290" cy="300" r="13" fill="#f3f4ef" stroke="#a7b5a6" stroke-width="1.6"/>
<text x="290" y="307" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">5</text>
<circle cx="290" cy="339" r="13" fill="#f3f4ef" stroke="#8b6d48" stroke-width="1.6"/>
<text x="290" y="346" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">6</text>
<path d="M99 124L275 261" fill="none" stroke="#356653" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M99 191L275 183" fill="none" stroke="#356653" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M99 258L275 261" fill="none" stroke="#8b6d48" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#grey-arrow)"/>
<path d="M99 325L275 339" fill="none" stroke="#8b6d48" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#grey-arrow)"/>
<text x="82" y="376" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">B</text>
<text x="290" y="376" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#29352e">values in ω</text>
<text x="141" y="122" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#356653">A</text>
<text x="290" y="406" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#8b6d48">R = {6}</text>
<text x="560" y="78" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">After repair: h extends g</text>
<rect x="428" y="101" width="59" height="112" rx="8" fill="#dce9dc" stroke="#a7b5a6" stroke-width="1.2"/>
<circle cx="457" cy="124" r="16" fill="#f3f4ef" stroke="#356653" stroke-width="1.6"/>
<text x="457" y="131" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">0</text>
<circle cx="457" cy="191" r="16" fill="#f3f4ef" stroke="#356653" stroke-width="1.6"/>
<text x="457" y="198" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">1</text>
<circle cx="457" cy="258" r="16" fill="#f3f4ef" stroke="#356653" stroke-width="1.6"/>
<text x="457" y="265" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">2</text>
<circle cx="457" cy="325" r="16" fill="#f3f4ef" stroke="#356653" stroke-width="1.6"/>
<text x="457" y="332" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">3</text>
<circle cx="665" cy="105" r="13" fill="#f3f4ef" stroke="#a7b5a6" stroke-width="1.6"/>
<text x="665" y="112" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">0</text>
<circle cx="665" cy="144" r="13" fill="#f3f4ef" stroke="#a7b5a6" stroke-width="1.6"/>
<text x="665" y="151" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">1</text>
<circle cx="665" cy="183" r="13" fill="#f3f4ef" stroke="#a7b5a6" stroke-width="1.6"/>
<text x="665" y="190" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">2</text>
<circle cx="665" cy="222" r="13" fill="#f3f4ef" stroke="#a7b5a6" stroke-width="1.6"/>
<text x="665" y="229" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">3</text>
<circle cx="665" cy="261" r="13" fill="#f3f4ef" stroke="#a7b5a6" stroke-width="1.6"/>
<text x="665" y="268" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">4</text>
<circle cx="665" cy="300" r="13" fill="#f3f4ef" stroke="#a7b5a6" stroke-width="1.6"/>
<text x="665" y="307" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">5</text>
<circle cx="665" cy="339" r="13" fill="#f3f4ef" stroke="#8b6d48" stroke-width="1.6"/>
<text x="665" y="346" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">6</text>
<path d="M474 124L650 261" fill="none" stroke="#356653" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M474 191L650 183" fill="none" stroke="#356653" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M474 258L650 144" fill="none" stroke="#356653" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M474 325L650 222" fill="none" stroke="#356653" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="457" y="376" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">B</text>
<text x="665" y="376" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#29352e">values in ω</text>
<text x="516" y="122" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#356653">A</text>
<text x="665" y="406" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#8b6d48">R = {6}</text>
<path d="M45 431L715 431" fill="none" stroke="#a7b5a6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="380" y="465" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">At a limit: exact extensions h<tspan baseline-shift="sub" font-size="70%">0</tspan> ⊆ h<tspan baseline-shift="sub" font-size="70%">1</tspan> ⊆ h<tspan baseline-shift="sub" font-size="70%">2</tspan> ⊆ ⋯</text>
<circle cx="140" cy="504" r="6" fill="#356653" stroke="#356653" stroke-width="1.6"/>
<text x="140" y="491" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">h<tspan baseline-shift="sub" font-size="70%">0</tspan></text>
<path d="M153 504L281 504" fill="none" stroke="#356653" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="140" y="544" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="middle" fill="#29352e">R<tspan baseline-shift="sub" font-size="70%">0</tspan> = ∅</text>
<circle cx="300" cy="504" r="6" fill="#356653" stroke="#356653" stroke-width="1.6"/>
<text x="300" y="491" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">h<tspan baseline-shift="sub" font-size="70%">1</tspan></text>
<path d="M313 504L441 504" fill="none" stroke="#356653" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="300" y="544" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="middle" fill="#29352e">R<tspan baseline-shift="sub" font-size="70%">1</tspan> = {r<tspan baseline-shift="sub" font-size="70%">0</tspan>}</text>
<circle cx="460" cy="504" r="6" fill="#356653" stroke="#356653" stroke-width="1.6"/>
<text x="460" y="491" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">h<tspan baseline-shift="sub" font-size="70%">2</tspan></text>
<path d="M473 504L601 504" fill="none" stroke="#356653" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="460" y="544" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="middle" fill="#29352e">R<tspan baseline-shift="sub" font-size="70%">2</tspan> = {r<tspan baseline-shift="sub" font-size="70%">0</tspan>,r<tspan baseline-shift="sub" font-size="70%">1</tspan>}</text>
<circle cx="620" cy="504" r="6" fill="#356653" stroke="#356653" stroke-width="1.6"/>
<text x="620" y="491" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">h<tspan baseline-shift="sub" font-size="70%">3</tspan></text>
<text x="620" y="544" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="middle" fill="#29352e">R<tspan baseline-shift="sub" font-size="70%">3</tspan> = {r<tspan baseline-shift="sub" font-size="70%">0</tspan>,r<tspan baseline-shift="sub" font-size="70%">1</tspan>,r<tspan baseline-shift="sub" font-size="70%">2</tspan>}</text>
<text x="380" y="586" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">Each later range avoids every value already reserved.</text>
</svg>
