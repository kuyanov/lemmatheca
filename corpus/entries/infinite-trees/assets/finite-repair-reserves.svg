<circle cx="457" cy="124" r="16" fill="#f3f4ef" stroke="#356653" stroke-width="1.6"/>
<text x="457" y="131" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">0</text>
<circle cx="457" cy="191" r="16" fill="#f3f4ef" stroke="#356653" stroke-width="1.6"/>
<text x="457" y="198" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">1</text>
<circle cx="457" cy="258" r="16" fill="#f3f4ef" stroke="#356653" stroke-width="1.6"/>
<text x="457" y="265" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">2</text>
<circle cx="457" cy="325" r="16" fill="#f3f4ef" stroke="#356653" stroke-width="1.6"/>
<text x="457" y="332" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">3</text>
<circle cx="665" cy="105" r="13" fill="#f3f4ef" stroke="#a7b5a6" stroke-width="1.6"/>
<text x="665" y="112" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">0</text>
<circle cx="665" cy="144" r="13" fill="#f3f4ef" stroke="#a7b5a6" stroke-width="1.6"/>
<text x="665" y="151" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">1</text>
<circle cx="665" cy="183" r="13" fill="#f3f4ef" stroke="#a7b5a6" stroke-width="1.6"/>
<text x="665" y="190" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">2</text>
<circle cx="665" cy="222" r="13" fill="#f3f4ef" stroke="#a7b5a6" stroke-width="1.6"/>
<text x="665" y="229" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">3</text>
