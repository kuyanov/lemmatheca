<text x="620" y="544" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="middle" fill="#29352e">R<tspan baseline-shift="sub" font-size="70%">3</tspan> = {r<tspan baseline-shift="sub" font-size="70%">0</tspan>,r<tspan baseline-shift="sub" font-size="70%">1</tspan>,r<tspan baseline-shift="sub" font-size="70%">2</tspan>}</text>
<text x="380" y="586" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">Each later range avoids every value already reserved.</text>
