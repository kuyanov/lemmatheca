<path d="M98.78758773380608 190.35432354869977L276.2101957900879 183.53037708499662" fill="none" stroke="#356653" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M98.79825286133925 258.2422824931924L276.2014351496142 260.80098223773484" fill="none" stroke="#8b6d48" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5.040387315067206 4.032309852053765" marker-end="url(#warn-arrow)"/>
<path d="M98.7620740803022 326.1282165246357L276.2311534340375 338.0732507119064" fill="none" stroke="#8b6d48" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5.053142654301538 4.04251412344123" marker-end="url(#warn-arrow)"/>
<circle cx="82" cy="124" r="16" fill="#f3f4ef" stroke="#356653" stroke-width="1.6"/>
<text x="82" y="131" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">0</text>
<circle cx="82" cy="191" r="16" fill="#f3f4ef" stroke="#356653" stroke-width="1.6"/>
<text x="82" y="198" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">1</text>
<circle cx="82" cy="258" r="16" fill="#f3f4ef" stroke="#356653" stroke-width="1.6"/>
<text x="82" y="265" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">2</text>
