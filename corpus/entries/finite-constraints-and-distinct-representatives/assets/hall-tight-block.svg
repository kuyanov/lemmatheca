<svg xmlns="http://www.w3.org/2000/svg" width="760" height="415" viewBox="0 0 760 415" role="img" aria-labelledby="title desc">
<title id="title">A tight Hall block leaves a disjoint residual problem</title><desc id="desc">Two bipartite diagrams use A zero equals A one equals zero and one, and A two equals one and two. The tight block J zero and one occupies values zero and one; deleting those values leaves value two for index two.</desc>
