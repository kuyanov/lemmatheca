<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Agreement on a chosen finite domain</title>
  <desc id="desc">The values of a global map f and a local map g_F coincide on J, a finite subset of F. Other values need not coincide.</desc>
  <defs>
    <style>
      text { font-family: Georgia, 'Times New Roman', serif; fill: #34413b; font-size: 19px; }
      .small { font-size: 16px; fill: #65736c; }
      .line { stroke: #81958a; stroke-width: 1.4; fill: none; }
      .agreement { fill: #edf4ee; stroke: #7d9b86; stroke-width: 1.2; }
    </style>
  </defs>
  <rect x="24" y="30" width="672" height="102" rx="9" fill="#f7f8f5" stroke="#ccd5cf" stroke-width="1.2"/>
  <rect x="24" y="151" width="672" height="102" rx="9" fill="#f7f8f5" stroke="#ccd5cf" stroke-width="1.2"/>
  <rect class="agreement" x="190" y="55" width="213" height="173" rx="8"/>
  <text x="43" y="66">Global f on I</text>
  <text x="43" y="188">Local g<tspan baseline-shift="sub" font-size="14">F</tspan> on F</text>
  <text x="220" y="84">i ↦ a</text><text x="326" y="84">j ↦ b</text>
  <text x="450" y="84">k ↦ c</text><text x="574" y="84">…</text>
  <text x="220" y="205">i ↦ a</text><text x="326" y="205">j ↦ b</text>
  <text x="450" y="205">k ↦ d</text><text x="574" y="205">…</text>
  <path class="line" d="M253 94 V120 M253 153 V178 M359 94 V120 M359 153 V178"/>
  <text class="small" x="222" y="143">Agreement on J</text>
  <text class="small" x="444" y="120">Other values may differ</text>
  <text class="small" x="451" y="241">J ⊆ F, with F finite</text>
</svg>
