<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530" role="img" aria-labelledby="title desc">
<title id="title">Transporting a decision procedure through a reduction</title><desc id="desc">An input passes through the total translation f and then a hypothetical decider for B. Its Boolean answer is unchanged and decides A. The lower diagram shows a total sentence-code translation: valid sentence code n yields the implication q to A, and any malformed code yields falsity.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245b4b"/></marker></defs>
<rect width="760" height="530" fill="#f3f4ef"/>
<text x="28" y="36" font-family="Georgia, Times New Roman, serif" font-size="23" text-anchor="start" fill="#252d29">Translate the question and keep the answer</text>
<text x="58" y="131" font-family="Georgia, Times New Roman, serif" font-size="25" text-anchor="middle" fill="#252d29">x</text>
<path d="M85 124L156 124" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="156" y="86" width="170" height="76" rx="5" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="241.0" y="117.0" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">total translation</text>
<text x="241.0" y="143.0" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">f</text>
<path d="M326 124L424 124" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="375" y="108" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">f(x)</text>
<rect x="424" y="86" width="181" height="76" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="514.5" y="117.0" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">hypothetical</text>
<text x="514.5" y="143.0" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">B-decider</text>
<path d="M605 124L670 124" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="702" y="130" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">0 or 1</text>
<text x="702" y="178" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#73796f">χ<tspan baseline-shift="sub" font-size="70%">A</tspan>(x)</text>
<text x="380" y="222" font-family="Georgia, Times New Roman, serif" font-size="24" text-anchor="middle" fill="#252d29">A ≤<tspan baseline-shift="sub" font-size="70%">m</tspan> B:   χ<tspan baseline-shift="sub" font-size="70%">A</tspan> = χ<tspan baseline-shift="sub" font-size="70%">B</tspan> ∘ f</text>
<path d="M28 257L732 257" fill="none" stroke="#bbc7b9" stroke-width="1"/>
<text x="28" y="294" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="start" fill="#73796f" font-weight="600">THE MAP FROM Thm(Q) TO Val</text>
<text x="49" y="396" font-family="Georgia, Times New Roman, serif" font-size="25" text-anchor="start" fill="#252d29">n</text>
<path d="M72 390L137 390" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="137" y="352" width="209" height="76" rx="5" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="241.5" y="383.0" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">sentence-code</text>
<text x="241.5" y="409.0" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">test Sent(n)</text>
<path d="M346 373L397 337L482 337" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="405" y="321" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="middle" fill="#73796f">yes: n=⌜A⌝</text>
<path d="M346 410L397 446L482 446" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="397" y="432" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="middle" fill="#73796f">no</text>
<rect x="482" y="305" width="245" height="64" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="604.5" y="343.0" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#252d29">f(n) = ⌜q → A⌝</text>
<rect x="482" y="414" width="245" height="64" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="604.5" y="452.0" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#252d29">f(n) = ⌜⊥⌝</text>
<text x="380" y="513" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="middle" fill="#73796f">q is the conjunction of the seven Robinson axioms; both branches finish.</text>
</svg>
