<title id="title">Both generic branches give truth without a direct auxiliary witness at the top</title><desc id="desc">Two panels show the generic filters through a and through b in the three-point forcing fork. Each activates one attachment of tau and gives value singleton empty. At the top neither attachment meets the direct auxiliary inequality1 below a or b.</desc>
