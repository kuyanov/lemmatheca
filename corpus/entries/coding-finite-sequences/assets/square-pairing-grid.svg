<svg xmlns="http://www.w3.org/2000/svg" width="760" height="465" viewBox="0 0 760 465" role="img" aria-labelledby="title desc">
<title id="title">Square pairing and its inverse branches</title><desc id="desc">Rows are the first coordinate and columns the second. Pairing ranks fill square shells. In shell q equals two, the first branch has ranks four and five in column two; the second has six, seven and eight in row two. Rank seven decodes to the pair two, one.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245b4b"/></marker></defs>
<rect width="760" height="465" fill="#f3f4ef"/>
<text x="28" y="36" font-family="Georgia, Times New Roman, serif" font-size="23" text-anchor="start" fill="#252d29">One square shell, two consecutive runs</text>
<text x="203" y="77" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#73796f">second coordinate b</text>
<text x="70" y="137" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">0</text>
<text x="111" y="101" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">0</text>
<rect x="86" y="112" width="50" height="50" rx="3" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="111" y="145" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#252d29">0</text>
<text x="165" y="101" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">1</text>
<rect x="140" y="112" width="50" height="50" rx="3" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="165" y="145" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#252d29">1</text>
<text x="219" y="101" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">2</text>
<rect x="194" y="112" width="50" height="50" rx="3" fill="#e1e9dc" stroke="#245b4b" stroke-width="1.2"/>
<text x="219" y="145" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#252d29">4</text>
<text x="273" y="101" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">3</text>
<rect x="248" y="112" width="50" height="50" rx="3" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="273" y="145" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#252d29">9</text>
<text x="70" y="191" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">1</text>
<rect x="86" y="166" width="50" height="50" rx="3" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="111" y="199" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#252d29">2</text>
<rect x="140" y="166" width="50" height="50" rx="3" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="165" y="199" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#252d29">3</text>
<rect x="194" y="166" width="50" height="50" rx="3" fill="#e1e9dc" stroke="#245b4b" stroke-width="1.2"/>
<text x="219" y="199" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#252d29">5</text>
<rect x="248" y="166" width="50" height="50" rx="3" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="273" y="199" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#252d29">10</text>
<text x="70" y="245" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">2</text>
<rect x="86" y="220" width="50" height="50" rx="3" fill="#c4d4c1" stroke="#245b4b" stroke-width="1.2"/>
<text x="111" y="253" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#252d29">6</text>
<rect x="140" y="220" width="50" height="50" rx="3" fill="#c4d4c1" stroke="#245b4b" stroke-width="1.2"/>
