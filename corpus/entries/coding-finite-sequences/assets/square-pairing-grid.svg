<text x="70" y="299" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">3</text>
<rect x="86" y="274" width="50" height="50" rx="3" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="111" y="307" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#252d29">12</text>
<rect x="140" y="274" width="50" height="50" rx="3" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="165" y="307" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#252d29">13</text>
<rect x="194" y="274" width="50" height="50" rx="3" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="219" y="307" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#252d29">14</text>
<rect x="248" y="274" width="50" height="50" rx="3" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="273" y="307" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#252d29">15</text>
<text x="24" y="351" font-family="Georgia, Times New Roman, serif" font-size="16" text-anchor="start" fill="#73796f">rows: a</text>
<text x="390" y="102" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="start" fill="#73796f" font-weight="600">SHELL q = 2</text>
<rect x="392" y="122" width="20" height="20" rx="5" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="425" y="139" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="start" fill="#252d29">a &lt; q:   (0,2), (1,2)</text>
<text x="425" y="169" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="start" fill="#73796f">q² … q²+q−1  =  4, 5</text>
<rect x="392" y="199" width="20" height="20" rx="5" fill="#c4d4c1" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="425" y="216" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="start" fill="#252d29">b ≤ q:   (2,0), (2,1), (2,2)</text>
<text x="425" y="247" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="start" fill="#73796f">q²+q … (q+1)²−1  =  6, 7, 8</text>
<rect x="137" y="217" width="56" height="56" rx="4" fill="none" stroke="#245b4b" stroke-width="2.5"/>
<rect x="390" y="288" width="333" height="79" rx="5" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="556.5" y="320.5" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#252d29">7 − 2² = 3 ≥ 2</text>
<text x="556.5" y="346.5" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#252d29">(u(7),v(7)) = (2,3−2) = (2,1)</text>
<path d="M28 393L732 393" fill="none" stroke="#bbc7b9" stroke-width="1"/>
<text x="380" y="427" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#252d29">First find q = ⌊√n⌋, then select the branch using r = n−q².</text>
</svg>
