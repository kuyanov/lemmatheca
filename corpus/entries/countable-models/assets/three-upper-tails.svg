<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img" aria-labelledby="title desc">
<title id="title">Three upper tails above an increasing named sequence</title><desc id="desc">The orders Q, Q+Q, and Q+1+Q have respectively no upper tail, a tail without a least point, and a tail with a least point u.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#245b4b" stroke-width="1.2"/></marker></defs>
<rect width="760" height="490" fill="#f3f4ef"/>
<g font-family="Georgia, 'Times New Roman', serif"><text x="380" y="33" font-size="24" fill="#354437" text-anchor="middle">Same named lower cells; three possible upper tails</text><text x="35" y="88" font-size="22" fill="#354437" text-anchor="start">ℚ</text><path d="M150,100 L697,100" fill="none" stroke="#778071" stroke-width="1.3" marker-end="url(#arrow)"/><text x="141" y="106" font-size="21" fill="#778071" text-anchor="middle">⋯</text><circle cx="205" cy="100" r="5" fill="#245b4b"/><text x="205" y="129" font-size="20" fill="#245b4b" text-anchor="middle">c<tspan baseline-shift="sub" font-size="70%">0</tspan></text><circle cx="290" cy="100" r="5" fill="#245b4b"/><text x="290" y="129" font-size="20" fill="#245b4b" text-anchor="middle">c<tspan baseline-shift="sub" font-size="70%">1</tspan></text><circle cx="375" cy="100" r="5" fill="#245b4b"/><text x="375" y="129" font-size="20" fill="#245b4b" text-anchor="middle">c<tspan baseline-shift="sub" font-size="70%">2</tspan></text><path d="M157,100 L200,100" fill="none" stroke="#245b4b" stroke-width="6"/><path d="M210,100 L285,100" fill="none" stroke="#245b4b" stroke-width="6"/><path d="M295,100 L370,100" fill="none" stroke="#245b4b" stroke-width="6"/><path d="M380,100 L442,100" fill="none" stroke="#245b4b" stroke-width="6"/><text x="454" y="106" font-size="23" fill="#778071" text-anchor="middle">⋯</text><text x="585" y="80" font-size="18" fill="#778071" text-anchor="middle">no points above all c<tspan baseline-shift="sub" font-size="70%">n</tspan></text><text x="35" y="207" font-size="22" fill="#354437" text-anchor="start">ℚ + ℚ</text><path d="M150,219 L697,219" fill="none" stroke="#778071" stroke-width="1.3" marker-end="url(#arrow)"/><text x="141" y="225" font-size="21" fill="#778071" text-anchor="middle">⋯</text><circle cx="205" cy="219" r="5" fill="#245b4b"/><text x="205" y="248" font-size="20" fill="#245b4b" text-anchor="middle">c<tspan baseline-shift="sub" font-size="70%">0</tspan></text><circle cx="290" cy="219" r="5" fill="#245b4b"/><text x="290" y="248" font-size="20" fill="#245b4b" text-anchor="middle">c<tspan baseline-shift="sub" font-size="70%">1</tspan></text><circle cx="375" cy="219" r="5" fill="#245b4b"/><text x="375" y="248" font-size="20" fill="#245b4b" text-anchor="middle">c<tspan baseline-shift="sub" font-size="70%">2</tspan></text><path d="M157,219 L200,219" fill="none" stroke="#245b4b" stroke-width="6"/><path d="M210,219 L285,219" fill="none" stroke="#245b4b" stroke-width="6"/><path d="M295,219 L370,219" fill="none" stroke="#245b4b" stroke-width="6"/><path d="M380,219 L442,219" fill="none" stroke="#245b4b" stroke-width="6"/><text x="454" y="225" font-size="23" fill="#778071" text-anchor="middle">⋯</text><path d="M480,191 L480,249" fill="none" stroke="#b4bfae" stroke-width="1" stroke-dasharray="4 5"/><rect x="502" y="192" width="184" height="53" rx="5" fill="#e3ebdf" stroke="#e3ebdf" stroke-width="1.1"/><path d="M512,219 L685,219" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="516" y="226" font-size="24" fill="#245b4b" text-anchor="middle">⋯</text><text x="597" y="180" font-size="18" fill="#245b4b" text-anchor="middle">U<tspan baseline-shift="sub" font-size="70%">M</tspan>: no least point</text><text x="35" y="326" font-size="22" fill="#354437" text-anchor="start">ℚ + 1 + ℚ</text><path d="M150,338 L697,338" fill="none" stroke="#778071" stroke-width="1.3" marker-end="url(#arrow)"/><text x="141" y="344" font-size="21" fill="#778071" text-anchor="middle">⋯</text><circle cx="205" cy="338" r="5" fill="#245b4b"/><text x="205" y="367" font-size="20" fill="#245b4b" text-anchor="middle">c<tspan baseline-shift="sub" font-size="70%">0</tspan></text><circle cx="290" cy="338" r="5" fill="#245b4b"/><text x="290" y="367" font-size="20" fill="#245b4b" text-anchor="middle">c<tspan baseline-shift="sub" font-size="70%">1</tspan></text><circle cx="375" cy="338" r="5" fill="#245b4b"/><text x="375" y="367" font-size="20" fill="#245b4b" text-anchor="middle">c<tspan baseline-shift="sub" font-size="70%">2</tspan></text><path d="M157,338 L200,338" fill="none" stroke="#245b4b" stroke-width="6"/><path d="M210,338 L285,338" fill="none" stroke="#245b4b" stroke-width="6"/><path d="M295,338 L370,338" fill="none" stroke="#245b4b" stroke-width="6"/><path d="M380,338 L442,338" fill="none" stroke="#245b4b" stroke-width="6"/><text x="454" y="344" font-size="23" fill="#778071" text-anchor="middle">⋯</text><path d="M480,310 L480,368" fill="none" stroke="#b4bfae" stroke-width="1" stroke-dasharray="4 5"/><rect x="502" y="311" width="184" height="53" rx="5" fill="#e3ebdf" stroke="#e3ebdf" stroke-width="1.1"/><path d="M512,338 L685,338" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/><circle cx="512" cy="338" r="7" fill="#245b4b"/><text x="512" y="388" font-size="22" fill="#245b4b" text-anchor="middle">u</text><text x="597" y="299" font-size="18" fill="#245b4b" text-anchor="middle">U<tspan baseline-shift="sub" font-size="70%">M</tspan>: least point u</text><text x="380" y="455" font-size="18" fill="#778071" text-anchor="middle">Thick segments are corresponding open cells, each a rational-order copy.</text><text x="380" y="481" font-size="18" fill="#778071" text-anchor="middle">The dashed separator is a cut, not an extra point or an adjacent pair.</text></g></svg>
