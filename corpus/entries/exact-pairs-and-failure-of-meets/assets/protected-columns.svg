<svg xmlns="http://www.w3.org/2000/svg" width="660" height="380" viewBox="0 0 660 380" role="img" aria-labelledby="title desc">
<title id="title">Protected columns beyond a finite seed</title>
<desc id="desc">At protection level two, a seed of length five occupies paired positions zero through four. Later positions in columns zero and one copy the prescribed sets, while columns two and three remain free.</desc>
<rect width="660" height="380" fill="#ffffff"/>
<g font-family="system-ui,sans-serif" fill="#17232a" text-anchor="middle">
<text x="330" y="26" font-size="18" font-weight="600">Protection level 2 · seed length 5</text>
<text x="153" y="58" font-size="15">column 0</text>
<text x="153" y="78" font-size="12" fill="#526269">protected</text>
<text x="288" y="58" font-size="15">column 1</text>
<text x="288" y="78" font-size="12" fill="#526269">protected</text>
<text x="423" y="58" font-size="15">column 2</text>
<text x="423" y="78" font-size="12" fill="#526269">unprotected</text>
<text x="558" y="58" font-size="15">column 3</text>
<text x="558" y="78" font-size="12" fill="#526269">unprotected</text>
<text x="50" y="123" font-size="14">x = 0</text>
<rect x="95" y="95" width="116" height="42" rx="3" fill="#dfebf4" stroke="#8b9a9e"/>
<text x="153" y="121" font-size="15">seed(0)</text>
<rect x="230" y="95" width="116" height="42" rx="3" fill="#dfebf4" stroke="#8b9a9e"/>
<text x="288" y="121" font-size="15">seed(2)</text>
<rect x="365" y="95" width="116" height="42" rx="3" fill="#fff" stroke="#8b9a9e"/>
<text x="423" y="121" font-size="15">free</text>
<rect x="500" y="95" width="116" height="42" rx="3" fill="#fff" stroke="#8b9a9e"/>
<text x="558" y="121" font-size="15">free</text>
<text x="50" y="171" font-size="14">x = 1</text>
<rect x="95" y="143" width="116" height="42" rx="3" fill="#dfebf4" stroke="#8b9a9e"/>
<text x="153" y="169" font-size="15">seed(1)</text>
<rect x="230" y="143" width="116" height="42" rx="3" fill="#dfebf4" stroke="#8b9a9e"/>
<text x="288" y="169" font-size="15">seed(3)</text>
<rect x="365" y="143" width="116" height="42" rx="3" fill="#fff" stroke="#8b9a9e"/>
<text x="423" y="169" font-size="15">free</text>
<rect x="500" y="143" width="116" height="42" rx="3" fill="#fff" stroke="#8b9a9e"/>
<text x="558" y="169" font-size="15">free</text>
<text x="50" y="219" font-size="14">x = 2</text>
<rect x="95" y="191" width="116" height="42" rx="3" fill="#dfebf4" stroke="#8b9a9e"/>
<text x="153" y="217" font-size="15">seed(4)</text>
<rect x="230" y="191" width="116" height="42" rx="3" fill="#e0eee6" stroke="#8b9a9e"/>
<text x="288" y="217" font-size="15">A1(2)</text>
<rect x="365" y="191" width="116" height="42" rx="3" fill="#fff" stroke="#8b9a9e"/>
<text x="423" y="217" font-size="15">free</text>
<rect x="500" y="191" width="116" height="42" rx="3" fill="#fff" stroke="#8b9a9e"/>
<text x="558" y="217" font-size="15">free</text>
<text x="50" y="267" font-size="14">x = 3</text>
<rect x="95" y="239" width="116" height="42" rx="3" fill="#e0eee6" stroke="#8b9a9e"/>
<text x="153" y="265" font-size="15">A0(3)</text>
<rect x="230" y="239" width="116" height="42" rx="3" fill="#e0eee6" stroke="#8b9a9e"/>
<text x="288" y="265" font-size="15">A1(3)</text>
<rect x="365" y="239" width="116" height="42" rx="3" fill="#fff" stroke="#8b9a9e"/>
<text x="423" y="265" font-size="15">free</text>
<rect x="500" y="239" width="116" height="42" rx="3" fill="#fff" stroke="#8b9a9e"/>
<text x="558" y="265" font-size="15">free</text>
<text x="50" y="315" font-size="14">x = 4</text>
<rect x="95" y="287" width="116" height="42" rx="3" fill="#e0eee6" stroke="#8b9a9e"/>
<text x="153" y="313" font-size="15">A0(4)</text>
<rect x="230" y="287" width="116" height="42" rx="3" fill="#e0eee6" stroke="#8b9a9e"/>
<text x="288" y="313" font-size="15">A1(4)</text>
<rect x="365" y="287" width="116" height="42" rx="3" fill="#fff" stroke="#8b9a9e"/>
<text x="423" y="313" font-size="15">free</text>
<rect x="500" y="287" width="116" height="42" rx="3" fill="#fff" stroke="#8b9a9e"/>
<text x="558" y="313" font-size="15">free</text>
<text x="330" y="365" font-size="13" fill="#526269">The same rule continues in every row x ≥ 5.</text>
</g></svg>
