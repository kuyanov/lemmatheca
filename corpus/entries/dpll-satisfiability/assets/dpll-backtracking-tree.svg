<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">Backtracking in the ordered DPLL example</title><desc id="desc">Trying p=1 produces contradictory unit clauses and fails; trying p=0 then q=1 succeeds and returns p=0,q=1.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" viewBox="0 0 8 8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 L2.5 4 Z" fill="#245b4b"/></marker></defs>
<rect width="760" height="430" fill="#f3f4ef"/>
<text x="380" y="42" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#303b34">[(¬p ∨ q), (¬p ∨ ¬q), (p ∨ q)]</text>
<circle cx="380" cy="66" r="4" fill="#245b4b" stroke="#245b4b" stroke-width="1.3"/>
<path d="M376.33105346874436 67.59337106500246 L205 142" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M383.66894653125564 67.59337106500246 L555 142" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="246" y="104" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#303b34">p = 1</text>
<text x="514" y="104" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#303b34">p = 0</text>
<text x="200" y="174" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#303b34">[(q), (¬q)]</text>
<text x="560" y="174" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#303b34">[(q)]</text>
<path d="M200 189 L200 248" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="266" y="224" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">unit q = 1</text>
<path d="M560 189 L560 248" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="626" y="224" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">unit q = 1</text>
<text x="200" y="282" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="29" fill="#956b60">[∅]</text>
<text x="560" y="282" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="29" fill="#245b4b">[]</text>
<text x="200" y="315" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">empty clause: failure</text>
<text x="560" y="315" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">empty CNF: success</text>
<path d="M166 270 C30 220 120 66 376.0 66.0" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="84" y="331" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">backtrack</text>
<path d="M560 328 L560 365" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="560" y="397" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#245b4b">return p = 0, q = 1</text>
<text x="245" y="398" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">restore the selected settings on return</text>
</svg>
