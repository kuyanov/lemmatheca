<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570" role="img" aria-labelledby="title desc"><title id="title">The diagonal construction crosses four object levels</title><desc id="desc">From B(x), form E(x). Encode it as e, form numeral e-bar, and substitute into E to form G. The numerical diagonal map sends e to g, the code of G.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#245b4b" stroke-width="1.2"/></marker></defs>
<rect width="760" height="570" fill="#f3f4ef"/>
<text x="80" y="47" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#303b34">B(x)</text>
<path d="M131 40 L259 40" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="495" y="47" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#245b4b">E(x) = ∃y(D(x,y) ∧ B(y))</text>
<text x="495" y="83" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">auxiliary formula</text>
<path d="M384 101 L195 174" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="246" y="118" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">encode</text>
<rect x="71" y="181" width="229" height="61" rx="6" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.2"/>
<text x="186" y="218" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#303b34">e = ⌜E⌝</text>
<text x="186" y="270" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">external natural number</text>
<path d="M315 210 L445 210" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380" y="188" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">form numeral</text>
<rect x="461" y="181" width="216" height="61" rx="6" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.2"/>
<text x="569" y="220" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="29" fill="#245b4b">ē</text>
<text x="569" y="270" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">arithmetic term</text>
<path d="M569 285 L569 336" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="658" y="316" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">substitute in E</text>
<rect x="421" y="347" width="294" height="61" rx="6" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.2"/>
<text x="568" y="386" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="27" fill="#245b4b">G = E(ē)</text>
<text x="568" y="438" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">constructed sentence</text>
<path d="M186 286 V409" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="213" y="354" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="27" fill="#245b4b">d</text>
<rect x="52" y="421" width="293" height="61" rx="6" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.2"/>
<text x="198" y="458" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#245b4b">g = d(e) = ⌜G⌝</text>
<path d="M420 387 C376 389 366 434 349 447" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="371" y="419" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">encode</text>
<text x="380" y="526" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#303b34">Q ⊢ ∀y (D(ē,y) ↔ y = ḡ)</text>
<text x="380" y="560" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#245b4b">Q ⊢ G ↔ B(ḡ)</text>
</svg>
