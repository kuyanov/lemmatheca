<svg xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-labelledby="title desc"><title id="title">The external standard copy can be unavailable</title><desc id="desc">The individual domain contains the numeral chain and a nonstandard element c. The external standard-copy subset A lies in the external power set but outside the available unary relation family D1.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" viewBox="0 0 8 8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 L2.5 4 Z" fill="#245b4b"/></marker></defs>
<rect width="760" height="455" fill="#f3f4ef"/>
<rect x="25" y="58" width="315" height="323" rx="6" fill="none" stroke="#8ea38a" stroke-width="1.2"/>
<text x="183" y="92" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b">individual domain M</text>
<ellipse cx="183" cy="182" rx="138" ry="74" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.2"/>
<text x="71" y="182" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#303b34">0</text>
<path d="M91 175 L118 175" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="140" y="182" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#303b34">S0</text>
<path d="M160 175 L187 175" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="214" y="182" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#303b34">S<tspan baseline-shift="super" font-size="75%">2</tspan>0</text>
<path d="M234 175 L261 175" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="285" y="182" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#303b34">…</text>
<text x="185" y="229" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#245b4b">A = {n<tspan baseline-shift="sub" font-size="75%">M</tspan> : n ∈ ℕ}</text>
<circle cx="260" cy="316" r="6" fill="#245b4b" stroke="#245b4b" stroke-width="1.3"/>
<text x="286" y="322" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#303b34">c</text>
<ellipse cx="565" cy="222" rx="172" ry="171" fill="none" stroke="#8ea38a" stroke-width="1.2"/>
<text x="565" y="86" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#245b4b">external 𝒫(M)</text>
<ellipse cx="603" cy="252" rx="104" ry="107" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.2"/>
<text x="603" y="187" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#245b4b">available D<tspan baseline-shift="sub" font-size="75%">1</tspan></text>
<circle cx="461" cy="147" r="6" fill="#245b4b" stroke="#245b4b" stroke-width="1.3"/>
<text x="505" y="132" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#245b4b">A ∉ D<tspan baseline-shift="sub" font-size="75%">1</tspan></text>
<circle cx="572" cy="246" r="5" fill="#245b4b" stroke="#245b4b" stroke-width="1.3"/>
<text x="572" y="275" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#303b34">∅</text>
<circle cx="641" cy="246" r="5" fill="#245b4b" stroke="#245b4b" stroke-width="1.3"/>
<text x="641" y="275" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#303b34">M</text>
<path d="M301.42001613098114 144.00427289915044 C370 122 412 121 455.69990587583044 144.1877051586039" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380" y="31" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">this subset</text>
<text x="380" y="425" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#245b4b">0 ∈ A,  S[A] ⊆ A,  c ∉ A: induction would fail if A were available.</text>
