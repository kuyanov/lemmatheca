<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img" aria-labelledby="title desc">
<title id="title">Place a finite collection of tuple labels in one homogeneous source set</title><desc id="desc">Four ordered target labels map to four increasing indices in H. Two overlapping pair tests use that same placement, while a retained unused label still receives its source tuple.</desc>
