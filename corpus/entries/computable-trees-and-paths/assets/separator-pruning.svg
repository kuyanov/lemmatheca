<svg xmlns="http://www.w3.org/2000/svg" width="420" height="405" viewBox="0 0 420 405" role="img" aria-labelledby="title desc">
  <title id="title">A finite stage removes longer candidates, not old prefixes</title>
  <desc id="desc">Position zero first enters A at stage three. All binary words through length two remain nodes. At length three, candidates beginning with zero are excluded and candidates beginning with one remain.</desc>
