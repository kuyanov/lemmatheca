<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700" role="img" aria-labelledby="title desc"><title id="title">The four bounded-quantifier proof branches</title><desc id="desc">A true universal loops through positive instances; a false universal uses one bounded counterexample. A true existential uses one witness; a false existential loops through negative instances. Every numeral-bound output is transported to its exact original term-bound code.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" viewBox="0 0 8 8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 L2.5 4 Z" fill="#245b4b"/></marker></defs>
<rect width="760" height="700" fill="#f3f4ef"/>
<text x="198" y="43" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#245b4b">true ∀</text>
<text x="565" y="43" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#245b4b">false ∀</text>
<text x="198" y="299" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#245b4b">true ∃</text>
<text x="565" y="299" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#245b4b">false ∃</text>
<path d="M380 63 L380 520" fill="none" stroke="#8ea38a" stroke-width="1.5"/>
<path d="M37 267 L723 267" fill="none" stroke="#8ea38a" stroke-width="1.5"/>
<text x="198" y="94" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#303b34">B(0), …, B(n̄)</text>
<path d="M84 111 L312 111" fill="none" stroke="#245b4b" stroke-width="1.5"/>
<text x="198" y="145" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">positive loop U<tspan baseline-shift="sub" font-size="75%">B</tspan></text>
<path d="M198 159 L198 191" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="198" y="231" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#245b4b">∀z ≤ n̄ B(z)</text>
<text x="565" y="94" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#303b34">i ≤ n,  ¬B(i)</text>
<text x="565" y="132" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">certify ī ≤ n̄ and ¬B(ī)</text>
<text x="565" y="170" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#303b34">[∀z ≤ n̄ B(z)]</text>
<path d="M458 185 L673 185" fill="none" stroke="#245b4b" stroke-width="1.5"/>
<text x="565" y="213" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#303b34">⊥</text>
<text x="565" y="247" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#245b4b">¬∀z ≤ n̄ B(z)</text>
<text x="198" y="352" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#303b34">ī ≤ n̄     B(ī)</text>
<path d="M81 375 L316 375" fill="none" stroke="#245b4b" stroke-width="1.5"/>
<text x="198" y="413" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#303b34">ī ≤ n̄ ∧ B(ī)</text>
<path d="M198 430 L198 463" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="198" y="505" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#245b4b">∃z ≤ n̄ B(z)</text>
<text x="293" y="459" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">∃I</text>
<text x="565" y="351" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#303b34">¬B(0), …, ¬B(n̄)</text>
<text x="565" y="385" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">negative-instance loop</text>
<text x="565" y="420" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#303b34">∀z ≤ n̄ ¬B(z)</text>
<text x="565" y="457" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#303b34">[∃z ≤ n̄ B(z)] → ⊥</text>
<text x="565" y="505" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#245b4b">¬∃z ≤ n̄ B(z)</text>
<rect x="25" y="15" width="710" height="521" rx="6" fill="none" stroke="#8ea38a" stroke-width="1.2"/>
<path d="M380 536 L380 595" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380" y="618" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b">prove t(x̄) = n̄; transport by equality substitution</text>
<text x="380" y="660" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#303b34">output: the literal original term-bound conclusion code</text>
<text x="380" y="690" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">The chosen witness and each quantifier rule carry their actual finite proof records.</text>
</svg>
