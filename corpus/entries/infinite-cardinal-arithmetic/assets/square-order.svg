<svg xmlns="http://www.w3.org/2000/svg" width="720" height="432" viewBox="0 0 720 432" role="img" aria-labelledby="title desc">
  <title id="title">Counting pairs in successive square shells</title>
  <desc id="desc">A five-by-five grid shows pairs in the order of their maximum coordinate, then their first coordinate, then their second coordinate. Rows give the first coordinate and columns the second. The numbers inside the cells give positions zero through twenty-four. Five muted green shades distinguish the shells with maximum coordinates zero through four.</desc>
  <style>
    .heading { fill: #252d29; font: 23px Georgia, "Times New Roman", serif; }
    .number { fill: #252d29; font: 20px Georgia, "Times New Roman", serif; text-anchor: middle; }
    .coordinate { fill: #73796f; font: 18px Georgia, "Times New Roman", serif; text-anchor: middle; }
    .legend-heading { fill: #252d29; font: 20px Georgia, "Times New Roman", serif; }
    .annotation { fill: #73796f; font: 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .cell { stroke: #cbdccf; stroke-width: 1; }
  </style>
