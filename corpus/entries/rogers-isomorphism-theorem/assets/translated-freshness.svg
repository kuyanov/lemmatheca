<svg xmlns="http://www.w3.org/2000/svg" width="420" height="430" viewBox="0 0 420 430" role="img" aria-labelledby="title desc">
  <title id="title">Freshness after translation</title>
  <desc id="desc">The compiler b sends standard indices on the left to alternative indices on the right. Previously chosen translated images form the finite forbidden list B. The new image must avoid that list.</desc>
  <defs><marker id="arrow" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#61786a"/></marker></defs>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#263c30">
    <text x="210" y="24" font-size="18">Freshness is tested after compilation</text>
  </g>
  <g fill="#f3f6f1" stroke="#61786a" stroke-width="1.2">
    <rect x="20" y="42" width="150" height="40" rx="5"/>
    <rect x="250" y="42" width="150" height="40" rx="5"/>
    <rect x="250" y="100" width="150" height="165" rx="8"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#263c30" font-size="17">
    <text x="95" y="67">standard φ names</text>
    <text x="325" y="67">ψ names</text>
  </g>
  <g fill="none" stroke="#61786a" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M95 140 H325"/>
    <path d="M95 220 H325"/>
    <path d="M95 340 H325"/>
  </g>
  <g fill="#315342"><circle cx="95" cy="140" r="4"/><circle cx="325" cy="140" r="4"/><circle cx="95" cy="220" r="4"/><circle cx="325" cy="220" r="4"/><circle cx="95" cy="340" r="4"/><circle cx="325" cy="340" r="4"/></g>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#263c30" font-size="17">
    <text x="95" y="165">r(e, 0)</text><text x="325" y="165">b(r(e, 0))</text>
    <text x="95" y="194">⋮</text><text x="325" y="194">⋮</text>
    <text x="95" y="245">r(e, k)</text><text x="325" y="245">b(r(e, k))</text>
    <text x="325" y="289" font-size="16">old images B</text>
    <text x="95" y="365">r(e, k+1)</text><text x="325" y="365">b(r(e, k+1))</text>
    <text x="210" y="128" font-style="italic">b</text><text x="210" y="208" font-style="italic">b</text><text x="210" y="328" font-style="italic">b</text>
    <text x="210" y="411" font-size="17">the new image lies outside B</text>
  </g>
</svg>
