<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc">
<title id="title">An index map induces a map on term values</title><desc id="desc">The square from index orders to their hulls commutes. Below, two equal term presentations with the same sorted support are transported to equal presentations in the other hull.</desc>
<defs><marker id="arrow" viewBox="0 0 10 9" markerWidth="10" markerHeight="9" markerUnits="userSpaceOnUse" refX="8.6" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#245b4b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-778071" viewBox="0 0 10 9" markerWidth="10" markerHeight="9" markerUnits="userSpaceOnUse" refX="8.6" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#778071" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="610" fill="#f3f4ef"/>
<g font-family="Georgia, 'Times New Roman', serif"><text x="380" y="33" font-size="24" fill="#354437" text-anchor="middle">One template p controls both hulls</text><text x="170" y="92" font-size="28" fill="#245b4b" text-anchor="middle">I</text><text x="170" y="225" font-size="27" fill="#245b4b" text-anchor="middle">EM*(I)</text><path d="M170,107 L170,190" fill="none" stroke="#778071" stroke-width="1.4" marker-end="url(#arrow-778071)"/><text x="152" y="157" font-size="18" fill="#778071" text-anchor="end">i ↦ b<tspan baseline-shift="sub" font-size="70%">i</tspan></text><text x="590" y="92" font-size="28" fill="#245b4b" text-anchor="middle">J</text><text x="590" y="225" font-size="27" fill="#245b4b" text-anchor="middle">EM*(J)</text><path d="M590,107 L590,190" fill="none" stroke="#778071" stroke-width="1.4" marker-end="url(#arrow-778071)"/><text x="572" y="157" font-size="18" fill="#778071" text-anchor="end">j ↦ b<tspan baseline-shift="sub" font-size="70%">j</tspan></text><path d="M215,83 L545,83" fill="none" stroke="#245b4b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="380" y="67" font-size="21" fill="#245b4b" text-anchor="middle">f: increasing</text><path d="M260,216 L500,216" fill="none" stroke="#245b4b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="380" y="199" font-size="21" fill="#245b4b" text-anchor="middle">f̂: elementary</text><text x="380" y="265" font-size="18" fill="#778071" text-anchor="middle">Skeleton maps land among the generators; they need not cover the hull.</text><path d="M40,289 L720,289" fill="none" stroke="#b4bfae" stroke-width="1"/><circle cx="75" cy="346" r="19" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="75" y="353" font-size="22" fill="#245b4b" text-anchor="middle">k<tspan baseline-shift="sub" font-size="70%">0</tspan></text><circle cx="180" cy="346" r="19" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="180" y="353" font-size="22" fill="#245b4b" text-anchor="middle">k<tspan baseline-shift="sub" font-size="70%">1</tspan></text><circle cx="285" cy="346" r="19" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="285" y="353" font-size="22" fill="#245b4b" text-anchor="middle">k<tspan baseline-shift="sub" font-size="70%">2</tspan></text><text x="180" y="311" font-size="19" fill="#778071" text-anchor="middle">one increasing support</text><path d="M84.03482365294401,362.7144237579464 L115.0,420.0" fill="none" stroke="#778071" stroke-width="1.2" marker-end="url(#arrow-778071)"/><path d="M285,365 C285,395 115,395 115,420" fill="none" stroke="#245b4b" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M285,365 C310,412 150,413 150,420" fill="none" stroke="#245b4b" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M194.33024345536256,358.47574136113917 L265.0,420.0" fill="none" stroke="#778071" stroke-width="1.2" marker-end="url(#arrow-778071)"/><text x="125" y="452" font-size="19" fill="#245b4b" text-anchor="middle">t(b<tspan baseline-shift="sub" font-size="70%">2</tspan>,b<tspan baseline-shift="sub" font-size="70%">0</tspan>,b<tspan baseline-shift="sub" font-size="70%">2</tspan>)</text><text x="275" y="452" font-size="19" fill="#245b4b" text-anchor="middle">u(b<tspan baseline-shift="sub" font-size="70%">1</tspan>)</text><path d="M125.0,468.0 L192.07178020596024,514.577625143028" fill="none" stroke="#778071" stroke-width="1.3" marker-end="url(#arrow-778071)"/><path d="M275.0,468.0 L202.05127483378325,514.7620033116774" fill="none" stroke="#778071" stroke-width="1.3" marker-end="url(#arrow-778071)"/><circle cx="197" cy="518" r="6" fill="#245b4b"/><text x="197" y="547" font-size="19" fill="#245b4b" text-anchor="middle">one value a</text><circle cx="465" cy="346" r="25" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="465" y="353" font-size="22" fill="#245b4b" text-anchor="middle">f(k<tspan baseline-shift="sub" font-size="70%">0</tspan>)</text><circle cx="570" cy="346" r="25" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="570" y="353" font-size="22" fill="#245b4b" text-anchor="middle">f(k<tspan baseline-shift="sub" font-size="70%">1</tspan>)</text><circle cx="675" cy="346" r="25" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="675" y="353" font-size="22" fill="#245b4b" text-anchor="middle">f(k<tspan baseline-shift="sub" font-size="70%">2</tspan>)</text><text x="570" y="311" font-size="19" fill="#778071" text-anchor="middle">one increasing support</text><path d="M476.8879258591368,367.9926628394032 L505.0,420.0" fill="none" stroke="#778071" stroke-width="1.2" marker-end="url(#arrow-778071)"/><path d="M675,371 C675,395 505,395 505,420" fill="none" stroke="#245b4b" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M675,371 C700,412 540,413 540,420" fill="none" stroke="#245b4b" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M588.855583493898,362.41544915939363 L655.0,420.0" fill="none" stroke="#778071" stroke-width="1.2" marker-end="url(#arrow-778071)"/><text x="515" y="452" font-size="19" fill="#245b4b" text-anchor="middle">t(bf<tspan baseline-shift="sub" font-size="70%">2</tspan>,bf<tspan baseline-shift="sub" font-size="70%">0</tspan>,bf<tspan baseline-shift="sub" font-size="70%">2</tspan>)</text><text x="665" y="452" font-size="19" fill="#245b4b" text-anchor="middle">u(bf<tspan baseline-shift="sub" font-size="70%">1</tspan>)</text><path d="M515.0,468.0 L582.0717802059602,514.577625143028" fill="none" stroke="#778071" stroke-width="1.3" marker-end="url(#arrow-778071)"/><path d="M665.0,468.0 L592.0512748337833,514.7620033116774" fill="none" stroke="#778071" stroke-width="1.3" marker-end="url(#arrow-778071)"/><circle cx="587" cy="518" r="6" fill="#245b4b"/><text x="587" y="547" font-size="19" fill="#245b4b" text-anchor="middle">one value f̂(a)</text><path d="M203.0,518.0 L581.0,518.0" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="391" y="504" font-size="18" fill="#245b4b" text-anchor="middle">same equality in p<tspan baseline-shift="sub" font-size="70%">3</tspan></text><circle cx="197" cy="518" r="6" fill="#245b4b"/><circle cx="587" cy="518" r="6" fill="#245b4b"/><text x="380" y="585" font-size="17" fill="#778071" text-anchor="middle">Here b<tspan baseline-shift="sub" font-size="70%">0</tspan> = b(k<tspan baseline-shift="sub" font-size="70%">0</tspan>) and bf<tspan baseline-shift="sub" font-size="70%">0</tspan> = b(f(k<tspan baseline-shift="sub" font-size="70%">0</tspan>)); likewise for 1 and 2.</text></g></svg>
