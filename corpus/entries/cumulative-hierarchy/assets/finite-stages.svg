<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title desc">
  <title id="title">Finite stages and their first limit</title>
  <desc id="desc">The stages V zero through V four have zero, one, two, four, and sixteen members. Each arrow is a power-set step. V omega is the union of all finite stages.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#245b4b" stroke-width="1.2"/></marker></defs>
  <rect width="760" height="280" fill="#f3f4ef"/>
  <g fill="#e5ede3" stroke="#8ea38a" stroke-width="1.2">
    <rect x="30" y="65" width="105" height="82" rx="5"/>
    <rect x="170" y="65" width="105" height="82" rx="5"/>
    <rect x="310" y="65" width="105" height="82" rx="5"/>
    <rect x="450" y="65" width="105" height="82" rx="5"/>
    <rect x="590" y="65" width="105" height="82" rx="5"/>
  </g>
  <g fill="none" stroke="#245b4b" stroke-width="1.4" marker-end="url(#arrow)"><path d="M139 106 H165"/><path d="M279 106 H305"/><path d="M419 106 H445"/><path d="M559 106 H585"/><path d="M699 106 H725"/></g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#245b4b" text-anchor="middle"><text x="82" y="96">V₀</text><text x="222" y="96">V₁</text><text x="362" y="96">V₂</text><text x="502" y="96">V₃</text><text x="642" y="96">V₄</text><text x="735" y="113">…</text></g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#252d29" text-anchor="middle"><text x="82" y="125">0 members</text><text x="222" y="125">1 member</text><text x="362" y="125">2 members</text><text x="502" y="125">4 members</text><text x="642" y="125">16 members</text></g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#73796f" text-anchor="middle"><text x="380" y="35">Each arrow takes the power set of the preceding stage.</text><text x="380" y="242">Every member of V<tspan baseline-shift="sub" font-size="70%">ω</tspan> occurs in some finite stage.</text></g>
  <path d="M35 170 V182 H725 V170" fill="none" stroke="#8ea38a" stroke-width="1.2"/>
  <text x="380" y="213" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#245b4b">V<tspan baseline-shift="sub" font-size="70%">ω</tspan> = union of all finite stages</text>
</svg>
