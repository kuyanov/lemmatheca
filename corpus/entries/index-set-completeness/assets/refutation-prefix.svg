<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">A permanent candidate cuts off the domain</title>
  <desc id="desc">Rows show the refutations required by inputs zero through four. Candidate two is permanent, so inputs zero and one halt while all later inputs wait forever.</desc>
  <rect width="760" height="390" fill="#fff"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#263b32">
    <text x="30" y="36">First permanent candidate: a = 2</text>
    <text x="310" y="80" text-anchor="middle">candidate y</text>
    <text x="86" y="113" text-anchor="middle">input n</text>
    <text x="218" y="113" text-anchor="middle">0</text>
    <text x="284" y="113" text-anchor="middle">1</text>
    <text x="350" y="113" text-anchor="middle">2</text>
    <text x="416" y="113" text-anchor="middle">3</text>
    <text x="482" y="113" text-anchor="middle">4</text>
    <text x="630" y="113" text-anchor="middle">result</text>
  </g>
  <g stroke="#c9d3ce" stroke-width="1">
    <path d="M180 128H516M180 168H516M180 208H516M180 248H516M180 288H516M180 328H516"/>
    <path d="M185 128V328M251 128V328M317 128V328M383 128V328M449 128V328M515 128V328"/>
  </g>
  <g fill="#e5eee8">
    <rect x="192" y="135" width="52" height="26" rx="4"/>
    <rect x="192" y="175" width="52" height="26" rx="4"/><rect x="258" y="175" width="52" height="26" rx="4"/>
    <rect x="192" y="215" width="52" height="26" rx="4"/><rect x="258" y="215" width="52" height="26" rx="4"/>
    <rect x="192" y="255" width="52" height="26" rx="4"/><rect x="258" y="255" width="52" height="26" rx="4"/>
    <rect x="192" y="295" width="52" height="26" rx="4"/><rect x="258" y="295" width="52" height="26" rx="4"/>
  </g>
  <g fill="#f3e9db"><rect x="324" y="215" width="52" height="26" rx="4"/><rect x="324" y="255" width="52" height="26" rx="4"/><rect x="324" y="295" width="52" height="26" rx="4"/></g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#263b32">
    <text x="86" y="148">0</text><text x="86" y="188">1</text><text x="86" y="228">2</text><text x="86" y="268">3</text><text x="86" y="308">4</text>
    <text x="218" y="148">✓</text><text x="218" y="188">✓</text><text x="284" y="188">✓</text>
    <text x="218" y="228">✓</text><text x="284" y="228">✓</text><text x="350" y="228">?</text>
    <text x="218" y="268">✓</text><text x="284" y="268">✓</text><text x="350" y="268">?</text><text x="416" y="268">…</text>
    <text x="218" y="308">✓</text><text x="284" y="308">✓</text><text x="350" y="308">?</text><text x="416" y="308">…</text><text x="482" y="308">…</text>
    <text x="630" y="148">halts</text><text x="630" y="188">halts</text><text x="630" y="228">undefined</text><text x="630" y="268">undefined</text><text x="630" y="308">undefined</text>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#52685c">
    <text x="30" y="365">✓ a refutation is found</text><text x="333" y="365">? no refutation exists for candidate 2</text>
  </g>
</svg>
