<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">The quotient projection</title>
  <desc id="desc">On the left, A contains 0 in one class and 1 and 2 in another. On the right, the quotient has two elements, the sets {0} and {1, 2}. Arrows send each original element to its class.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#245b4b"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#f3f4ef"/>
  <g transform="translate(120 7.5) scale(.75)">
    <g fill="#252d29" font-family="Georgia, 'Times New Roman', serif" font-size="28" text-anchor="middle">
      <text x="150" y="43" font-style="italic">A</text>
      <text x="500" y="43">A / ∼</text>
      <text x="320" y="77" font-style="italic">q</text>
    </g>
    <rect x="45" y="66" width="210" height="277" rx="32" fill="none" stroke="#a8b2a2" stroke-width="2"/>
    <rect x="411" y="66" width="184" height="277" rx="32" fill="none" stroke="#a8b2a2" stroke-width="2"/>
    <ellipse cx="150" cy="123" rx="70" ry="36" fill="#e4ede2" stroke="#829b81" stroke-width="2"/>
    <rect x="80" y="184" width="140" height="132" rx="36" fill="#e4ede2" stroke="#829b81" stroke-width="2"/>
    <g fill="none" stroke="#245b4b" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M 175 122 L 453 122"/>
      <path d="M 175 217 Q 322 202 444 247"/>
      <path d="M 175 282 Q 322 299 444 257"/>
    </g>
    <g fill="#252d29" font-family="Georgia, 'Times New Roman', serif" font-size="30" text-anchor="middle">
      <text x="150" y="132">0</text>
      <text x="150" y="226">1</text>
      <text x="150" y="291">2</text>
      <text x="503" y="132">{0}</text>
      <text x="510" y="261">{1, 2}</text>
    </g>
  </g>
</svg>
