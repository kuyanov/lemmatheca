<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
<title id="title">Increment on unary register tracks and final output cleanup</title><desc id="desc">One physical symbol stores the origin flag and all three register bits. Increment changes register one from three to four, preserving the other tracks. Cleanup writes four native marks on the distinguished input track.</desc>
