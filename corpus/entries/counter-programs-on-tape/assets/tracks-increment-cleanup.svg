<text x="28" y="35" font-family="Georgia, Times New Roman, serif" font-size="23" text-anchor="start" fill="#252d29">One physical tape cell contains all tracks</text>
<text x="28" y="66" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="start" fill="#73796f">Example: input track 0, output track 1; increment register 1</text>
