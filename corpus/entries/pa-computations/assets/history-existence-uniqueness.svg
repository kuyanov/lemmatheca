<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570" role="img" aria-labelledby="title desc"><title id="title">Two different history induction invariants</title><desc id="desc">An existence step replaces its code pair while preserving decoded earlier values and appending a new H value. A uniqueness proof fixes two completed code pairs and propagates equality along their decoded values.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#245b4b" stroke-width="1.2"/></marker></defs>
<rect width="760" height="570" fill="#f3f4ef"/>
<text x="380" y="30" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">existence: new codes may preserve the same old values</text>
<text x="90" y="116" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#303b34">(c,d)</text>
<text x="228" y="116" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#245b4b">a<tspan baseline-shift="sub" font-size="75%">0</tspan></text>
<text x="333" y="116" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#245b4b">a<tspan baseline-shift="sub" font-size="75%">1</tspan></text>
<text x="438" y="116" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#245b4b">…</text>
<text x="543" y="116" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#245b4b">a<tspan baseline-shift="sub" font-size="75%">n</tspan></text>
<path d="M192 137 L574 137" fill="none" stroke="#8ea38a" stroke-width="1.5"/>
<text x="90" y="211" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#303b34">(c′,d′)</text>
<text x="228" y="211" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#245b4b">a<tspan baseline-shift="sub" font-size="75%">0</tspan></text>
<text x="333" y="211" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#245b4b">a<tspan baseline-shift="sub" font-size="75%">1</tspan></text>
<text x="438" y="211" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#245b4b">…</text>
<text x="543" y="211" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#245b4b">a<tspan baseline-shift="sub" font-size="75%">n</tspan></text>
<path d="M192 232 L574 232" fill="none" stroke="#8ea38a" stroke-width="1.5"/>
<path d="M228 145 L228 174" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M333 145 L333 174" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M543 145 L543 174" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="606" y="175" width="117" height="60" rx="6" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.2"/>
<text x="664" y="213" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#245b4b">a<tspan baseline-shift="sub" font-size="75%">n+1</tspan></text>
<path d="M566 203 L596 203" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="582" y="184" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#245b4b">H</text>
<text x="380" y="266" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">preserve decoded values; append the next value</text>
<path d="M40 293 L720 293" fill="none" stroke="#8ea38a" stroke-width="1.5"/>
<text x="380" y="330" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">uniqueness: fix two complete code pairs</text>
<text x="90" y="398" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#303b34">(c,d)</text>
<text x="228" y="398" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#303b34">a<tspan baseline-shift="sub" font-size="75%">0</tspan></text>
<text x="333" y="398" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#303b34">a<tspan baseline-shift="sub" font-size="75%">1</tspan></text>
<text x="438" y="398" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#303b34">…</text>
<text x="543" y="398" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#303b34">a<tspan baseline-shift="sub" font-size="75%">n</tspan></text>
<path d="M253 391 L307 391" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M461 391 L518 391" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="90" y="483" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#303b34">(e,f)</text>
<text x="228" y="483" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#303b34">b<tspan baseline-shift="sub" font-size="75%">0</tspan></text>
<text x="333" y="483" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#303b34">b<tspan baseline-shift="sub" font-size="75%">1</tspan></text>
<text x="438" y="483" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#303b34">…</text>
<text x="543" y="483" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#303b34">b<tspan baseline-shift="sub" font-size="75%">n</tspan></text>
<path d="M253 476 L307 476" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M461 476 L518 476" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M228 408 L228 451" fill="none" stroke="#8ea38a" stroke-width="1.5"/>
<text x="247" y="437" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b">=</text>
<text x="196" y="437" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">G</text>
<path d="M333 408 L333 451" fill="none" stroke="#8ea38a" stroke-width="1.5"/>
<text x="352" y="437" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b">=</text>
<text x="301" y="437" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">H</text>
<path d="M543 408 L543 451" fill="none" stroke="#8ea38a" stroke-width="1.5"/>
<text x="562" y="437" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b">=</text>
<text x="511" y="437" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">H</text>
<text x="380" y="546" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">Equal outputs do not require equal code pairs. Each row is a finite schematic.</text>
</svg>
