<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
<title id="title">A successor-machine transition on unary input two</title>
<desc id="desc">The scan-state head reads the blank at position two, writes a mark there, and moves left into the back state at position one. Positions minus one through four are drawn before and after this single transition.</desc>
<defs><marker id="arrow" viewBox="0 0 10 9" markerWidth="10" markerHeight="9" markerUnits="userSpaceOnUse" refX="8.6" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#245b4b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="390" fill="#f3f4ef"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="380" y="36" font-size="24" fill="#29352e" text-anchor="middle">One rule writes at the old head, then moves</text>
<text x="189" y="84" font-size="22" fill="#29352e" text-anchor="middle">Before the transition</text>
<rect x="45" y="180" width="48" height="54" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="69.0" y="215" font-size="26" fill="#29352e" text-anchor="middle">□</text>
<text x="69.0" y="262" font-size="20" fill="#73796f" text-anchor="middle">-1</text>
<rect x="93" y="180" width="48" height="54" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="117.0" y="215" font-size="26" fill="#29352e" text-anchor="middle">1</text>
<text x="117.0" y="262" font-size="20" fill="#73796f" text-anchor="middle">0</text>
<rect x="141" y="180" width="48" height="54" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="165.0" y="215" font-size="26" fill="#29352e" text-anchor="middle">1</text>
<text x="165.0" y="262" font-size="20" fill="#73796f" text-anchor="middle">1</text>
<rect x="189" y="180" width="48" height="54" fill="#e1e9dc" stroke="#245b4b" stroke-width="1.2"/>
<text x="213.0" y="215" font-size="26" fill="#245b4b" text-anchor="middle">□</text>
<text x="213.0" y="262" font-size="20" fill="#73796f" text-anchor="middle">2</text>
<rect x="237" y="180" width="48" height="54" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="261.0" y="215" font-size="26" fill="#29352e" text-anchor="middle">□</text>
<text x="261.0" y="262" font-size="20" fill="#73796f" text-anchor="middle">3</text>
<rect x="285" y="180" width="48" height="54" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="309.0" y="215" font-size="26" fill="#29352e" text-anchor="middle">□</text>
<text x="309.0" y="262" font-size="20" fill="#73796f" text-anchor="middle">4</text>
<text x="213.0" y="134" font-size="21" fill="#245b4b" text-anchor="middle">scan</text>
<path d="M213.0,145 L213.0,179.4" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="569" y="84" font-size="22" fill="#29352e" text-anchor="middle">After the transition</text>
<rect x="425" y="180" width="48" height="54" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="449.0" y="215" font-size="26" fill="#29352e" text-anchor="middle">□</text>
<text x="449.0" y="262" font-size="20" fill="#73796f" text-anchor="middle">-1</text>
<rect x="473" y="180" width="48" height="54" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="497.0" y="215" font-size="26" fill="#29352e" text-anchor="middle">1</text>
<text x="497.0" y="262" font-size="20" fill="#73796f" text-anchor="middle">0</text>
<rect x="521" y="180" width="48" height="54" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="545.0" y="215" font-size="26" fill="#29352e" text-anchor="middle">1</text>
<text x="545.0" y="262" font-size="20" fill="#73796f" text-anchor="middle">1</text>
<rect x="569" y="180" width="48" height="54" fill="#e1e9dc" stroke="#245b4b" stroke-width="1.2"/>
<text x="593.0" y="215" font-size="26" fill="#245b4b" text-anchor="middle">1</text>
<text x="593.0" y="262" font-size="20" fill="#73796f" text-anchor="middle">2</text>
<rect x="617" y="180" width="48" height="54" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="641.0" y="215" font-size="26" fill="#29352e" text-anchor="middle">□</text>
<text x="641.0" y="262" font-size="20" fill="#73796f" text-anchor="middle">3</text>
<rect x="665" y="180" width="48" height="54" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="689.0" y="215" font-size="26" fill="#29352e" text-anchor="middle">□</text>
<text x="689.0" y="262" font-size="20" fill="#73796f" text-anchor="middle">4</text>
<text x="545.0" y="134" font-size="21" fill="#245b4b" text-anchor="middle">back</text>
<path d="M545.0,145 L545.0,179.4" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380" y="188" font-size="15" fill="#73796f" text-anchor="middle">one rule</text>
<path d="M351,207 L409,207" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380" y="310" font-size="21" fill="#29352e" text-anchor="middle">Only position 2 changes: blank becomes a mark.</text>
<text x="380" y="344" font-size="21" fill="#245b4b" text-anchor="middle">The head moves from position 2 to position 1.</text>
<text x="380" y="377" font-size="19" fill="#73796f" text-anchor="middle">All other cells retain their symbols.</text>
</g></svg>
