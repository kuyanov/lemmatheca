<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" role="img" aria-labelledby="title desc">
  <title id="title">A rational Dedekind cut</title>
  <desc id="desc">The cut contains rational points to the left of q and excludes q and the points to its right. A hollow marker distinguishes the excluded boundary.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#73796f" stroke-width="1.2"/></marker></defs>
  <rect width="760" height="240" fill="#f3f4ef"/>
  <rect x="60" y="60" width="395" height="85" rx="5" fill="#e5ede3"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#252d29" text-anchor="middle">
    <text x="258" y="42" font-size="20">A = { p ∈ ℚ : p &lt; q }</text>
    <text x="590" y="42" font-size="20" fill="#73796f">Outside A</text>
    <text x="190" y="174" font-size="20">p &lt; q</text>
    <text x="455" y="174" font-size="20" font-style="italic">q</text>
    <text x="595" y="174" font-size="20">r &gt; q</text>
    <text x="380" y="222" font-size="18" fill="#73796f">Dots mark rational points.</text>
  </g>
  <path d="M64 108 H704" stroke="#73796f" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <path d="M70 108 H451" stroke="#245b4b" stroke-width="2"/>
  <g fill="#245b4b"><circle cx="112" cy="108" r="4"/><circle cx="190" cy="108" r="5"/><circle cx="275" cy="108" r="4"/><circle cx="348" cy="108" r="4"/><circle cx="402" cy="108" r="4"/></g>
  <circle cx="455" cy="108" r="7" fill="#f3f4ef" stroke="#245b4b" stroke-width="1.7"/>
  <g fill="#73796f"><circle cx="521" cy="108" r="4"/><circle cx="595" cy="108" r="5"/><circle cx="668" cy="108" r="4"/></g>
  <path d="M190 121 V145 M455 121 V145 M595 121 V145" stroke="#a0aa9a" stroke-width="1"/>
</svg>
