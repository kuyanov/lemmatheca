<svg xmlns="http://www.w3.org/2000/svg" width="760" height="495" viewBox="0 0 760 495" role="img" aria-labelledby="title desc">
<title id="title">A homomorphism into an elementary extension</title><desc id="desc">Positive information supplies a homomorphism from A into C and an elementary embedding from B into C. A preserved sentence passes to C and then reflects to B.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#245b4b" stroke-width="1.2"/></marker></defs>
<rect width="760" height="495" fill="#f3f4ef"/>
<g font-family="Georgia, 'Times New Roman', serif"><text x="380" y="34" font-size="24" fill="#354437" text-anchor="middle">EP(A) ⊆ EP(B)</text><ellipse cx="135" cy="166" rx="95" ry="68" fill="#fbfcf8" stroke="#b4bfae" stroke-width="1.1"/><text x="135" y="147" font-size="28" fill="#245b4b" text-anchor="middle">A</text><ellipse cx="380" cy="166" rx="95" ry="68" fill="#e3ebdf" stroke="#b4bfae" stroke-width="1.1"/><text x="380" y="147" font-size="28" fill="#245b4b" text-anchor="middle">C</text><ellipse cx="625" cy="166" rx="95" ry="68" fill="#fbfcf8" stroke="#b4bfae" stroke-width="1.1"/><text x="625" y="147" font-size="28" fill="#245b4b" text-anchor="middle">B</text><circle cx="105" cy="182" r="5" fill="#245b4b"/><circle cx="139" cy="197" r="5" fill="#245b4b"/><circle cx="165" cy="181" r="5" fill="#245b4b"/><circle cx="355" cy="185" r="5" fill="#245b4b"/><circle cx="399" cy="191" r="5" fill="#245b4b"/><circle cx="604" cy="183" r="5" fill="#245b4b"/><circle cx="646" cy="193" r="5" fill="#245b4b"/><path d="M231,162 L280,162" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="255" y="117" font-size="24" fill="#245b4b" text-anchor="middle">g</text><text x="253" y="258" font-size="17" fill="#778071" text-anchor="middle">homomorphism</text><path d="M530,162 L479,162" fill="none" stroke="#245b4b" stroke-width="2.3" marker-end="url(#arrow)"/><text x="506" y="117" font-size="24" fill="#245b4b" text-anchor="middle">j</text><text x="506" y="258" font-size="17" fill="#245b4b" text-anchor="middle">elementary</text><text x="380" y="78" font-size="21" fill="#778071" text-anchor="middle">Diag⁺(A) ∪ ElDiag(B)</text><text x="148" y="300" font-size="18" fill="#778071" text-anchor="middle">g may merge points</text><text x="599" y="300" font-size="18" fill="#245b4b" text-anchor="middle">j retains B’s elementary copy</text><path d="M60,326 L700,326" fill="none" stroke="#b4bfae" stroke-width="1"/><text x="135" y="377" font-size="24" fill="#245b4b" text-anchor="middle">A ⊨ φ</text><text x="380" y="377" font-size="24" fill="#245b4b" text-anchor="middle">C ⊨ φ</text><text x="625" y="377" font-size="24" fill="#245b4b" text-anchor="middle">B ⊨ φ</text><path d="M208,369 L308,369" fill="none" stroke="#245b4b" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M452,369 L551,369" fill="none" stroke="#245b4b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="258" y="413" font-size="17" fill="#778071" text-anchor="middle">preservation along g</text><text x="502" y="413" font-size="17" fill="#778071" text-anchor="middle">reflection along j</text><text x="380" y="470" font-size="19" fill="#778071" text-anchor="middle">The maps go into C; a homomorphism A → B is not asserted.</text></g></svg>
