<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Divisibility on the positive divisors of 12</title>
  <desc id="desc">The cover edges are 1–2, 1–3, 2–4, 2–6, 3–6, 4–12, and 6–12. The chain 1–2–4–12 is highlighted.</desc>
  <g fill="none" stroke="#a8b2a2" stroke-width="1.8" stroke-linecap="round">
    <path d="M360 251 L436 181 L436 111 L360 41"/>
    <path d="M284 181 L436 111"/>
  </g>
  <path d="M360 251 L284 181 L284 111 L360 41" fill="none" stroke="#245b4b" stroke-width="2.6" stroke-linecap="round"/>
  <g fill="#f3f4ef" stroke="#245b4b" stroke-width="1.7">
    <circle cx="360" cy="251" r="4"/>
    <circle cx="284" cy="181" r="4"/>
    <circle cx="436" cy="181" r="4"/>
    <circle cx="284" cy="111" r="4"/>
    <circle cx="436" cy="111" r="4"/>
    <circle cx="360" cy="41" r="4"/>
  </g>
  <g fill="#252d29" font-family="Georgia, 'Times New Roman', serif" font-size="21" text-anchor="middle">
    <text x="360" y="278">1</text>
    <text x="263" y="188">2</text>
    <text x="457" y="188">3</text>
    <text x="263" y="118">4</text>
    <text x="457" y="118">6</text>
    <text x="360" y="26">12</text>
  </g>
</svg>
