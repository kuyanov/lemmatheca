<svg xmlns="http://www.w3.org/2000/svg" width="760" height="750" viewBox="0 0 760 750" role="img" aria-labelledby="title desc">
<title id="title">The waiting program used in Rice’s theorem</title><desc id="desc">Code formation always produces s(b,e). At runtime the new program retains x while running the diagonal computation phi e on e, and only after it halts proceeds to g on x. If that first run never halts, the whole new function is nowhere defined. A mathematical two-case classification determines whether the reduction targets the index set or its complement.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245b4b"/></marker></defs>
<rect width="760" height="750" fill="#f3f4ef"/>
<text x="28" y="36" font-family="Georgia, Times New Roman, serif" font-size="23" text-anchor="start" fill="#252d29">Producing a program is different from running it</text>
<text x="28" y="75" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="start" fill="#73796f" font-weight="600">CODE FORMATION — ALWAYS FINISHES</text>
<text x="62" y="127" font-family="Georgia, Times New Roman, serif" font-size="26" text-anchor="middle" fill="#252d29">e</text>
<path d="M87 119L167 119" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="178" y="86" width="240" height="68" rx="5" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="298.0" y="126.0" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">specialize fixed code b</text>
<path d="M418 119L487 119" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="498" y="83" width="234" height="76" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="615.0" y="114.0" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">f<tspan baseline-shift="sub" font-size="70%">g</tspan>(e) = s(b,e)</text>
<text x="615.0" y="140.0" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">a new program index</text>
<text x="380" y="193" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="middle" fill="#73796f">The value e is stored in the new program; no diagonal run occurs here.</text>
<path d="M28 219L732 219" fill="none" stroke="#bbc7b9" stroke-width="1"/>
<text x="28" y="256" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="start" fill="#73796f" font-weight="600">RUN THE PRODUCED PROGRAM ON x</text>
<text x="59" y="324" font-family="Georgia, Times New Roman, serif" font-size="26" text-anchor="middle" fill="#252d29">x</text>
<path d="M81 315L141 315" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="152" y="276" width="226" height="78" rx="5" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="265.0" y="308.0" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#252d29">run φ<tspan baseline-shift="sub" font-size="70%">e</tspan>(e)</text>
<text x="265.0" y="334.0" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#252d29">retain input x</text>
<path d="M378 315L497 315" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="439" y="295" font-family="Georgia, Times New Roman, serif" font-size="16" text-anchor="middle" fill="#73796f">after halting</text>
<rect x="507" y="276" width="198" height="78" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="606.0" y="321.0" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#252d29">run g(x)</text>
<path d="M264 354L264 400" fill="none" stroke="#245b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="264" y="427" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#252d29">if it never halts: no output, for every x</text>
<text x="605" y="394" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="middle" fill="#73796f">g may also diverge.</text>
<path d="M28 466L732 466" fill="none" stroke="#bbc7b9" stroke-width="1"/>
<text x="28" y="502" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="start" fill="#73796f" font-weight="600">WHOLE-FUNCTION CASES</text>
<text x="200" y="538" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">φ<tspan baseline-shift="sub" font-size="70%">e</tspan>(e)↓ ⇒ φ<tspan baseline-shift="sub" font-size="70%">f<tspan baseline-shift="sub" font-size="70%">g</tspan>(e)</tspan> ≃ g</text>
<text x="555" y="538" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">φ<tspan baseline-shift="sub" font-size="70%">e</tspan>(e)↑ ⇒ φ<tspan baseline-shift="sub" font-size="70%">f<tspan baseline-shift="sub" font-size="70%">g</tspan>(e)</tspan> ≃ ⊥</text>
<path d="M380 515L380 547" fill="none" stroke="#bbc7b9" stroke-width="1"/>
<text x="380" y="571" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="middle" fill="#73796f">These are mathematical cases, not a test for nontermination.</text>
<rect x="28" y="603" width="340" height="106" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="198.0" y="649.0" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">⊥ ∉ C: choose g ∈ C</text>
<text x="198.0" y="675.0" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">e ∈ K ⇔ f<tspan baseline-shift="sub" font-size="70%">g</tspan>(e) ∈ I(C)</text>
<rect x="392" y="603" width="340" height="106" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="562.0" y="649.0" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">⊥ ∈ C: choose g ∉ C</text>
<text x="562.0" y="675.0" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">e ∈ K ⇔ f<tspan baseline-shift="sub" font-size="70%">g</tspan>(e) ∉ I(C)</text>
</svg>
