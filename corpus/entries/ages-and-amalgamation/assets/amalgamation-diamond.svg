<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" role="img" aria-labelledby="title desc">
<title id="title">Joining finite sets over a common part</title><desc id="desc">An embedding diamond commutes over A. Finite sets illustrate an amalgam with distinct new points and another where the two new points are identified.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#245b4b" stroke-width="1.2"/></marker></defs>
<rect width="760" height="510" fill="#f3f4ef"/>
<g font-family="Georgia, 'Times New Roman', serif"><text x="380" y="33" font-size="24" fill="#354437" text-anchor="middle">The two placements of A must agree</text><path d="M133,190 L272,96" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="188" y="119" font-size="22" fill="#245b4b" text-anchor="middle" font-style="italic">f</text><path d="M133,190 L272,286" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="188" y="264" font-size="22" fill="#245b4b" text-anchor="middle" font-style="italic">g</text><path d="M308,96 L452,190" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="391" y="120" font-size="22" fill="#245b4b" text-anchor="middle" font-style="italic">u</text><path d="M308,286 L452,190" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="391" y="264" font-size="22" fill="#245b4b" text-anchor="middle" font-style="italic">v</text><circle cx="115" cy="190" r="22" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="115" y="197" font-size="22" fill="#245b4b" text-anchor="middle">A</text><circle cx="290" cy="96" r="22" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="290" y="103" font-size="22" fill="#245b4b" text-anchor="middle">B</text><circle cx="290" cy="286" r="22" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="290" y="293" font-size="22" fill="#245b4b" text-anchor="middle">C</text><circle cx="470" cy="190" r="22" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="470" y="197" font-size="22" fill="#245b4b" text-anchor="middle">D</text><text x="620" y="183" font-size="23" fill="#245b4b" text-anchor="middle">u ∘ f = v ∘ g</text><text x="620" y="213" font-size="18" fill="#778071" text-anchor="middle">point by point on A</text><path d="M45,335 L715,335" fill="none" stroke="#b4bfae" stroke-width="1"/><text x="190" y="371" font-size="20" fill="#354437" text-anchor="middle">An amalgam with distinct new points</text><text x="190" y="400" font-size="19" fill="#778071" text-anchor="middle">B = {a,b},   C = {a,c}</text><circle cx="115" cy="447" r="18" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="115" y="454" font-size="22" fill="#245b4b" text-anchor="middle">a</text><circle cx="190" cy="447" r="18" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="190" y="454" font-size="22" fill="#245b4b" text-anchor="middle">b</text><circle cx="265" cy="447" r="18" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="265" y="454" font-size="22" fill="#245b4b" text-anchor="middle">c</text><text x="570" y="371" font-size="20" fill="#354437" text-anchor="middle">Another permitted amalgam</text><text x="570" y="400" font-size="19" fill="#778071" text-anchor="middle">B = {a,b},   C = {a,c}</text><circle cx="515" cy="447" r="18" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="515" y="454" font-size="22" fill="#245b4b" text-anchor="middle">a</text><circle cx="625" cy="447" r="33" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="625" y="454" font-size="22" fill="#245b4b" text-anchor="middle">b = c</text><text x="380" y="494" font-size="18" fill="#778071" text-anchor="middle">Ordinary AP permits extra identifications outside the common A = {a}.</text></g></svg>
