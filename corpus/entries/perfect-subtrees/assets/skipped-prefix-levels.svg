<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530" role="img" aria-labelledby="title desc">
<title id="title">Selected binary nodes and their intermediate prefixes</title><desc id="desc">The chosen u nodes sometimes skip a sequence length. Thin intermediate nodes belong to the downward closure even though they are not selected u nodes. A highlighted nested path has a union defining an infinite sequence.</desc>
