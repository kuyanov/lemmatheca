<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">Forth and back retain the old matching</title><desc id="desc">A forth request maps 0 to 1 between two rational orders. A back request then maps minus 1 to 0, retaining the old pair.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#245b4b" stroke-width="1.2"/></marker></defs>
<rect width="760" height="420" fill="#f3f4ef"/>
<g font-family="Georgia, 'Times New Roman', serif"><text x="195" y="40" font-size="21" fill="#354437" text-anchor="middle">Forth: add to the domain</text><path d="M50,110 L345,110" fill="none" stroke="#778071" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M50,275 L345,275" fill="none" stroke="#778071" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="70" font-size="19" fill="#354437" text-anchor="start">M = ℚ</text><text x="40" y="326" font-size="19" fill="#354437" text-anchor="start">N = ℚ</text><circle cx="100" cy="110" r="4" fill="#778071"/><text x="100" y="95" font-size="19" fill="#354437" text-anchor="middle">−1</text><circle cx="100" cy="275" r="4" fill="#778071"/><text x="100" y="300" font-size="19" fill="#354437" text-anchor="middle">0</text><circle cx="190" cy="110" r="4" fill="#778071"/><text x="190" y="95" font-size="19" fill="#354437" text-anchor="middle">0</text><circle cx="190" cy="275" r="4" fill="#778071"/><text x="190" y="300" font-size="19" fill="#354437" text-anchor="middle">1</text><circle cx="280" cy="110" r="4" fill="#778071"/><text x="280" y="95" font-size="19" fill="#354437" text-anchor="middle">1</text><circle cx="280" cy="275" r="4" fill="#778071"/><text x="280" y="300" font-size="19" fill="#354437" text-anchor="middle">2</text><path d="M190,120 L190,265" fill="none" stroke="#245b4b" stroke-width="2" marker-end="url(#arrow)"/><text x="208" y="198" font-size="19" fill="#245b4b" text-anchor="start">0 ↦ 1</text><text x="195" y="355" font-size="23" fill="#245b4b" text-anchor="middle">p<tspan baseline-shift="sub" font-size="70%">1</tspan> = {0 ↦ 1}</text><text x="565" y="40" font-size="21" fill="#354437" text-anchor="middle">Back: add to the range</text><path d="M420,110 L715,110" fill="none" stroke="#778071" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M420,275 L715,275" fill="none" stroke="#778071" stroke-width="1.5" marker-end="url(#arrow)"/><text x="410" y="70" font-size="19" fill="#354437" text-anchor="start">M = ℚ</text><text x="410" y="326" font-size="19" fill="#354437" text-anchor="start">N = ℚ</text><circle cx="470" cy="110" r="4" fill="#778071"/><text x="470" y="95" font-size="19" fill="#354437" text-anchor="middle">−1</text><circle cx="470" cy="275" r="4" fill="#778071"/><text x="470" y="300" font-size="19" fill="#354437" text-anchor="middle">0</text><circle cx="560" cy="110" r="4" fill="#778071"/><text x="560" y="95" font-size="19" fill="#354437" text-anchor="middle">0</text><circle cx="560" cy="275" r="4" fill="#778071"/><text x="560" y="300" font-size="19" fill="#354437" text-anchor="middle">1</text><circle cx="650" cy="110" r="4" fill="#778071"/><text x="650" y="95" font-size="19" fill="#354437" text-anchor="middle">1</text><circle cx="650" cy="275" r="4" fill="#778071"/><text x="650" y="300" font-size="19" fill="#354437" text-anchor="middle">2</text><path d="M560,120 L560,265" fill="none" stroke="#778071" stroke-width="2" marker-end="url(#arrow)"/><text x="578" y="198" font-size="19" fill="#778071" text-anchor="start">0 ↦ 1</text><path d="M470,120 L470,265" fill="none" stroke="#245b4b" stroke-width="2" marker-end="url(#arrow)"/><text x="462" y="198" font-size="18" fill="#245b4b" text-anchor="end">−1 ↦ 0</text><text x="565" y="355" font-size="21" fill="#245b4b" text-anchor="middle">p<tspan baseline-shift="sub" font-size="70%">2</tspan> = {−1 ↦ 0, 0 ↦ 1}</text><path d="M380,65 L380,365" fill="none" stroke="#b4bfae" stroke-width="1"/><text x="380" y="397" font-size="19" fill="#778071" text-anchor="middle">p<tspan baseline-shift="sub" font-size="70%">0</tspan> = ∅ ⊆ p<tspan baseline-shift="sub" font-size="70%">1</tspan> ⊆ p<tspan baseline-shift="sub" font-size="70%">2</tspan> ⊆ ⋯     union h covers both enumerations</text></g></svg>
