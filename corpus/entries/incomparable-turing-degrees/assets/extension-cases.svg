<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Two ways to settle one diagonal requirement</title>
  <desc id="desc">A central test branches to a successful finite computation with an opposite target bit, or the absence of any successful extension with forced divergence.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#547264" stroke-width="1.5" stroke-linejoin="round"/></marker>
  </defs>
  <style>text{font-family:Georgia,'Times New Roman',serif;fill:#26352d;font-size:19px}.small{font-size:17px}.label{font-style:italic}.box{fill:#f3f7f3;stroke:#698373;stroke-width:1.4}.edge{fill:none;stroke:#547264;stroke-width:1.5;marker-end:url(#arrow)}</style>
  <rect class="box" x="220" y="22" width="320" height="70" rx="7"/>
  <text text-anchor="middle" x="380" y="49">Current words σ, τ</text>
  <text class="small" text-anchor="middle" x="380" y="76">Next target position m = |τ|</text>
  <path class="edge" d="M380 92 V127"/>
  <rect class="box" x="130" y="127" width="500" height="62" rx="7"/>
  <text text-anchor="middle" x="380" y="153">Does an extension ρ of σ certify a value at m?</text>
  <text class="small" text-anchor="middle" x="380" y="177">A halting question about an ordinary search</text>
  <path class="edge" d="M245 189 V235 H190 V268"/>
  <path class="edge" d="M515 189 V235 H570 V268"/>
  <text class="label" text-anchor="end" x="225" y="224">yes: output y</text>
  <text class="label" text-anchor="start" x="535" y="224">no such extension</text>
  <rect class="box" x="30" y="268" width="320" height="133" rx="7"/>
  <rect class="box" x="410" y="268" width="320" height="133" rx="7"/>
  <text text-anchor="middle" x="190" y="297">σ′ = ρ0,  τ′ = τb</text>
  <text class="small" text-anchor="middle" x="190" y="324">b = 1 if y = 0; otherwise b = 0</text>
  <text class="small" text-anchor="middle" x="190" y="357">Every later oracle preserves y.</text>
  <text class="small" text-anchor="middle" x="190" y="383">The target bit is different.</text>
  <text text-anchor="middle" x="570" y="297">σ′ = σ0,  τ′ = τ0</text>
  <text class="small" text-anchor="middle" x="570" y="330">No later compatible oracle</text>
  <text class="small" text-anchor="middle" x="570" y="354">can halt on this input.</text>
  <text class="small" text-anchor="middle" x="570" y="383">Its characteristic target is total.</text>
</svg>
