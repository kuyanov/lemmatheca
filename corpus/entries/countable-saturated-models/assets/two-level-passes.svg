<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
<title id="title">Inner requests and outer parameter bases</title><desc id="desc">Each row is a countable chain answering types over one fixed model; its union becomes the base of the next row. A finite parameter set lies in one outer stage and its type is realized at the next.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#245b4b" stroke-width="1.2"/></marker></defs>
<rect width="760" height="500" fill="#f3f4ef"/>
<g font-family="Georgia, 'Times New Roman', serif"><text x="380" y="34" font-size="24" fill="#354437" text-anchor="middle">One row handles one fixed parameter base</text><text x="20" y="77" font-size="21" fill="#245b4b" text-anchor="start">base M<tspan baseline-shift="sub" font-size="70%">0</tspan></text><text x="115" y="112" font-size="21" fill="#245b4b" text-anchor="middle">N<tspan baseline-shift="sub" font-size="70%">0</tspan>,<tspan baseline-shift="sub" font-size="70%">0</tspan> = M<tspan baseline-shift="sub" font-size="70%">0</tspan></text><text x="280" y="112" font-size="21" fill="#354437" text-anchor="middle">N<tspan baseline-shift="sub" font-size="70%">0</tspan>,<tspan baseline-shift="sub" font-size="70%">1</tspan></text><text x="410" y="112" font-size="21" fill="#354437" text-anchor="middle">N<tspan baseline-shift="sub" font-size="70%">0</tspan>,<tspan baseline-shift="sub" font-size="70%">2</tspan></text><text x="520" y="112" font-size="21" fill="#354437" text-anchor="middle">⋯</text><text x="650" y="112" font-size="21" fill="#245b4b" text-anchor="middle">M<tspan baseline-shift="sub" font-size="70%">1</tspan></text><path d="M163,106 L243,106" fill="none" stroke="#778071" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M328,106 L373,106" fill="none" stroke="#778071" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M458,106 L483,106" fill="none" stroke="#778071" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M568,106 L613,106" fill="none" stroke="#778071" stroke-width="1.3" marker-end="url(#arrow)"/><text x="376" y="147" font-size="19" fill="#778071" text-anchor="middle">requests over finite subsets of M<tspan baseline-shift="sub" font-size="70%">0</tspan></text><text x="20" y="212" font-size="21" fill="#245b4b" text-anchor="start">base M<tspan baseline-shift="sub" font-size="70%">1</tspan></text><text x="115" y="247" font-size="21" fill="#245b4b" text-anchor="middle">N<tspan baseline-shift="sub" font-size="70%">1</tspan>,<tspan baseline-shift="sub" font-size="70%">0</tspan> = M<tspan baseline-shift="sub" font-size="70%">1</tspan></text><text x="280" y="247" font-size="21" fill="#354437" text-anchor="middle">N<tspan baseline-shift="sub" font-size="70%">1</tspan>,<tspan baseline-shift="sub" font-size="70%">1</tspan></text><text x="410" y="247" font-size="21" fill="#354437" text-anchor="middle">N<tspan baseline-shift="sub" font-size="70%">1</tspan>,<tspan baseline-shift="sub" font-size="70%">2</tspan></text><text x="520" y="247" font-size="21" fill="#354437" text-anchor="middle">⋯</text><text x="650" y="247" font-size="21" fill="#245b4b" text-anchor="middle">M<tspan baseline-shift="sub" font-size="70%">2</tspan></text><path d="M163,241 L243,241" fill="none" stroke="#778071" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M328,241 L373,241" fill="none" stroke="#778071" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M458,241 L483,241" fill="none" stroke="#778071" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M568,241 L613,241" fill="none" stroke="#778071" stroke-width="1.3" marker-end="url(#arrow)"/><text x="376" y="282" font-size="19" fill="#778071" text-anchor="middle">requests over finite subsets of M<tspan baseline-shift="sub" font-size="70%">1</tspan></text><path d="M650,128 V190 H115 V226" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="382" y="174" font-size="18" fill="#245b4b" text-anchor="middle">the whole union becomes the next base</text><text x="380" y="326" font-size="30" fill="#778071" text-anchor="middle">⋮</text><path d="M135,362 L333,362" fill="none" stroke="#778071" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M444,362 L625,362" fill="none" stroke="#778071" stroke-width="1.4" marker-end="url(#arrow)"/><text x="112" y="369" font-size="23" fill="#245b4b" text-anchor="middle">M<tspan baseline-shift="sub" font-size="70%">i</tspan></text><text x="390" y="369" font-size="23" fill="#245b4b" text-anchor="middle">M<tspan baseline-shift="sub" font-size="70%">i+1</tspan></text><text x="663" y="369" font-size="25" fill="#245b4b" text-anchor="middle">U</text><rect x="58" y="395" width="170" height="55" rx="5" fill="#fbfcf8" stroke="#b4bfae" stroke-width="1.1"/><text x="143" y="430" font-size="21" fill="#354437" text-anchor="middle">finite A ⊆ M<tspan baseline-shift="sub" font-size="70%">i</tspan></text><rect x="278" y="395" width="227" height="55" rx="5" fill="#e3ebdf" stroke="#b4bfae" stroke-width="1.1"/><text x="391" y="430" font-size="19" fill="#245b4b" text-anchor="middle">q over A realized here</text><text x="380" y="483" font-size="20" fill="#778071" text-anchor="middle">U = ⋃<tspan baseline-shift="sub" font-size="70%">i</tspan> M<tspan baseline-shift="sub" font-size="70%">i</tspan>; every finite parameter set eventually has a turn.</text></g></svg>
