<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
<title id="title">An order pattern and the finite cut witness</title><desc id="desc">A four by four matrix is true exactly above the diagonal. A rational witness index lies between all selected negative indices and all selected positive indices.</desc>
