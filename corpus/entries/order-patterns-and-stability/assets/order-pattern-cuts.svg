<rect width="760" height="460" fill="#f3f4ef"/>
<g font-family="Georgia, 'Times New Roman', serif"><text x="205" y="34" font-size="23" fill="#354437" text-anchor="middle">φ(a<tspan baseline-shift="sub" font-size="70%">i</tspan> ; b<tspan baseline-shift="sub" font-size="70%">j</tspan>) ⇔ i &lt; j</text><text x="134.5" y="68" font-size="22" fill="#354437" text-anchor="middle">b<tspan baseline-shift="sub" font-size="70%">0</tspan></text><text x="183.5" y="68" font-size="22" fill="#354437" text-anchor="middle">b<tspan baseline-shift="sub" font-size="70%">1</tspan></text><text x="232.5" y="68" font-size="22" fill="#354437" text-anchor="middle">b<tspan baseline-shift="sub" font-size="70%">2</tspan></text><text x="281.5" y="68" font-size="22" fill="#354437" text-anchor="middle">b<tspan baseline-shift="sub" font-size="70%">3</tspan></text><text x="76" y="116" font-size="22" fill="#354437" text-anchor="middle">a<tspan baseline-shift="sub" font-size="70%">0</tspan></text><rect x="110" y="84" width="49" height="49" rx="0" fill="#fbfcf8" stroke="#b4bfae" stroke-width="1.1"/><text x="134.5" y="116" font-size="22" fill="#778071" text-anchor="middle">0</text><rect x="159" y="84" width="49" height="49" rx="0" fill="#e3ebdf" stroke="#b4bfae" stroke-width="1.1"/><text x="183.5" y="116" font-size="22" fill="#245b4b" text-anchor="middle">1</text><rect x="208" y="84" width="49" height="49" rx="0" fill="#e3ebdf" stroke="#b4bfae" stroke-width="1.1"/><text x="232.5" y="116" font-size="22" fill="#245b4b" text-anchor="middle">1</text><rect x="257" y="84" width="49" height="49" rx="0" fill="#e3ebdf" stroke="#b4bfae" stroke-width="1.1"/><text x="281.5" y="116" font-size="22" fill="#245b4b" text-anchor="middle">1</text><text x="76" y="165" font-size="22" fill="#354437" text-anchor="middle">a<tspan baseline-shift="sub" font-size="70%">1</tspan></text><rect x="110" y="133" width="49" height="49" rx="0" fill="#fbfcf8" stroke="#b4bfae" stroke-width="1.1"/><text x="134.5" y="165" font-size="22" fill="#778071" text-anchor="middle">0</text><rect x="159" y="133" width="49" height="49" rx="0" fill="#fbfcf8" stroke="#b4bfae" stroke-width="1.1"/><text x="183.5" y="165" font-size="22" fill="#778071" text-anchor="middle">0</text><rect x="208" y="133" width="49" height="49" rx="0" fill="#e3ebdf" stroke="#b4bfae" stroke-width="1.1"/><text x="232.5" y="165" font-size="22" fill="#245b4b" text-anchor="middle">1</text><rect x="257" y="133" width="49" height="49" rx="0" fill="#e3ebdf" stroke="#b4bfae" stroke-width="1.1"/><text x="281.5" y="165" font-size="22" fill="#245b4b" text-anchor="middle">1</text><text x="76" y="214" font-size="22" fill="#354437" text-anchor="middle">a<tspan baseline-shift="sub" font-size="70%">2</tspan></text><rect x="110" y="182" width="49" height="49" rx="0" fill="#fbfcf8" stroke="#b4bfae" stroke-width="1.1"/><text x="134.5" y="214" font-size="22" fill="#778071" text-anchor="middle">0</text><rect x="159" y="182" width="49" height="49" rx="0" fill="#fbfcf8" stroke="#b4bfae" stroke-width="1.1"/><text x="183.5" y="214" font-size="22" fill="#778071" text-anchor="middle">0</text><rect x="208" y="182" width="49" height="49" rx="0" fill="#fbfcf8" stroke="#b4bfae" stroke-width="1.1"/><text x="232.5" y="214" font-size="22" fill="#778071" text-anchor="middle">0</text><rect x="257" y="182" width="49" height="49" rx="0" fill="#e3ebdf" stroke="#b4bfae" stroke-width="1.1"/><text x="281.5" y="214" font-size="22" fill="#245b4b" text-anchor="middle">1</text><text x="76" y="263" font-size="22" fill="#354437" text-anchor="middle">a<tspan baseline-shift="sub" font-size="70%">3</tspan></text><rect x="110" y="231" width="49" height="49" rx="0" fill="#fbfcf8" stroke="#b4bfae" stroke-width="1.1"/><text x="134.5" y="263" font-size="22" fill="#778071" text-anchor="middle">0</text><rect x="159" y="231" width="49" height="49" rx="0" fill="#fbfcf8" stroke="#b4bfae" stroke-width="1.1"/><text x="183.5" y="263" font-size="22" fill="#778071" text-anchor="middle">0</text><rect x="208" y="231" width="49" height="49" rx="0" fill="#fbfcf8" stroke="#b4bfae" stroke-width="1.1"/><text x="232.5" y="263" font-size="22" fill="#778071" text-anchor="middle">0</text><rect x="257" y="231" width="49" height="49" rx="0" fill="#fbfcf8" stroke="#b4bfae" stroke-width="1.1"/><text x="281.5" y="263" font-size="22" fill="#778071" text-anchor="middle">0</text><text x="208" y="322" font-size="18" fill="#778071" text-anchor="middle">A finite upper-triangular truth pattern</text><path d="M370,50 L370,332" fill="none" stroke="#b4bfae" stroke-width="1"/><text x="557" y="48" font-size="23" fill="#354437" text-anchor="middle">Finite cut conditions</text><text x="557" y="83" font-size="17" fill="#778071" text-anchor="middle">largest lower ℓ ≤ r &lt; u smallest upper</text><path d="M419,183 L705,183" fill="none" stroke="#778071" stroke-width="1.5" marker-end="url(#arrow-778071)"/><circle cx="445" cy="183" r="6" fill="#245b4b"/><text x="445" y="217" font-size="25" fill="#245b4b" text-anchor="middle">ℓ</text><circle cx="552" cy="183" r="6" fill="#245b4b"/><text x="552" y="217" font-size="25" fill="#245b4b" text-anchor="middle">t</text><circle cx="669" cy="183" r="6" fill="#245b4b"/><text x="669" y="217" font-size="25" fill="#245b4b" text-anchor="middle">u</text><path d="M445,159 V143 H669 V159" fill="none" stroke="#778071" stroke-width="1.2"/><text x="557" y="130" font-size="19" fill="#245b4b" text-anchor="middle">choose rational ℓ &lt; t &lt; u</text><text x="450" y="258" font-size="18" fill="#778071" text-anchor="middle">negative tests</text><text x="666" y="258" font-size="18" fill="#245b4b" text-anchor="middle">positive tests</text><text x="557" y="295" font-size="18" fill="#354437" text-anchor="middle">φ(a<tspan baseline-shift="sub" font-size="70%">t</tspan> ; b<tspan baseline-shift="sub" font-size="70%">q</tspan>) is false for q ≤ ℓ</text><text x="557" y="323" font-size="18" fill="#245b4b" text-anchor="middle">and true for q ≥ u</text><text x="380" y="381" font-size="20" fill="#245b4b" text-anchor="middle">Selected q ≤ r lie below t; selected q &gt; r lie above t.</text><text x="380" y="422" font-size="17" fill="#778071" text-anchor="middle">r is an external real cut label. The proof does not require t = r or a value for r in M.</text></g></svg>
