<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" role="img" aria-labelledby="title desc">
  <title id="title">Separate event tags and a certified marker prefix</title>
  <desc id="desc">Row and halting events each act on the current marker. A certificate at rank two tests all three current marker values against the final output set.</desc>
  <defs>
    <marker id="tip" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" viewBox="0 -3 6 6" refX="6" refY="0" orient="auto"><path d="M0,-3 L6,0 L0,3 Z" fill="#688477"/></marker>
  </defs>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#293f35" text-anchor="middle">
    <rect x="20" y="30" width="150" height="62" rx="4" fill="#f1f5f0" stroke="#809a8a"/>
    <rect x="250" y="30" width="150" height="62" rx="4" fill="#f1f5f0" stroke="#809a8a"/>
    <text x="95" y="54" font-size="17">row member</text>
    <text x="95" y="77" font-size="15">even code 2⟨y,z⟩</text>
    <text x="325" y="54" font-size="17">y enters K</text>
    <text x="325" y="77" font-size="15">odd code 2y + 1</text>
    <path d="M95,92 L175,150" fill="none" stroke="#688477" stroke-width="1.4" marker-end="url(#tip)"/>
    <path d="M325,92 L245,150" fill="none" stroke="#688477" stroke-width="1.4" marker-end="url(#tip)"/>
    <rect x="130" y="150" width="160" height="52" rx="4" fill="#f1f5f0" stroke="#809a8a"/>
    <text x="210" y="172" font-size="16">remove current m<tspan baseline-shift="sub" font-size="12">y</tspan></text>
    <text x="210" y="191" font-size="14">once per tagged event</text>
    <path d="M25,223 H395" stroke="#c9d4cc" stroke-width="1"/>
    <text x="210" y="251" font-size="18">Test the whole prefix (y = 2)</text>
    <g fill="#f1f5f0" stroke="#809a8a" stroke-width="1.2">
      <circle cx="80" cy="296" r="22"/><circle cx="210" cy="296" r="22"/><circle cx="340" cy="296" r="22"/>
    </g>
    <g font-size="21"><text x="80" y="303">1</text><text x="210" y="303">4</text><text x="340" y="303">7</text></g>
    <g font-size="14"><text x="80" y="342">rank 0: outside S</text><text x="210" y="342">rank 1: outside S</text><text x="340" y="342">rank 2: outside S</text></g>
    <text x="210" y="380" font-size="16">All three answers certify the prefix.</text>
    <text x="210" y="404" font-size="15">No later event of label ≤ 2 can act.</text>
  </g>
</svg>
