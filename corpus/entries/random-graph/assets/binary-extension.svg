<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title desc">
<title id="title">A fresh vertex from selected binary digits</title><desc id="desc">A new graph vertex is joined to U and not to V. In the explicit Rado graph U={0,2}, V={1,3}, and a marker at digit four give vertex 21.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#245b4b" stroke-width="1.2"/></marker></defs>
<rect width="760" height="540" fill="#f3f4ef"/>
<g font-family="Georgia, 'Times New Roman', serif"><text x="380" y="33" font-size="24" fill="#354437" text-anchor="middle">One fresh vertex answers the whole request</text><rect x="60" y="78" width="245" height="140" rx="5" fill="#e3ebdf" stroke="#b4bfae" stroke-width="1.1"/><rect x="455" y="78" width="245" height="140" rx="5" fill="#fbfcf8" stroke="#b4bfae" stroke-width="1.1"/><text x="182" y="105" font-size="22" fill="#245b4b" text-anchor="middle">U = {0, 2}</text><text x="578" y="105" font-size="22" fill="#354437" text-anchor="middle">V = {1, 3}</text><path d="M120,166 L380,270" fill="none" stroke="#245b4b" stroke-width="1.7"/><path d="M245,166 L380,270" fill="none" stroke="#245b4b" stroke-width="1.7"/><path d="M515,166 L380,270" fill="none" stroke="#245b4b" stroke-width="1.7" stroke-dasharray="6 5"/><path d="M640,166 L380,270" fill="none" stroke="#245b4b" stroke-width="1.7" stroke-dasharray="6 5"/><circle cx="120" cy="166" r="18" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="120" y="173" font-size="22" fill="#245b4b" text-anchor="middle">0</text><circle cx="245" cy="166" r="18" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="245" y="173" font-size="22" fill="#245b4b" text-anchor="middle">2</text><circle cx="515" cy="166" r="18" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="515" y="173" font-size="22" fill="#245b4b" text-anchor="middle">1</text><circle cx="640" cy="166" r="18" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="640" y="173" font-size="22" fill="#245b4b" text-anchor="middle">3</text><circle cx="380" cy="270" r="27" fill="#e3ebdf" stroke="#245b4b" stroke-width="1.5"/><text x="380" y="277" font-size="22" fill="#245b4b" text-anchor="middle">21</text><text x="380" y="322" font-size="19" fill="#778071" text-anchor="middle">solid: edge  •  dashed: prescribed nonedge</text><text x="380" y="360" font-size="24" fill="#245b4b" text-anchor="middle">21 = 2⁴ + 2² + 2⁰</text><text x="190" y="393" font-size="18" fill="#778071" text-anchor="middle">digit 4</text><rect x="161" y="407" width="58" height="45" rx="5" fill="#e3ebdf" stroke="#b4bfae" stroke-width="1.1"/><text x="190" y="438" font-size="25" fill="#245b4b" text-anchor="middle">1</text><text x="190" y="480" font-size="18" fill="#245b4b" text-anchor="middle">marker</text><text x="280" y="393" font-size="18" fill="#778071" text-anchor="middle">digit 3</text><rect x="251" y="407" width="58" height="45" rx="5" fill="#fbfcf8" stroke="#b4bfae" stroke-width="1.1"/><text x="280" y="438" font-size="25" fill="#778071" text-anchor="middle">0</text><text x="280" y="480" font-size="18" fill="#778071" text-anchor="middle">in V</text><text x="370" y="393" font-size="18" fill="#778071" text-anchor="middle">digit 2</text><rect x="341" y="407" width="58" height="45" rx="5" fill="#e3ebdf" stroke="#b4bfae" stroke-width="1.1"/><text x="370" y="438" font-size="25" fill="#245b4b" text-anchor="middle">1</text><text x="370" y="480" font-size="18" fill="#245b4b" text-anchor="middle">in U</text><text x="460" y="393" font-size="18" fill="#778071" text-anchor="middle">digit 1</text><rect x="431" y="407" width="58" height="45" rx="5" fill="#fbfcf8" stroke="#b4bfae" stroke-width="1.1"/><text x="460" y="438" font-size="25" fill="#778071" text-anchor="middle">0</text><text x="460" y="480" font-size="18" fill="#778071" text-anchor="middle">in V</text><text x="550" y="393" font-size="18" fill="#778071" text-anchor="middle">digit 0</text><rect x="521" y="407" width="58" height="45" rx="5" fill="#e3ebdf" stroke="#b4bfae" stroke-width="1.1"/><text x="550" y="438" font-size="25" fill="#245b4b" text-anchor="middle">1</text><text x="550" y="480" font-size="18" fill="#245b4b" text-anchor="middle">in U</text><text x="380" y="521" font-size="17" fill="#778071" text-anchor="middle">m = 4 exceeds every index in U ∪ V, so the marker makes 21 fresh.</text></g></svg>
