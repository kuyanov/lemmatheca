<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
<title id="title">A new comparison between forcing traces</title><desc id="desc">The original worlds u and v are isolated. Their traces are the empty set and singleton p zero. Inclusion makes the first trace below the second.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8.7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#527260" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="640" height="300" fill="#fff"/>
<g font-family="Georgia, 'Times New Roman', serif" fill="#293c31" text-anchor="middle">
<text x="155" y="34" font-size="19">Original discrete frame</text><text x="485" y="34" font-size="19">Trace inclusion order</text>
<text x="155" y="72" font-size="16">p₀ holds only at v</text>
<text x="485" y="72" font-size="16">p₀ holds only above</text>
</g>
<g stroke="#527260" stroke-width="1.5" fill="none">
<path d="M485 245 L485 115" marker-end="url(#arrow)"/>
<path d="M155 245 L480 245" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<path d="M155 110 L480 110" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
</g>
<g fill="#527260"><circle cx="155" cy="245" r="5"/><circle cx="155" cy="110" r="5"/><circle cx="485" cy="245" r="5"/><circle cx="485" cy="110" r="5"/></g>
<g font-family="Georgia, 'Times New Roman', serif" fill="#293c31" font-size="19">
<text x="132" y="250" text-anchor="end">u</text><text x="132" y="115" text-anchor="end">v</text>
<text x="508" y="250">∅</text><text x="508" y="115">{p₀}</text>
<text x="320" y="234" text-anchor="middle" font-size="16">trace</text><text x="320" y="99" text-anchor="middle" font-size="16">trace</text>
<text x="463" y="181" text-anchor="end" font-size="18">⊂</text>
</g>
</svg>
