<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc"><title id="title">Tagging sorted carriers and totalizing a function</title><desc id="desc">Element and list carriers embed into separate tagged components of U. The sorted head function runs from lists to elements; the ordinary total function also has a default value on incorrectly tagged element inputs.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" viewBox="0 0 8 8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 L2.5 4 Z" fill="#245b4b"/></marker></defs>
<rect width="760" height="520" fill="#f3f4ef"/>
<text x="155" y="31" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">separate sorted carriers</text>
<text x="555" y="31" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">one ordinary carrier U</text>
<ellipse cx="155" cy="165" rx="112" ry="72" fill="none" stroke="#8ea38a" stroke-width="1.2"/>
<ellipse cx="155" cy="365" rx="112" ry="84" fill="none" stroke="#8ea38a" stroke-width="1.2"/>
<text x="155" y="116" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b">D<tspan baseline-shift="sub" font-size="75%">E</tspan></text>
<text x="155" y="317" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b">D<tspan baseline-shift="sub" font-size="75%">Q</tspan></text>
<text x="155" y="182" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#303b34">0, 2, 7, …</text>
<text x="155" y="366" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#303b34">nil</text>
<text x="155" y="393" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#303b34">[2,5], …</text>
<rect x="373" y="54" width="350" height="400" rx="6" fill="none" stroke="#8ea38a" stroke-width="1.2"/>
<ellipse cx="548" cy="165" rx="145" ry="76" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.2"/>
<ellipse cx="548" cy="365" rx="145" ry="74" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.2"/>
<text x="548" y="116" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b">P<tspan baseline-shift="sub" font-size="75%">E</tspan></text>
<text x="625" y="317" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b">P<tspan baseline-shift="sub" font-size="75%">Q</tspan></text>
<path d="M267 165 L403 165" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="331" y="144" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">tag E</text>
<path d="M267 365 L403 365" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="331" y="342" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">tag Q</text>
<circle cx="470" cy="177" r="5" fill="#245b4b" stroke="#245b4b" stroke-width="1.3"/>
<text x="473" y="207" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#303b34">(E,0)</text>
<circle cx="552" cy="177" r="5" fill="#245b4b" stroke="#245b4b" stroke-width="1.3"/>
<text x="554" y="207" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#303b34">(E,2)</text>
<circle cx="637" cy="177" r="5" fill="#245b4b" stroke="#245b4b" stroke-width="1.3"/>
<text x="643" y="207" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#303b34">(E,7)</text>
<circle cx="554" cy="374" r="5" fill="#245b4b" stroke="#245b4b" stroke-width="1.3"/>
<text x="554" y="410" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#303b34">(Q,[2,5])</text>
<text x="458" y="363" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#303b34">nil</text>
<path d="M557.7438111252774 370.6858065448364 C615 320 615 177 557.0 177.0" fill="none" stroke="#245b4b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="655" y="271" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#245b4b">head</text>
<path d="M635.244382792058 172.31835411215476 C613 113 497 112 471.91803164141595 172.38251641881345" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="550" y="77" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">wrong tag → chosen default</text>
<text x="380" y="491" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">Restricting to P<tspan baseline-shift="sub" font-size="75%">Q</tspan> → P<tspan baseline-shift="sub" font-size="75%">E</tspan> recovers the sorted head operation.</text>
</svg>
