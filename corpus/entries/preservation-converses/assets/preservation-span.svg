<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
<title id="title">Use an embedding and an elementary copy to transport truth</title><desc id="desc">A tuple from N and a tuple from M have the same image in C. Truth passes from N along an embedding and is reflected to M along the elementary embedding.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#245b4b" stroke-width="1.2"/></marker></defs>
<rect width="760" height="450" fill="#f3f4ef"/>
<g font-family="Georgia, 'Times New Roman', serif"><text x="380" y="34" font-size="24" fill="#354437" text-anchor="middle">E(N, b̄) ⊆ E(M, ā)</text><ellipse cx="135" cy="169" rx="96" ry="73" fill="#fbfcf8" stroke="#b4bfae" stroke-width="1.1"/><text x="135" y="143" font-size="27" fill="#245b4b" text-anchor="middle">N</text><circle cx="135" cy="182" r="5" fill="#245b4b"/><text x="135" y="217" font-size="19" fill="#354437" text-anchor="middle">b̄</text><ellipse cx="380" cy="169" rx="96" ry="73" fill="#e3ebdf" stroke="#b4bfae" stroke-width="1.1"/><text x="380" y="143" font-size="27" fill="#245b4b" text-anchor="middle">C</text><circle cx="380" cy="182" r="5" fill="#245b4b"/><text x="380" y="217" font-size="19" fill="#354437" text-anchor="middle">f(b̄) = j(ā)</text><ellipse cx="625" cy="169" rx="96" ry="73" fill="#fbfcf8" stroke="#b4bfae" stroke-width="1.1"/><text x="625" y="143" font-size="27" fill="#245b4b" text-anchor="middle">M</text><circle cx="625" cy="182" r="5" fill="#245b4b"/><text x="625" y="217" font-size="19" fill="#354437" text-anchor="middle">ā</text><path d="M229,160 L281,160" fill="none" stroke="#245b4b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="255" y="119" font-size="23" fill="#245b4b" text-anchor="middle">f</text><text x="255" y="260" font-size="17" fill="#778071" text-anchor="middle">embedding</text><path d="M530,160 L479,160" fill="none" stroke="#245b4b" stroke-width="2.3" marker-end="url(#arrow)"/><text x="506" y="119" font-size="23" fill="#245b4b" text-anchor="middle">j</text><text x="506" y="260" font-size="17" fill="#245b4b" text-anchor="middle">elementary</text><path d="M60,289 L700,289" fill="none" stroke="#b4bfae" stroke-width="1"/><text x="380" y="320" font-size="19" fill="#778071" text-anchor="middle">Truth follows a different route from the map arrows</text><text x="135" y="373" font-size="23" fill="#245b4b" text-anchor="middle">N ⊨ φ(b̄)</text><text x="380" y="373" font-size="23" fill="#245b4b" text-anchor="middle">C ⊨ φ(j(ā))</text><text x="625" y="373" font-size="23" fill="#245b4b" text-anchor="middle">M ⊨ φ(ā)</text><path d="M222,365 L282,365" fill="none" stroke="#245b4b" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M483,365 L537,365" fill="none" stroke="#245b4b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="252" y="407" font-size="17" fill="#778071" text-anchor="middle">preservation</text><text x="510" y="407" font-size="17" fill="#778071" text-anchor="middle">reflection by j</text></g></svg>
