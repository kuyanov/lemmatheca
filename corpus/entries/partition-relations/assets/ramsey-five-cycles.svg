<svg xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-labelledby="title desc">
<title id="title">The five-point Ramsey counterexample</title><desc id="desc">A complete graph on five vertices has the pentagon edges in solid green and the diagonals in dashed grey. Separate small panels show that each colour is a five-cycle. Crossings carry no vertices.</desc>
