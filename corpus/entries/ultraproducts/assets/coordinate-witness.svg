<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
<title id="title">Coordinate witnesses give one ultraproduct witness</title><desc id="desc">Witness values are chosen in factors on a stipulated large set A, defaults elsewhere, and the whole section gives the quotient class g.</desc>
<defs><marker id="arrow" viewBox="0 0 10 9" markerWidth="10" markerHeight="9" markerUnits="userSpaceOnUse" refX="8.6" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#245b4b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="450" fill="#f3f4ef"/>
<g font-family="Georgia, 'Times New Roman', serif"><text x="380" y="35" font-size="22" fill="#354437" text-anchor="middle">A = {i : M<tspan baseline-shift="sub" font-size="70%">i</tspan> ⊨ ∃y ψ(a<tspan baseline-shift="sub" font-size="70%">i</tspan>, b<tspan baseline-shift="sub" font-size="70%">i</tspan>, y)} ∈ 𝒰</text><rect x="51" y="78" width="118" height="172" rx="5" fill="#e3ebdf" stroke="#b4bfae" stroke-width="1.1"/><text x="110" y="104" font-size="21" fill="#354437" text-anchor="middle">M<tspan baseline-shift="sub" font-size="70%">i1</tspan></text><circle cx="110" cy="140" r="4" fill="#778071"/><text x="110" y="169" font-size="19" fill="#778071" text-anchor="middle">a<tspan baseline-shift="sub" font-size="70%">i</tspan>, b<tspan baseline-shift="sub" font-size="70%">i</tspan></text><circle cx="110" cy="205" r="6" fill="#245b4b"/><text x="110" y="233" font-size="16" fill="#245b4b" text-anchor="middle">g(i): witness</text><text x="110" y="65" font-size="20" fill="#354437" text-anchor="middle">i<tspan baseline-shift="sub" font-size="70%">1</tspan></text><rect x="201" y="78" width="118" height="172" rx="5" fill="#fbfcf8" stroke="#b4bfae" stroke-width="1.1"/><text x="260" y="104" font-size="21" fill="#354437" text-anchor="middle">M<tspan baseline-shift="sub" font-size="70%">i2</tspan></text><circle cx="260" cy="140" r="4" fill="#778071"/><text x="260" y="169" font-size="19" fill="#778071" text-anchor="middle">a<tspan baseline-shift="sub" font-size="70%">i</tspan>, b<tspan baseline-shift="sub" font-size="70%">i</tspan></text><circle cx="260" cy="205" r="6" fill="#778071"/><text x="260" y="233" font-size="16" fill="#778071" text-anchor="middle">g(i): default</text><text x="260" y="65" font-size="20" fill="#354437" text-anchor="middle">i<tspan baseline-shift="sub" font-size="70%">2</tspan></text><rect x="351" y="78" width="118" height="172" rx="5" fill="#e3ebdf" stroke="#b4bfae" stroke-width="1.1"/><text x="410" y="104" font-size="21" fill="#354437" text-anchor="middle">M<tspan baseline-shift="sub" font-size="70%">i3</tspan></text><circle cx="410" cy="140" r="4" fill="#778071"/><text x="410" y="169" font-size="19" fill="#778071" text-anchor="middle">a<tspan baseline-shift="sub" font-size="70%">i</tspan>, b<tspan baseline-shift="sub" font-size="70%">i</tspan></text><circle cx="410" cy="205" r="6" fill="#245b4b"/><text x="410" y="233" font-size="16" fill="#245b4b" text-anchor="middle">g(i): witness</text><text x="410" y="65" font-size="20" fill="#354437" text-anchor="middle">i<tspan baseline-shift="sub" font-size="70%">3</tspan></text><rect x="501" y="78" width="118" height="172" rx="5" fill="#e3ebdf" stroke="#b4bfae" stroke-width="1.1"/><text x="560" y="104" font-size="21" fill="#354437" text-anchor="middle">M<tspan baseline-shift="sub" font-size="70%">i4</tspan></text><circle cx="560" cy="140" r="4" fill="#778071"/><text x="560" y="169" font-size="19" fill="#778071" text-anchor="middle">a<tspan baseline-shift="sub" font-size="70%">i</tspan>, b<tspan baseline-shift="sub" font-size="70%">i</tspan></text><circle cx="560" cy="205" r="6" fill="#245b4b"/><text x="560" y="233" font-size="16" fill="#245b4b" text-anchor="middle">g(i): witness</text><text x="560" y="65" font-size="20" fill="#354437" text-anchor="middle">i<tspan baseline-shift="sub" font-size="70%">4</tspan></text><text x="670" y="178" font-size="30" fill="#778071" text-anchor="middle">⋯</text><path d="M60,270 V283 H645 V270" fill="none" stroke="#778071" stroke-width="1.5"/><text x="352" y="312" font-size="22" fill="#245b4b" text-anchor="middle">g ∈ ∏<tspan baseline-shift="sub" font-size="70%">i</tspan> |M<tspan baseline-shift="sub" font-size="70%">i</tspan>|</text><path d="M350,324 L350,370" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="203" y="370" width="294" height="44" rx="5" fill="#e3ebdf" stroke="#b4bfae" stroke-width="1.1"/><text x="350" y="400" font-size="20" fill="#245b4b" text-anchor="middle">[g] witnesses ∃y ψ([a], [b], y)</text><text x="380" y="439" font-size="17" fill="#778071" text-anchor="middle">A ⊆ {i : M<tspan baseline-shift="sub" font-size="70%">i</tspan> ⊨ ψ(a<tspan baseline-shift="sub" font-size="70%">i</tspan>, b<tspan baseline-shift="sub" font-size="70%">i</tspan>, g(i))}; largeness is stipulated, not counted.</text></g></svg>
