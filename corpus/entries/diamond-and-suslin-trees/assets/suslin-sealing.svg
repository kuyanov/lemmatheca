<marker id="grey-arrow" viewBox="-1 0 11 10" refX="8.7" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#768278" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="warn-arrow" viewBox="-1 0 11 10" refX="8.7" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#8b6d48" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
