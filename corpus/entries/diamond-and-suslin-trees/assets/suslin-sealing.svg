<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title desc">
<title id="title">Two tree mechanisms in the Suslin construction</title><desc id="desc">On the left every selected node at the countable limit cut extends a member of the guessed antichain, preventing a later member of that same antichain. On the right, off-branch successors of a hypothetical cofinal branch are pairwise incompatible.</desc>
