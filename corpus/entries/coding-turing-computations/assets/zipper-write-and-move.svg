<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
<title id="title">A finite zipper after a write and right move</title>
<desc id="desc">The tape cells at fixed coordinates h minus two through h plus two are shown before and after a right-moving transition. The old current cell a is replaced by b, the head moves from h to h plus one, and the symbol r zero becomes current. The nearest-first left list gains b; the nearest-first right list loses r zero.</desc>
<defs><marker id="arrow" viewBox="0 0 10 9" markerWidth="10" markerHeight="9" markerUnits="userSpaceOnUse" refX="8.6" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#245b4b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="470" fill="#f3f4ef"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="380" y="32" text-anchor="middle" font-size="25" fill="#29352e">A right-moving transition</text>
<text x="380" y="64" text-anchor="middle" font-size="20" fill="#73796f">The old head cell is written before the head moves.</text>
<text x="78" y="158" text-anchor="middle" font-size="22" fill="#245b4b">Before</text>
<text x="149" y="158" text-anchor="middle" font-size="25" fill="#73796f">…</text>
<text x="611" y="158" text-anchor="middle" font-size="25" fill="#73796f">…</text>
<rect x="180" y="127" width="80" height="48" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="220.0" y="158" text-anchor="middle" font-size="26" fill="#29352e">l<tspan baseline-shift="sub" font-size="70%">1</tspan></text>
<text x="220.0" y="202" text-anchor="middle" font-size="18" fill="#73796f">h − 2</text>
<rect x="260" y="127" width="80" height="48" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="300.0" y="158" text-anchor="middle" font-size="26" fill="#29352e">l<tspan baseline-shift="sub" font-size="70%">0</tspan></text>
<text x="300.0" y="202" text-anchor="middle" font-size="18" fill="#73796f">h − 1</text>
<rect x="340" y="127" width="80" height="48" fill="#e1e9dc" stroke="#245b4b" stroke-width="1.5"/>
<text x="380.0" y="158" text-anchor="middle" font-size="26" fill="#245b4b">a</text>
<text x="380.0" y="202" text-anchor="middle" font-size="18" fill="#73796f">h</text>
<rect x="420" y="127" width="80" height="48" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="460.0" y="158" text-anchor="middle" font-size="26" fill="#29352e">r<tspan baseline-shift="sub" font-size="70%">0</tspan></text>
<text x="460.0" y="202" text-anchor="middle" font-size="18" fill="#73796f">h + 1</text>
<rect x="500" y="127" width="80" height="48" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="540.0" y="158" text-anchor="middle" font-size="26" fill="#29352e">r<tspan baseline-shift="sub" font-size="70%">1</tspan></text>
<text x="540.0" y="202" text-anchor="middle" font-size="18" fill="#73796f">h + 2</text>
<text x="380.0" y="97" text-anchor="middle" font-size="24" fill="#245b4b">q</text>
<path d="M380.0 108L380.0 126.25" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="175" y="232" text-anchor="start" font-size="21" fill="#29352e">l = (l<tspan baseline-shift="sub" font-size="70%">0</tspan>, l<tspan baseline-shift="sub" font-size="70%">1</tspan>, …)</text>
<text x="470" y="232" text-anchor="start" font-size="21" fill="#29352e">r = (r<tspan baseline-shift="sub" font-size="70%">0</tspan>, r<tspan baseline-shift="sub" font-size="70%">1</tspan>, …)</text>
<text x="78" y="366" text-anchor="middle" font-size="22" fill="#245b4b">After</text>
<text x="149" y="366" text-anchor="middle" font-size="25" fill="#73796f">…</text>
<text x="611" y="366" text-anchor="middle" font-size="25" fill="#73796f">…</text>
<rect x="180" y="335" width="80" height="48" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="220.0" y="366" text-anchor="middle" font-size="26" fill="#29352e">l<tspan baseline-shift="sub" font-size="70%">1</tspan></text>
<text x="220.0" y="410" text-anchor="middle" font-size="18" fill="#73796f">h − 2</text>
<rect x="260" y="335" width="80" height="48" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="300.0" y="366" text-anchor="middle" font-size="26" fill="#29352e">l<tspan baseline-shift="sub" font-size="70%">0</tspan></text>
<text x="300.0" y="410" text-anchor="middle" font-size="18" fill="#73796f">h − 1</text>
<rect x="340" y="335" width="80" height="48" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="380.0" y="366" text-anchor="middle" font-size="26" fill="#245b4b">b</text>
<text x="380.0" y="410" text-anchor="middle" font-size="18" fill="#73796f">h</text>
<rect x="420" y="335" width="80" height="48" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/>
<text x="460.0" y="366" text-anchor="middle" font-size="26" fill="#29352e">r<tspan baseline-shift="sub" font-size="70%">0</tspan></text>
<text x="460.0" y="410" text-anchor="middle" font-size="18" fill="#73796f">h + 1</text>
<rect x="500" y="335" width="80" height="48" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="540.0" y="366" text-anchor="middle" font-size="26" fill="#29352e">r<tspan baseline-shift="sub" font-size="70%">1</tspan></text>
<text x="540.0" y="410" text-anchor="middle" font-size="18" fill="#73796f">h + 2</text>
<text x="460.0" y="305" text-anchor="middle" font-size="24" fill="#245b4b">q&#x27;</text>
<path d="M460.0 316L460.0 334.25" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="175" y="448" text-anchor="start" font-size="21" fill="#29352e">l&#x27; = (b, l<tspan baseline-shift="sub" font-size="70%">0</tspan>, l<tspan baseline-shift="sub" font-size="70%">1</tspan>, …)</text>
<text x="470" y="448" text-anchor="start" font-size="21" fill="#29352e">r&#x27; = (r<tspan baseline-shift="sub" font-size="70%">1</tspan>, …)</text>
<text x="380" y="275" text-anchor="middle" font-size="22" fill="#245b4b">Write b at h; move one cell right.</text>
</g></svg>
