<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
<title id="title">Cofinite horizontal fibers contradict a small vertical fiber</title><desc id="desc">With illustrative bound N=2, three cofinite horizontal fibers share a column y star, producing three points in that vertical fiber.</desc>
