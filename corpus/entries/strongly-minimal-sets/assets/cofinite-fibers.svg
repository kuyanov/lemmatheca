"7" fill="#245b4b"/><circle cx="525" cy="289" r="7" fill="#245b4b"/><circle cx="600" cy="289" r="7" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><path d="M596,285 L604,293" fill="none" stroke="#778071" stroke-width="1.2"/><path d="M596,293 L604,285" fill="none" stroke="#778071" stroke-width="1.2"/><text x="684" y="296" font-size="27" fill="#245b4b" text-anchor="middle">⋯</text><text x="42" y="220" font-size="22" fill="#778071" text-anchor="middle">x</text><text x="690" y="112" font-size="22" fill="#778071" text-anchor="middle">y</text><text x="380" y="358" font-size="21" fill="#354437" text-anchor="middle">Each row H<tspan baseline-shift="sub" font-size="70%">x</tspan> excludes only finitely many columns.</text><text x="380" y="390" font-size="18" fill="#245b4b" text-anchor="middle">Choose y* outside their finite union of exclusions: three solutions in one column.</text><text x="380" y="423" font-size="19" fill="#245b4b" text-anchor="middle">But every vertical fiber has at most N = 2 solutions — contradiction.</text></g></svg>
