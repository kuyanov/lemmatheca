<svg xmlns="http://www.w3.org/2000/svg" width="760" height="835" viewBox="0 0 760 835" role="img" aria-labelledby="title desc"><title id="title">The branching proof in Löb’s theorem</title><desc id="desc">Theorem boxing is done before introducing the temporary assumption. That assumption feeds a D2 branch and a D3 branch, which combine to boxed A. After discharge and reflection, L is proved; only then is D1 applied again.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#245b4b" stroke-width="1.2"/></marker></defs>
<rect width="760" height="835" fill="#f3f4ef"/>
<text x="380" y="34" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#245b4b">theorem: L → (□L → A)</text>
<text x="380" y="70" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">D1 on this theorem, then D2</text>
<path d="M380 83 L380 112" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380" y="149" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#245b4b">theorem: □L → □(□L → A)</text>
<rect x="38" y="192" width="175" height="51" rx="6" fill="none" stroke="#8ea38a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="125" y="226" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#303b34">assume □L</text>
<path d="M215 217 H324 V275" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M125 247 V279 H578" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M380 167 V181 H354 V275" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="324" y="311" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#303b34">□(□L → A)</text>
<text x="617" y="311" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#303b34">□□L</text>
<text x="616" y="264" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">D3</text>
<path d="M267 337 L665 337" fill="none" stroke="#245b4b" stroke-width="1.5"/>
<text x="702" y="344" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">D2</text>
<text x="469" y="382" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="27" fill="#245b4b">□A</text>
<path d="M469 396 V410 H254 V439" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380" y="429" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">discharge the assumption</text>
<text x="254" y="473" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#245b4b">theorem: □L → □A</text>
<text x="593" y="473" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#245b4b">given: □A → A</text>
<path d="M254 489 V514 H430" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M592 489 V514 H469" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="451" y="555" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#245b4b">theorem: □L → A</text>
<text x="207" y="602" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">reverse fixed-point implication</text>
<path d="M451 572 L451 616" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="451" y="654" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#245b4b">theorem: L</text>
<path d="M451 670 L451 705" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="508" y="694" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">D1</text>
<text x="451" y="743" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#245b4b">theorem: □L</text>
<path d="M619 547 H687 V783 H495" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M451 759 L451 785" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="451" y="817" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="29" fill="#245b4b">A</text>
</svg>
