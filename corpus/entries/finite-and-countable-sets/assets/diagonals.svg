<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-labelledby="title desc">
<title id="title">Enumerating pairs by diagonals</title>
<desc id="desc">The first fifteen pairs are numbered zero through fourteen in increasing order of coordinate sum. Arrows show increasing first coordinate within each diagonal. Coordinates appear below each circle.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245b4b"/></marker></defs>
<rect width="720" height="450" rx="8" fill="#f3f4ef"/>
<g fill="#252d29" font-family="Georgia, 'Times New Roman', serif" font-size="19">
<text x="105" y="28">Second coordinate b →</text>
<text transform="translate(30 290) rotate(-90)">First coordinate a</text>
<path d="M 52 78 L 52 371" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="385" y="310">Visit each finite diagonal</text>
<text x="385" y="338">before starting the next.</text>
</g>
<g fill="none" stroke="#c5cec1" stroke-width="1.5" stroke-dasharray="4 5">
<path d="M 217 75 L 105 149"/>
<path d="M 329 75 L 105 223"/>
<path d="M 441 75 L 105 297"/>
<path d="M 553 75 L 105 371"/>
