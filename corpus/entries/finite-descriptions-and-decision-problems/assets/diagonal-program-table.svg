<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">The program diagonal and the answers it requires</title><desc id="desc">A four-by-four program/input table has diagonal values one, zero, undefined and seven. The required diagonal-problem answers are zero, one, one and one. Other table entries are unspecified. A hypothetical decider disagrees with the required answer at its own cell.</desc>
