<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">Transporting a private interpretation into a joint model</title><desc id="desc">The shared name classes determine an isomorphism h of common reducts. A private function on M2 is transported to the M1 carrier by h then the function then h inverse.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#245b4b" stroke-width="1.2"/></marker></defs>
<rect width="760" height="500" fill="#f3f4ef"/>
<text x="176" y="32" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">M<tspan baseline-shift="sub" font-size="75%">1</tspan>: keep every L<tspan baseline-shift="sub" font-size="75%">1</tspan> symbol</text>
<text x="586" y="32" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">M<tspan baseline-shift="sub" font-size="75%">2</tspan>: source of L<tspan baseline-shift="sub" font-size="75%">2</tspan>-only symbols</text>
<text x="170" y="95" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#303b34">[d<tspan baseline-shift="sub" font-size="75%">0</tspan>]<tspan baseline-shift="sub" font-size="75%">1</tspan></text>
<text x="590" y="95" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#303b34">[d<tspan baseline-shift="sub" font-size="75%">0</tspan>]<tspan baseline-shift="sub" font-size="75%">2</tspan></text>
<path d="M235 89 L523 89" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380" y="77" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b">h</text>
<text x="170" y="155" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#303b34">[d<tspan baseline-shift="sub" font-size="75%">1</tspan>]<tspan baseline-shift="sub" font-size="75%">1</tspan></text>
<text x="590" y="155" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#303b34">[d<tspan baseline-shift="sub" font-size="75%">1</tspan>]<tspan baseline-shift="sub" font-size="75%">2</tspan></text>
<path d="M235 149 L523 149" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380" y="137" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b">h</text>
<path d="M45 203 L715 203" fill="none" stroke="#8ea38a" stroke-width="1.5"/>
<text x="380" y="236" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">one transported function value</text>
<text x="155" y="298" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#303b34">ā</text>
<text x="597" y="298" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#303b34">h(ā)</text>
<path d="M192 291 L536 291" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380" y="277" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">h on the input tuple</text>
<text x="155" y="415" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b">h<tspan baseline-shift="super" font-size="75%">-1</tspan>(f<tspan baseline-shift="super" font-size="75%">M2</tspan>(h(ā)))</text>
<text x="598" y="415" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#303b34">f<tspan baseline-shift="super" font-size="75%">M2</tspan>(h(ā))</text>
<path d="M155 314 L155 379" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M598 314 L598 379" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="91" y="352" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">f<tspan baseline-shift="super" font-size="75%">M</tspan></text>
<text x="655" y="352" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">f<tspan baseline-shift="super" font-size="75%">M2</tspan></text>
<path d="M510 407 L279 407" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="391" y="436" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">h<tspan baseline-shift="super" font-size="75%">-1</tspan> on the output</text>
<text x="380" y="481" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">For shared symbols this transport already agrees with M<tspan baseline-shift="sub" font-size="75%">1</tspan>.</text>
</svg>
