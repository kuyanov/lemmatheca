<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
  <title id="title">Two oracle bits determine this output</title>
  <desc id="desc">The two oracles agree at queried positions two and three, but differ at unqueried positions zero and five. The successful trace records two with answer one and three with answer zero.</desc>
  <rect width="760" height="350" fill="#f3f4ef"/>
  <text x="28" y="35" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#252d29">Two oracle bits determine this output</text>
  <text x="28" y="65" font-family="Georgia, Times New Roman, serif" font-size="17" fill="#73796f">Input 2: ask at 2, then apply successor and ask at 3.</text>
  <rect x="320" y="92" width="140" height="139" rx="5" fill="#e1e9dc" stroke="#8da896" stroke-width="1.2"/>
  <g font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f" text-anchor="middle">
    <text x="210" y="112">0</text><text x="282" y="112">1</text><text x="354" y="112">2</text><text x="426" y="112">3</text><text x="498" y="112">4</text><text x="570" y="112">5</text>
  </g>
  <g font-family="Georgia, Times New Roman, serif" font-size="21" fill="#245b4b">
    <text x="30" y="154">A = {2}</text><text x="30" y="209">B = {0, 2, 5}</text>
  </g>
  <g fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2">
    <rect x="180" y="127" width="60" height="40" rx="3"/><rect x="252" y="127" width="60" height="40" rx="3"/><rect x="324" y="127" width="60" height="40" rx="3"/><rect x="396" y="127" width="60" height="40" rx="3"/><rect x="468" y="127" width="60" height="40" rx="3"/><rect x="540" y="127" width="60" height="40" rx="3"/>
    <rect x="180" y="182" width="60" height="40" rx="3"/><rect x="252" y="182" width="60" height="40" rx="3"/><rect x="324" y="182" width="60" height="40" rx="3"/><rect x="396" y="182" width="60" height="40" rx="3"/><rect x="468" y="182" width="60" height="40" rx="3"/><rect x="540" y="182" width="60" height="40" rx="3"/>
  </g>
  <g font-family="Georgia, Times New Roman, serif" font-size="22" fill="#252d29" text-anchor="middle">
    <text x="210" y="155">0</text><text x="282" y="155">0</text><text x="354" y="155">1</text><text x="426" y="155">0</text><text x="498" y="155">0</text><text x="570" y="155">0</text>
    <text x="210" y="210">1</text><text x="282" y="210">0</text><text x="354" y="210">1</text><text x="426" y="210">0</text><text x="498" y="210">0</text><text x="570" y="210">1</text>
  </g>
  <text x="637" y="155" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">all later 0</text>
  <text x="637" y="210" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">all later 0</text>
  <path d="M354 231 V247 H426 V231" fill="none" stroke="#245b4b" stroke-width="1.4"/>
  <text x="390" y="279" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b">Recorded answers: (2, 1), (3, 0)</text>
  <text x="380" y="317" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="17" fill="#73796f">Output: ⟨1, 0⟩. The other positions may differ.</text>
</svg>
