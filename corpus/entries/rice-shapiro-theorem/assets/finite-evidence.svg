<svg xmlns="http://www.w3.org/2000/svg" width="420" height="370" viewBox="0 0 420 370" role="img" aria-labelledby="title desc">
  <title id="title">One finite observation has several extensions</title>
  <desc id="desc">A central two-row fragment records two returning seven and five returning seventeen. Two lower tables extend it, assigning different values to the unobserved input zero.</desc>
  <defs>
    <marker id="tip" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#60796d"/></marker>
  </defs>
  <g fill="#f4f6f1" stroke="#60796d" stroke-width="1.2">
    <rect x="125" y="45" width="170" height="112" rx="5"/>
    <rect x="20" y="231" width="170" height="118" rx="5"/>
    <rect x="230" y="231" width="170" height="118" rx="5"/>
  </g>
  <g stroke="#a0afa4" stroke-width="1">
    <path d="M125 77H295 M210 45V157 M20 261H190 M105 231V349 M230 261H400 M315 231V349"/>
  </g>
  <g fill="none" stroke="#60796d" stroke-width="1.5" marker-end="url(#tip)">
    <path d="M183 157 L112 231"/>
    <path d="M237 157 L308 231"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#293e33" text-anchor="middle">
    <text x="210" y="25">finite evidence D</text>
    <text x="167.5" y="67">input</text><text x="252.5" y="67">output</text>
    <text x="167.5" y="103">2</text><text x="252.5" y="103">7</text>
    <text x="167.5" y="130">5</text><text x="252.5" y="130">17</text>
    <text x="210" y="191">extends to</text>
    <text x="62.5" y="251">input</text><text x="147.5" y="251">output</text>
    <text x="62.5" y="282">2</text><text x="147.5" y="282">7</text>
    <text x="62.5" y="307">5</text><text x="147.5" y="307">17</text>
    <text x="62.5" y="332">0</text><text x="147.5" y="332">0</text>
    <text x="272.5" y="251">input</text><text x="357.5" y="251">output</text>
    <text x="272.5" y="282">2</text><text x="357.5" y="282">7</text>
    <text x="272.5" y="307">5</text><text x="357.5" y="307">17</text>
    <text x="272.5" y="332">0</text><text x="357.5" y="332">17</text>
  </g>
</svg>
