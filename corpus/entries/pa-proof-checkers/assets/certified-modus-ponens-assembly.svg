<rect width="760" height="560" fill="#f3f4ef"/>
<text x="380" y="30" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">retain the accepted child subtrees</text>
<path d="M91 75 H301 L196 212 Z" fill="none" stroke="#8ea38a" stroke-width="1.5"/>
<text x="196" y="124" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="27" fill="#245b4b">p</text>
<text x="196" y="236" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#303b34">A → B</text>
