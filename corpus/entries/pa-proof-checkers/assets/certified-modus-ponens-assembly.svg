<text x="196" y="124" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="27" fill="#245b4b">p</text>
<text x="196" y="236" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#303b34">A → B</text>
