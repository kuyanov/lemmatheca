<text x="268.0" y="494" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#303b34">s<tspan baseline-shift="sub" font-size="75%">0</tspan>, s<tspan baseline-shift="sub" font-size="75%">1</tspan></text>
