<text x="676" y="268" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">→E</text>
<text x="382" y="306" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="29" fill="#245b4b">B</text>
<text x="382" y="341" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">new root in M(p,q,⌜B⌝)</text>
<text x="83" y="403" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">context</text>
<text x="83" y="491" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">certificates</text>
