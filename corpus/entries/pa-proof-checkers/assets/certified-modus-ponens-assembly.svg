<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc"><title id="title">Certified modus-ponens record assembly</title><desc id="desc">Two unchanged accepted derivation subtrees conclude A-to-B and A. A new implication-elimination root concludes B. The root contexts and their matching axiom-certificate lists are concatenated in the same order.</desc>
