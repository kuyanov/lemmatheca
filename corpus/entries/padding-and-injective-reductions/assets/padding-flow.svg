<svg xmlns="http://www.w3.org/2000/svg" width="420" height="460" viewBox="0 0 420 460" role="img" aria-labelledby="title desc">
<title id="title">Padding preserves the runtime input</title>
<desc id="desc">A vertical sequence forms the pair of stored tag and input, discards the tag through the right projection, then runs the original program on the recovered input.</desc>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="6" refY="3" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#61786a"/></marker></defs>
<g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#263c30">
<text x="210" y="24" font-size="19">The tag remains in the program text</text>
<text x="210" y="51" font-size="18">input x</text>
</g>
<g fill="none" stroke="#61786a" stroke-width="1.5" marker-end="url(#arrow)"><path d="M210 55 V75"/><path d="M210 140 V200"/><path d="M210 265 V325"/><path d="M210 390 V420"/></g>
<g fill="#f3f6f1" stroke="#61786a" stroke-width="1.2"><rect x="60" y="75" width="300" height="65" rx="5"/><rect x="60" y="200" width="300" height="65" rx="5"/><rect x="60" y="325" width="300" height="65" rx="5"/></g>
<g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#263c30" font-size="19"><text x="210" y="102">form the pair ⟨t, x⟩</text><text x="210" y="125" font-size="17">constant tag and original input</text><text x="210" y="227">take the right coordinate</text><text x="210" y="250" font-size="17">recover x</text><text x="210" y="352">run the original program</text><text x="210" y="375" font-size="17">evaluate cₑ at x</text><text x="210" y="449" font-size="18">same output or divergence</text></g>
</svg>
