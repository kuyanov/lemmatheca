<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img" aria-labelledby="title desc">
<title id="title">Complete one request without moving the old finite structure</title><desc id="desc">C is an induced substructure of B. Amalgamation joins B with A over the specified map g, and relabeling the amalgam gives B prime containing B literally.</desc>
<defs><marker id="arrow" viewBox="0 0 10 9" markerWidth="10" markerHeight="9" markerUnits="userSpaceOnUse" refX="8.6" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#245b4b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-778071" viewBox="0 0 10 9" markerWidth="10" markerHeight="9" markerUnits="userSpaceOnUse" refX="8.6" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#778071" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="490" fill="#f3f4ef"/>
<g font-family="Georgia, 'Times New Roman', serif"><text x="380" y="34" font-size="24" fill="#354437" text-anchor="middle">Amalgamate, then restore the old labels</text><circle cx="120" cy="138" r="24" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="120" y="145" font-size="22" fill="#245b4b" text-anchor="middle">C</text><circle cx="335" cy="138" r="24" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="335" y="145" font-size="22" fill="#245b4b" text-anchor="middle">B</text><circle cx="120" cy="300" r="24" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="120" y="307" font-size="22" fill="#245b4b" text-anchor="middle">A</text><circle cx="335" cy="300" r="24" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="335" y="307" font-size="22" fill="#245b4b" text-anchor="middle">D</text><circle cx="610" cy="138" r="24" fill="#fbfcf8" stroke="#245b4b" stroke-width="1.5"/><text x="610" y="145" font-size="22" fill="#245b4b" text-anchor="middle">B′</text><path d="M144.0,138.0 L311.0,138.0" fill="none" stroke="#778071" stroke-width="1.5" marker-end="url(#arrow-778071)"/><text x="228" y="117" font-size="18" fill="#778071" text-anchor="middle">inclusion</text><path d="M120.0,162.0 L120.0,276.0" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="99" y="226" font-size="22" fill="#245b4b" text-anchor="end">g</text><path d="M335.0,162.0 L335.0,276.0" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="354" y="226" font-size="22" fill="#245b4b" text-anchor="start">u</text><path d="M144.0,300.0 L311.0,300.0" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="228" y="327" font-size="22" fill="#245b4b" text-anchor="middle">v</text><path d="M355.6786848315146,287.8183747537987 L589.3213151684854,150.18162524620132" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="492" y="259" font-size="21" fill="#245b4b" text-anchor="middle">e : D ≅ B′</text><path d="M359.0,138.0 L586.0,138.0" fill="none" stroke="#778071" stroke-width="1.5" marker-end="url(#arrow-778071)"/><text x="474" y="116" font-size="18" fill="#778071" text-anchor="middle">e ∘ u = inclusion</text><path d="M120,324 C120,404 610,404 610,162" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="395" y="397" font-size="22" fill="#245b4b" text-anchor="middle">h = e ∘ v</text><text x="380" y="448" font-size="23" fill="#245b4b" text-anchor="middle">h ∘ g is the original inclusion C ⊆ B ⊆ B′</text><text x="380" y="478" font-size="18" fill="#778071" text-anchor="middle">Earlier answers are carried into later extensions by inclusion.</text></g></svg>
