<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">Skolem witness dependencies</title><desc id="desc">The initial existential a becomes a constant d. The witness for b depends on x, while the witness for c depends on x and z. A dependence of b on the later z is forbidden.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#245b4b" stroke-width="1.2"/></marker></defs>
<rect width="760" height="420" fill="#f3f4ef"/>
<text x="90" y="77" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#245b4b">∃a</text>
<text x="225" y="77" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#245b4b">∀x</text>
<text x="365" y="77" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#245b4b">∃b</text>
<text x="510" y="77" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#245b4b">∀z</text>
<text x="665" y="77" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#245b4b">∃c</text>
<rect x="27" y="253" width="126" height="51" rx="6" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.2"/>
<text x="90" y="286" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#245b4b">d</text>
<rect x="302" y="253" width="126" height="51" rx="6" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.2"/>
<text x="365" y="286" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#245b4b">f(x)</text>
<rect x="602" y="253" width="126" height="51" rx="6" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.2"/>
<text x="665" y="286" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#245b4b">g(x,z)</text>
<path d="M90 91 L90 245" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
<path d="M365 91 L365 245" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
<path d="M665 91 L665 245" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
<path d="M228 96 C235 190 315 192 344 245" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M241 92 C350 126 550 126 641 245" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M513 95 C515 185 600 198 651 245" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M499 105 C450 154 408 191 390 242" fill="none" stroke="#956b60" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M432 168 L448 184" fill="none" stroke="#956b60" stroke-width="2"/>
<path d="M432 184 L448 168" fill="none" stroke="#956b60" stroke-width="2"/>
<text x="465" y="216" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">too late</text>
<text x="90" y="333" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">no universal input</text>
<text x="380" y="388" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#245b4b">∀x ∀z R(d, x, f(x), z, g(x,z))</text>
</svg>
