<text x="225" y="77" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#245b4b">∀x</text>
<text x="365" y="77" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#245b4b">∃b</text>
<text x="510" y="77" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#245b4b">∀z</text>
<text x="665" y="77" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#245b4b">∃c</text>
<rect x="27" y="253" width="126" height="51" rx="6" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.2"/>
<text x="90" y="286" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#245b4b">d</text>
