<path d="M227.94174202707276 101.58834840541455 C350 126 641 126 641 253" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M510.1782559199526 103.99469945520445 C515 185 651 198 651 253" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
