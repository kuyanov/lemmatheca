<svg xmlns="http://www.w3.org/2000/svg" width="760" height="325" viewBox="0 0 760 325" role="img" aria-labelledby="title desc">
<title id="title">An eventual next-point bound gives a splitter</title><desc id="desc">With g of n equal to n plus two and X the even numbers, the endpoint recurrence gives zero, three, six, nine and twelve. Alternately shaded half-open intervals each contain an even-number point.</desc>
<rect width="760" height="325" fill="#f3f4ef"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#356653" stroke-width="1.4"/></marker><marker id="grey-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#768278" stroke-width="1.4"/></marker></defs>
<text x="380.0" y="34" font-family="Georgia, Times New Roman, serif" font-size="23" text-anchor="middle" fill="#29352e" font-weight="bold">Alternate the intervals reached by the bound</text>
<text x="380" y="76" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">g(n) = n + 2,    a<tspan baseline-shift="sub" font-size="70%">k</tspan> = 3k,    X = {0, 2, 4, …}</text>
<rect x="70" y="115" width="144" height="104" rx="0" fill="#dce9dc" stroke="#a7b5a6" stroke-width="1.2"/>
<text x="142" y="139" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">in S<tspan baseline-shift="sub" font-size="70%">g</tspan></text>
<text x="70" y="245" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">0</text>
<rect x="214" y="115" width="144" height="104" rx="0" fill="#f3f4ef" stroke="#a7b5a6" stroke-width="1.2"/>
<text x="286" y="139" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">outside S<tspan baseline-shift="sub" font-size="70%">g</tspan></text>
<text x="214" y="245" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">3</text>
<rect x="358" y="115" width="144" height="104" rx="0" fill="#dce9dc" stroke="#a7b5a6" stroke-width="1.2"/>
<text x="430" y="139" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">in S<tspan baseline-shift="sub" font-size="70%">g</tspan></text>
<text x="358" y="245" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">6</text>
<rect x="502" y="115" width="144" height="104" rx="0" fill="#f3f4ef" stroke="#a7b5a6" stroke-width="1.2"/>
<text x="574" y="139" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">outside S<tspan baseline-shift="sub" font-size="70%">g</tspan></text>
<text x="502" y="245" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">9</text>
<text x="646" y="245" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">12</text>
<path d="M55 181L688 181" fill="none" stroke="#768278" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#grey-arrow)"/>
<circle cx="70" cy="181" r="5" fill="#356653" stroke="#356653" stroke-width="1.6"/>
<path d="M118 176L118 186" fill="none" stroke="#768278" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="166" cy="181" r="5" fill="#356653" stroke="#356653" stroke-width="1.6"/>
<path d="M214 176L214 186" fill="none" stroke="#768278" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="262" cy="181" r="5" fill="#356653" stroke="#356653" stroke-width="1.6"/>
<path d="M310 176L310 186" fill="none" stroke="#768278" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="358" cy="181" r="5" fill="#356653" stroke="#356653" stroke-width="1.6"/>
<path d="M406 176L406 186" fill="none" stroke="#768278" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="454" cy="181" r="5" fill="#356653" stroke="#356653" stroke-width="1.6"/>
<path d="M502 176L502 186" fill="none" stroke="#768278" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="550" cy="181" r="5" fill="#356653" stroke="#356653" stroke-width="1.6"/>
<path d="M598 176L598 186" fill="none" stroke="#768278" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="646" cy="181" r="5" fill="#356653" stroke="#356653" stroke-width="1.6"/>
<text x="704" y="188" font-family="Georgia, Times New Roman, serif" font-size="26" text-anchor="middle" fill="#29352e">⋯</text>
<path d="M214 166Q238.0 146 258 165" fill="none" stroke="#356653" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="380" y="282" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">a<tspan baseline-shift="sub" font-size="70%">1</tspan> = 3  &lt;  q<tspan baseline-shift="sub" font-size="70%">X</tspan>(3) = 4  ≤  g(3) = 5  &lt;  a<tspan baseline-shift="sub" font-size="70%">2</tspan> = 6</text>
</svg>
