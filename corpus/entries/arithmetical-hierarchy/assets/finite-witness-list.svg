<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Collecting a finite family of witnesses</title>
  <desc id="desc">For three indices, separate witnesses u zero, u one and u two are collected into one list code c. Decoding c at each index recovers its separate witness. An empty index range uses the empty list.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#587064"/></marker>
  </defs>
  <rect width="760" height="390" fill="#fff"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#24382e">
    <text x="380" y="36" text-anchor="middle" font-size="23">Separate witnesses, one finite list</text>
    <rect x="40" y="85" width="220" height="200" rx="7" fill="#f4f7f4" stroke="#8b9f90" stroke-width="1.5"/>
    <text x="150" y="119" text-anchor="middle" font-size="20">For each i &lt; 3</text>
    <text x="150" y="163" text-anchor="middle" font-size="22">i = 0: choose u<tspan baseline-shift="sub" font-size="15">0</tspan></text>
    <text x="150" y="205" text-anchor="middle" font-size="22">i = 1: choose u<tspan baseline-shift="sub" font-size="15">1</tspan></text>
    <text x="150" y="247" text-anchor="middle" font-size="22">i = 2: choose u<tspan baseline-shift="sub" font-size="15">2</tspan></text>
    <rect x="430" y="110" width="290" height="160" rx="7" fill="#edf4ef" stroke="#64816e" stroke-width="1.5"/>
    <text x="575" y="151" text-anchor="middle" font-size="23">c = L([u<tspan baseline-shift="sub" font-size="15">0</tspan>, u<tspan baseline-shift="sub" font-size="15">1</tspan>, u<tspan baseline-shift="sub" font-size="15">2</tspan>])</text>
    <text x="575" y="197" text-anchor="middle" font-size="21">entry(c, i) = u<tspan baseline-shift="sub" font-size="15">i</tspan></text>
    <text x="575" y="236" text-anchor="middle" font-size="19">for every i &lt; 3</text>
    <path d="M260.75 195 H429.25" fill="none" stroke="#587064" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="345" y="175" text-anchor="middle" font-size="18">collect</text>
    <rect x="40" y="315" width="680" height="54" rx="5" fill="#f8f9f7"/>
    <text x="380" y="348" text-anchor="middle" font-size="19">For m = 0, use the empty list: there are no required entries.</text>
  </g>
</svg>
