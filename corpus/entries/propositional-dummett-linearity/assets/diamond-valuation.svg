<svg xmlns="http://www.w3.org/2000/svg" width="440" height="310" viewBox="0 0 440 310" role="img" aria-labelledby="title desc">
  <title id="title">A diamond separates weak excluded middle from linearity</title>
  <desc id="desc">The root r is below incomparable u and v, both below t. Only p zero holds at u, only p one at v, both at t, and neither at r.</desc>
  <rect width="440" height="310" fill="#fafaf7"/>
  <g stroke="#5d7d69" stroke-width="1.6" fill="none">
    <path d="M220 255 L110 155 L220 60 L330 155 Z"/>
  </g>
  <g fill="#50725e">
    <circle cx="220" cy="255" r="3.8"/>
    <circle cx="110" cy="155" r="3.8"/>
    <circle cx="330" cy="155" r="3.8"/>
    <circle cx="220" cy="60" r="3.8"/>
  </g>
  <g fill="#294738" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic">
    <text x="220" y="287" text-anchor="middle">r</text>
    <text x="90" y="161" text-anchor="end">u</text>
    <text x="350" y="161" text-anchor="start">v</text>
    <text x="220" y="36" text-anchor="middle">t</text>
  </g>
  <g fill="#606d64" font-family="Georgia, 'Times New Roman', serif" font-size="18">
    <text x="251" y="262">∅</text>
    <text x="110" y="129" text-anchor="middle">{p₀}</text>
    <text x="330" y="129" text-anchor="middle">{p₁}</text>
    <text x="253" y="67">{p₀, p₁}</text>
  </g>
</svg>
