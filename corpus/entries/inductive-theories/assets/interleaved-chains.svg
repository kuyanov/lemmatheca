<svg xmlns="http://www.w3.org/2000/svg" width="760" height="465" viewBox="0 0 760 465" role="img" aria-labelledby="title desc">
<title id="title">Two cofinal subsequences with one union</title><desc id="desc">An upper elementary chain of M models interleaves with a lower ordinary chain of T-models N. The two unions coincide, so elementary reflection and assumed chain closure recover T in M0.</desc>
<defs><marker id="arrow" viewBox="0 0 10 9" markerWidth="10" markerHeight="9" markerUnits="userSpaceOnUse" refX="8.6" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#245b4b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-778071" viewBox="0 0 10 9" markerWidth="10" markerHeight="9" markerUnits="userSpaceOnUse" refX="8.6" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#778071" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="465" fill="#f3f4ef"/>
<g font-family="Georgia, 'Times New Roman', serif"><text x="380" y="25" font-size="22" fill="#354437" text-anchor="middle">M<tspan baseline-shift="sub" font-size="70%">i</tspan> ⊆ N<tspan baseline-shift="sub" font-size="70%">i</tspan> ⊆ M<tspan baseline-shift="sub" font-size="70%">i+1</tspan></text><text x="380" y="56" font-size="19" fill="#354437" text-anchor="middle">Only the composite is required to be elementary.</text><text x="100" y="129" font-size="26" fill="#245b4b" text-anchor="middle">M<tspan baseline-shift="sub" font-size="70%">0</tspan></text><text x="100" y="280" font-size="26" fill="#354437" text-anchor="middle">N<tspan baseline-shift="sub" font-size="70%">0</tspan></text><path d="M100,147 L100,245" fill="none" stroke="#778071" stroke-width="1.3" marker-end="url(#arrow-778071)"/><text x="100" y="307" font-size="20" fill="#778071" text-anchor="middle">⊨ T</text><text x="300" y="129" font-size="26" fill="#245b4b" text-anchor="middle">M<tspan baseline-shift="sub" font-size="70%">1</tspan></text><text x="300" y="280" font-size="26" fill="#354437" text-anchor="middle">N<tspan baseline-shift="sub" font-size="70%">1</tspan></text><path d="M300,147 L300,245" fill="none" stroke="#778071" stroke-width="1.3" marker-end="url(#arrow-778071)"/><text x="300" y="307" font-size="20" fill="#778071" text-anchor="middle">⊨ T</text><text x="500" y="129" font-size="26" fill="#245b4b" text-anchor="middle">M<tspan baseline-shift="sub" font-size="70%">2</tspan></text><text x="500" y="280" font-size="26" fill="#354437" text-anchor="middle">N<tspan baseline-shift="sub" font-size="70%">2</tspan></text><path d="M500,147 L500,245" fill="none" stroke="#778071" stroke-width="1.3" marker-end="url(#arrow-778071)"/><text x="500" y="307" font-size="20" fill="#778071" text-anchor="middle">⊨ T</text><path d="M135,120 L265,120" fill="none" stroke="#245b4b" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M135,271 L265,271" fill="none" stroke="#778071" stroke-width="1.3" marker-end="url(#arrow-778071)"/><path d="M123,250 L278,147" fill="none" stroke="#778071" stroke-width="1.3" marker-end="url(#arrow-778071)"/><path d="M335,120 L465,120" fill="none" stroke="#245b4b" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M335,271 L465,271" fill="none" stroke="#778071" stroke-width="1.3" marker-end="url(#arrow-778071)"/><path d="M323,250 L478,147" fill="none" stroke="#778071" stroke-width="1.3" marker-end="url(#arrow-778071)"/><text x="389" y="92" font-size="19" fill="#245b4b" text-anchor="middle">elementary M-subsequence</text><text x="392" y="345" font-size="19" fill="#778071" text-anchor="middle">ordinary N-subsequence</text><text x="602" y="130" font-size="28" fill="#245b4b" text-anchor="middle">⋯</text><text x="602" y="280" font-size="28" fill="#778071" text-anchor="middle">⋯</text><path d="M630,120 H679 Q700,120 700,175 V187" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M630,271 H679 Q700,271 700,232 V221" fill="none" stroke="#778071" stroke-width="1.3" marker-end="url(#arrow-778071)"/><text x="700" y="211" font-size="28" fill="#245b4b" text-anchor="middle">U</text><text x="380" y="391" font-size="25" fill="#245b4b" text-anchor="middle">⋃<tspan baseline-shift="sub" font-size="70%">i</tspan> M<tspan baseline-shift="sub" font-size="70%">i</tspan> = ⋃<tspan baseline-shift="sub" font-size="70%">i</tspan> N<tspan baseline-shift="sub" font-size="70%">i</tspan> = U</text><text x="380" y="426" font-size="19" fill="#354437" text-anchor="middle">N-chain closure gives U ⊨ T; the M-chain makes M<tspan baseline-shift="sub" font-size="70%">0</tspan> elementary in U.</text><text x="380" y="454" font-size="20" fill="#245b4b" text-anchor="middle">Therefore M<tspan baseline-shift="sub" font-size="70%">0</tspan> ⊨ T.</text></g></svg>
