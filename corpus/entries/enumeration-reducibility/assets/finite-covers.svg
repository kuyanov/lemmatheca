<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Compose positive rules by uniting their evidence</title>
  <desc id="desc">Input evidence D c zero and D c one gives the two intermediate outputs y zero and y one. Together these intermediate outputs trigger the outer output n. The composite needs the union of the two input evidence sets.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#576c65"/></marker></defs>
  <g fill="none" stroke="#576c65" stroke-width="2" marker-end="url(#arrow)">
    <path d="M180 232 V172"/>
    <path d="M460 232 V172"/>
    <path d="M180 124 L290 68"/>
    <path d="M460 124 L350 68"/>
  </g>
  <g stroke="#86a497" stroke-width="1.5">
    <rect x="260" y="20" width="120" height="48" rx="9" fill="#e8f1eb"/>
    <rect x="100" y="124" width="160" height="48" rx="9" fill="#f1f3ee"/>
    <rect x="380" y="124" width="160" height="48" rx="9" fill="#f1f3ee"/>
    <rect x="80" y="232" width="200" height="46" rx="9" fill="#faf8f0"/>
    <rect x="360" y="232" width="200" height="46" rx="9" fill="#faf8f0"/>
  </g>
  <g fill="#263b32" text-anchor="middle" font-family="Georgia,serif" font-size="26">
    <text x="320" y="51" font-style="italic">n</text>
    <text x="180" y="155"><tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="18">0</tspan></text>
    <text x="460" y="155"><tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="18">1</tspan></text>
    <text x="180" y="263"><tspan font-style="italic">D</tspan><tspan baseline-shift="sub" font-size="18">c₀</tspan></text>
    <text x="460" y="263"><tspan font-style="italic">D</tspan><tspan baseline-shift="sub" font-size="18">c₁</tspan></text>
  </g>
  <g fill="#53665e" font-family="system-ui,sans-serif" font-size="24">
    <text x="320" y="103" text-anchor="middle">outer rule</text>
    <text x="195" y="207">inner rule</text>
    <text x="475" y="207">inner rule</text>
  </g>
</svg>
