<svg xmlns="http://www.w3.org/2000/svg" width="760" height="830" viewBox="0 0 760 830" role="img" aria-labelledby="title desc">
<title id="title">Recursion and sequential-search register loops</title><desc id="desc">Recursion decrements the countdown before calling the step at the old index, then replaces the previous answer and increments the index. Search tests candidate zero first, increments only after a positive return, and copies the successful candidate on a zero return. All boxes are finite increment and decrement programs.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" viewBox="-1 -1 11 11" refX="8.7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9" fill="none" stroke="#245b4b" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></marker></defs>
<rect width="760" height="830" fill="#f3f4ef"/>
<text x="28" y="33" font-family="Georgia, Times New Roman, serif" font-size="23" text-anchor="start" fill="#252d29">Primitive recursion</text>
<path d="M28 433L732 433" fill="none" stroke="#bbc7b9" stroke-width="1"/>
<text x="28" y="467" font-family="Georgia, Times New Roman, serif" font-size="23" text-anchor="start" fill="#252d29">Sequential minimization</text>
<path d="M340 120.6L340 154.4" fill="none" stroke="#245b4b" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M340 199.6L340 233.4" fill="none" stroke="#245b4b" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M340 286.6L340 321.4" fill="none" stroke="#245b4b" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M179.4 351L120 351L120 177L239.4 177" fill="none" stroke="#245b4b" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M440.6 177L539.4 177" fill="none" stroke="#245b4b" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M340 538.6L340 573.4" fill="none" stroke="#245b4b" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M340 618.6L340 653.4" fill="none" stroke="#245b4b" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M340 698.6L340 741.4" fill="none" stroke="#245b4b" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M179.4 771L120 771L120 596L179.4 596" fill="none" stroke="#245b4b" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M440.6 676L539.4 676" fill="none" stroke="#245b4b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="180" y="60" width="320" height="60" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="340.0" y="83.0" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">copy N → D; J ← 0</text>
<text x="340.0" y="109.0" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">call g(x̄) → B</text>
<rect x="240" y="155" width="200" height="44" rx="5" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="340.0" y="183.0" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">decrement D</text>
<rect x="180" y="234" width="320" height="52" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="340.0" y="266.0" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">call h(x̄, J, B) → V</text>
<rect x="180" y="322" width="320" height="58" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="340.0" y="344.0" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">clear B; transfer V → B</text>
<text x="340.0" y="370.0" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">increment J; goto test</text>
<rect x="540" y="147" width="190" height="60" rx="5" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="635.0" y="170.0" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">clear J</text>
<text x="635.0" y="196.0" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">halt with B = a<tspan baseline-shift="sub" font-size="70%">N</tspan></text>
<text x="354" y="222" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="start" fill="#245b4b">positive</text>
<text x="490" y="164" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="middle" fill="#245b4b">zero</text>
<text x="535" y="80" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="start" fill="#73796f">At the loop head:</text>
<text x="535" y="105" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="start" fill="#73796f">D = N − j;  J = j</text>
<text x="535" y="130" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="start" fill="#73796f">B = a<tspan baseline-shift="sub" font-size="70%">j</tspan>;  V = 0</text>
<text x="28" y="409" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="start" fill="#73796f">Each call restores its inputs and clears its own work.</text>
<rect x="180" y="494" width="320" height="44" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="340.0" y="522.0" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">J ← 0;  B ← 0;  V ← 0</text>
<rect x="180" y="574" width="320" height="44" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="340.0" y="602.0" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">call f(x̄, J) → V</text>
<rect x="240" y="654" width="200" height="44" rx="5" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="340.0" y="682.0" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">decrement V</text>
<rect x="180" y="742" width="320" height="58" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="340.0" y="764.0" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">clear V; increment J</text>
<text x="340.0" y="790.0" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">goto the test call</text>
<rect x="540" y="646" width="190" height="60" rx="5" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="635.0" y="669.0" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#252d29">copy J → B; clear J</text>
<text x="635.0" y="695.0" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#252d29">halt with B = j</text>
<text x="354" y="725" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="start" fill="#245b4b">positive</text>
<text x="490" y="663" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="middle" fill="#245b4b">zero</text>
<text x="535" y="514" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="start" fill="#73796f">At candidate j:</text>
<text x="535" y="539" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="start" fill="#73796f">J = j;  B = V = 0</text>
<text x="535" y="564" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="start" fill="#73796f">earlier tests returned &gt; 0</text>
<text x="28" y="819" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="start" fill="#73796f">An undefined call does not reach its outgoing arrow.</text>
</svg>
