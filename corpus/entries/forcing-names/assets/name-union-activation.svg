<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img" aria-labelledby="title desc">
<title id="title">Two attachments must both be active in a union name</title><desc id="desc">The active two-edge name path with labels p,q can be flattened using a common refinement r in G. A second path has inactive outer label p and active inner label1; the outer inactivity excludes its empty child from the union value.</desc>
<rect width="760" height="490" fill="#f3f4ef"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#356653" stroke-width="1.4"/></marker><marker id="grey-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#768278" stroke-width="1.4"/></marker></defs>
<text x="380.0" y="34" font-family="Georgia, Times New Roman, serif" font-size="23" text-anchor="middle" fill="#29352e" font-weight="bold">A union name remembers both attachment conditions</text>
<text x="235" y="78" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">Both attachments active</text>
<text x="588" y="78" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">Outer attachment inactive</text>
<circle cx="105" cy="120" r="20" fill="#f3f4ef" stroke="#356653" stroke-width="1.6"/>
<text x="105" y="127" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">τ</text>
<circle cx="105" cy="240" r="20" fill="#f3f4ef" stroke="#356653" stroke-width="1.6"/>
<text x="105" y="247" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">π</text>
<circle cx="105" cy="355" r="20" fill="#f3f4ef" stroke="#356653" stroke-width="1.6"/>
<text x="105" y="362" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">χ</text>
<path d="M105 142L105 216" fill="none" stroke="#356653" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M105 262L105 331" fill="none" stroke="#356653" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="320" cy="120" r="34" fill="#f3f4ef" stroke="#356653" stroke-width="1.6"/>
<text x="320" y="127" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">un(τ)</text>
<circle cx="320" cy="355" r="20" fill="#f3f4ef" stroke="#356653" stroke-width="1.6"/>
<text x="320" y="362" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">χ</text>
<circle cx="585" cy="120" r="20" fill="#f3f4ef" stroke="#356653" stroke-width="1.6"/>
<text x="585" y="127" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">τ</text>
<circle cx="585" cy="240" r="20" fill="#f3f4ef" stroke="#356653" stroke-width="1.6"/>
<text x="585" y="247" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">π</text>
<circle cx="585" cy="355" r="20" fill="#f3f4ef" stroke="#356653" stroke-width="1.6"/>
<text x="585" y="362" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">∅</text>
<path d="M585 142L585 216" fill="none" stroke="#8b6d48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#grey-arrow)"/>
<path d="M585 262L585 331" fill="none" stroke="#356653" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="161" y="187" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#29352e">p ∈ G</text>
<text x="161" y="301" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#29352e">q ∈ G</text>
<text x="641" y="187" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#8b6d48">p ∉ G</text>
<text x="650" y="301" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#29352e">1<tspan baseline-shift="sub" font-size="70%">P</tspan> ∈ G</text>
<path d="M320 156L320 329" fill="none" stroke="#356653" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="382" y="232" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">r ∈ G</text>
<text x="382" y="257" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">r ≤ p,q</text>
<path d="M173 245H262" fill="none" stroke="#768278" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#grey-arrow)"/>
<text x="222" y="220" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">refine</text>
<text x="213" y="415" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#29352e">χ[G] ∈ ⋃τ[G]</text>
<text x="213" y="441" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#29352e">via the attachment (χ,r)</text>
<text x="585" y="412" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#29352e">τ[G] = ∅, so ⋃τ[G] = ∅</text>
<text x="585" y="438" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#29352e">Naive flattening adds ∅.</text>
</svg>
