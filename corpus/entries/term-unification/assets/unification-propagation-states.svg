<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" role="img" aria-labelledby="title desc"><title id="title">Propagation through accumulated substitutions</title><desc id="desc">The worked unification problem decomposes, eliminates x0 and x3, and finally propagates x2=a into the stored image x0=g(x2), yielding x0=g(a).</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" viewBox="0 0 8 8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 L2.5 4 Z" fill="#245b4b"/></marker></defs>
<rect width="760" height="510" fill="#f3f4ef"/>
<text x="380" y="35" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#303b34">f(x<tspan baseline-shift="sub" font-size="75%">0</tspan>,g(x<tspan baseline-shift="sub" font-size="75%">1</tspan>)) ≐ f(g(x<tspan baseline-shift="sub" font-size="75%">2</tspan>),x<tspan baseline-shift="sub" font-size="75%">3</tspan>),  x<tspan baseline-shift="sub" font-size="75%">2</tspan> ≐ a</text>
<text x="205" y="92" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">remaining equations</text>
<text x="580" y="92" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">accumulated images</text>
<rect x="25" y="104" width="710" height="54" rx="6" fill="none" stroke="#8ea38a" stroke-width="1.2"/>
<text x="205" y="138" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#303b34">x<tspan baseline-shift="sub" font-size="75%">0</tspan> ≐ g(x<tspan baseline-shift="sub" font-size="75%">2</tspan>),  x<tspan baseline-shift="sub" font-size="75%">3</tspan> ≐ g(x<tspan baseline-shift="sub" font-size="75%">1</tspan>),  x<tspan baseline-shift="sub" font-size="75%">2</tspan> ≐ a</text>
<text x="575" y="138" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#245b4b">identity</text>
<rect x="25" y="202" width="710" height="54" rx="6" fill="none" stroke="#8ea38a" stroke-width="1.2"/>
<text x="205" y="236" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#303b34">x<tspan baseline-shift="sub" font-size="75%">3</tspan> ≐ g(x<tspan baseline-shift="sub" font-size="75%">1</tspan>),  x<tspan baseline-shift="sub" font-size="75%">2</tspan> ≐ a</text>
<text x="575" y="236" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#245b4b">x<tspan baseline-shift="sub" font-size="75%">0</tspan> ↦ g(x<tspan baseline-shift="sub" font-size="75%">2</tspan>)</text>
<rect x="25" y="300" width="710" height="54" rx="6" fill="none" stroke="#8ea38a" stroke-width="1.2"/>
<text x="205" y="334" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#303b34">x<tspan baseline-shift="sub" font-size="75%">2</tspan> ≐ a</text>
<text x="575" y="334" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#245b4b">x<tspan baseline-shift="sub" font-size="75%">0</tspan> ↦ g(x<tspan baseline-shift="sub" font-size="75%">2</tspan>),  x<tspan baseline-shift="sub" font-size="75%">3</tspan> ↦ g(x<tspan baseline-shift="sub" font-size="75%">1</tspan>)</text>
<rect x="25" y="398" width="710" height="54" rx="6" fill="none" stroke="#8ea38a" stroke-width="1.2"/>
<text x="205" y="432" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#303b34">none</text>
<text x="575" y="432" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#245b4b">x<tspan baseline-shift="sub" font-size="75%">0</tspan> ↦ g(a),  x<tspan baseline-shift="sub" font-size="75%">2</tspan> ↦ a,  x<tspan baseline-shift="sub" font-size="75%">3</tspan> ↦ g(x<tspan baseline-shift="sub" font-size="75%">1</tspan>)</text>
<path d="M55 158 L55 202" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380" y="185" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">eliminate x<tspan baseline-shift="sub" font-size="75%">0</tspan></text>
<path d="M55 256 L55 300" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380" y="283" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">eliminate x<tspan baseline-shift="sub" font-size="75%">3</tspan></text>
<path d="M55 354 L55 398" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380" y="381" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">eliminate x<tspan baseline-shift="sub" font-size="75%">2</tspan>; apply it to stored images too</text>
<text x="380" y="492" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">x<tspan baseline-shift="sub" font-size="75%">1</tspan> remains freely choosable; all other unmentioned variables are fixed.</text>
</svg>
