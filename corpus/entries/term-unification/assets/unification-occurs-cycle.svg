<svg xmlns="http://www.w3.org/2000/svg" width="760" height="425" viewBox="0 0 760 425" role="img" aria-labelledby="title desc"><title id="title">An occurs-check cycle exposed by elimination</title><desc id="desc">Eliminating x0 from x0=f(x1),x1=f(x0) produces x1=f(f(x1)). After substitution the right-hand tree contains the whole image of x1 as a proper descendant.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#245b4b" stroke-width="1.2"/></marker></defs>
<rect width="760" height="425" fill="#f3f4ef"/>
<text x="165" y="78" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#303b34">x<tspan baseline-shift="sub" font-size="75%">0</tspan> ≐ f(x<tspan baseline-shift="sub" font-size="75%">1</tspan>)</text>
<text x="165" y="123" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#303b34">x<tspan baseline-shift="sub" font-size="75%">1</tspan> ≐ f(x<tspan baseline-shift="sub" font-size="75%">0</tspan>)</text>
<path d="M287 115 L425 115" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="355" y="85" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">x<tspan baseline-shift="sub" font-size="75%">0</tspan> ↦ f(x<tspan baseline-shift="sub" font-size="75%">1</tspan>)</text>
<text x="565" y="65" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#245b4b">x<tspan baseline-shift="sub" font-size="75%">1</tspan> ≐ f(f(x<tspan baseline-shift="sub" font-size="75%">1</tspan>))</text>
<circle cx="565" cy="126" r="25" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.3"/>
<text x="565" y="133" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b">f</text>
<path d="M565 153 L565 188" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="565" cy="216" r="25" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.3"/>
<text x="565" y="223" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b">f</text>
<path d="M565 244 L565 280" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="494" y="287" width="142" height="47" rx="6" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.2"/>
<text x="565" y="318" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#245b4b">σ(x<tspan baseline-shift="sub" font-size="75%">1</tspan>)</text>
<text x="435" y="151" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#73796f">t[σ]</text>
<path d="M646 118 H675 V334 H646" fill="none" stroke="#8ea38a" stroke-width="1.5"/>
<text x="179" y="244" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#303b34">A proper descendant</text>
<text x="179" y="274" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#303b34">has smaller node count.</text>
<text x="380" y="389" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#956b60">|σ(x<tspan baseline-shift="sub" font-size="75%">1</tspan>)| &lt; |f(f(σ(x<tspan baseline-shift="sub" font-size="75%">1</tspan>)))|: finite terms cannot satisfy this equality.</text>
</svg>
