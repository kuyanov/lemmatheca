<text x="381" y="59" font-family="Georgia, Times New Roman, serif" font-size="24" text-anchor="middle" fill="#245b4b">e<tspan baseline-shift="sub" font-size="70%">1</tspan></text>
<path d="M468.1 55.0L541.9 55.0" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="505.0" y="40" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#245b4b">f</text>
<rect x="275" y="103" width="210" height="243" rx="5" fill="none" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="292" y="132" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="start" fill="#245b4b">B</text>
