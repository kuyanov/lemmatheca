<text x="353" y="260" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#252d29">x<tspan baseline-shift="sub" font-size="70%">0</tspan></text>
<circle cx="449" cy="232" r="6" fill="#245b4b"/>
