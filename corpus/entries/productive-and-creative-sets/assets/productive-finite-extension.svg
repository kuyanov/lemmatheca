<circle cx="699" cy="232" r="6" fill="#245b4b"/>
<text x="699" y="212" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#245b4b">x<tspan baseline-shift="sub" font-size="70%">2</tspan></text>
<text x="699" y="269" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#245b4b">p(e<tspan baseline-shift="sub" font-size="70%">2</tspan>)</text>
<text x="380" y="385" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">Every new point lies in B, outside the current domain.</text>
<text x="380" y="413" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#73796f">The next domain keeps all previous points and adjoins that point.</text>
