<text x="103" y="187" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#245b4b">W<tspan baseline-shift="sub" font-size="70%">e<tspan baseline-shift="sub" font-size="70%">0</tspan></tspan></text>
<text x="103" y="247" font-family="Georgia, Times New Roman, serif" font-size="31" text-anchor="middle" fill="#73796f">∅</text>
<circle cx="199" cy="232" r="6" fill="#245b4b"/>
<text x="199" y="212" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#245b4b">x<tspan baseline-shift="sub" font-size="70%">0</tspan></text>
<text x="199" y="269" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#245b4b">p(e<tspan baseline-shift="sub" font-size="70%">0</tspan>)</text>
