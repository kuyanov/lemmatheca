<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">Productive escape enlarges an enumerable finite domain</title><desc id="desc">Three snapshots of the same productive set B. Index e0 has empty domain; p(e0)=x0 lies outside it. The next domain contains x0, and p(e1)=x1 is fresh. The third domain contains x0 and x1, and p(e2)=x2 is fresh. The index arrows apply the same total transformation f.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#245b4b"/></marker></defs>
<rect width="760" height="430" fill="#f3f4ef"/>
<rect x="42.5" y="30" width="175" height="50" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="130.5" y="60" font-family="Georgia, Times New Roman, serif" font-size="24" text-anchor="middle" fill="#245b4b">e<tspan baseline-shift="sub" font-size="70%">0</tspan></text>
<path d="M218.1 55.0L291.9 55.0" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="255.0" y="40" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#245b4b">f</text>
