<text x="603" y="187" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#245b4b">W<tspan baseline-shift="sub" font-size="70%">e<tspan baseline-shift="sub" font-size="70%">2</tspan></tspan></text>
