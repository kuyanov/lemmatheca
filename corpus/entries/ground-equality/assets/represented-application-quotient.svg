<svg xmlns="http://www.w3.org/2000/svg" width="760" height="465" viewBox="0 0 760 465" role="img" aria-labelledby="title desc"><title id="title">A retained application on an equivalence class</title><desc id="desc">The retained terms a and b project to one class. Its f-value is the class of retained f(a), even though f(b) is absent from the retained set. A separate default point handles other unrepresented tuples.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" viewBox="0 0 8 8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 L2.5 4 Z" fill="#245b4b"/></marker></defs>
<rect width="760" height="465" fill="#f3f4ef"/>
<rect x="40" y="65" width="190" height="285" rx="6" fill="none" stroke="#8ea38a" stroke-width="1.2"/>
<text x="135" y="43" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">retained terms S</text>
<text x="130" y="110" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#303b34">a</text>
<text x="130" y="165" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#303b34">b</text>
<text x="130" y="220" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#303b34">c</text>
<text x="130" y="290" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#303b34">f(a)</text>
<ellipse cx="415" cy="135" rx="89" ry="37" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.2"/>
<text x="415" y="142" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#245b4b">[a] = [b]</text>
<ellipse cx="647" cy="135" rx="65" ry="37" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.2"/>
<text x="647" y="142" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#245b4b">[f(a)]</text>
<ellipse cx="415" cy="285" rx="57" ry="31" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.2"/>
<text x="415" y="292" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#303b34">[c]</text>
<circle cx="650" cy="350" r="25" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.3"/>
<text x="650" y="350" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b" dominant-baseline="central">∗</text>
<path d="M165 104 L329.7129652510387 124.4244076911288" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M165 160 L328.4681557897794 143.65318442102205" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M165 284 H260 V48 H647 V98" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M165 214 L364.4740829315356 270.6506395525561" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M504 135 L582 135" fill="none" stroke="#245b4b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="543" y="119" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b">f</text>
<text x="540" y="239" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#303b34">[f(a)] ≠ [c]</text>
<text x="650" y="394" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">default point</text>
<text x="135" y="394" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#73796f">f(b) ∉ S</text>
<text x="347" y="440" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#245b4b">Yet f([b]) = [f(a)]: a retained representative application exists.</text>
</svg>
