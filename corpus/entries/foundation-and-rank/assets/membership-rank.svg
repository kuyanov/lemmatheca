<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
  <title id="title">Membership lowers rank</title>
  <desc id="desc">The sets x={a,b}, b={a}, a={0}, and 0=empty set have ranks three, two, one, and zero. Arrows run from x to b and a, from b to a, and from a to zero.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#245b4b" stroke-width="1.2"/></marker></defs>
  <rect width="760" height="350" fill="#f3f4ef"/>
  <g stroke="#dedfd6" stroke-width="1"><path d="M74 55 H684 M74 125 H684 M74 195 H684 M74 265 H684"/></g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#73796f"><text x="74" y="44">Rank</text><text x="88" y="82">3</text><text x="88" y="152">2</text><text x="88" y="222">1</text><text x="88" y="292">0</text></g>
  <g fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M370 87 V126"/>
    <path d="M370 157 V196"/>
    <path d="M370 227 V266"/>
    <path d="M355 78 C260 88 260 193 355 207"/>
  </g>
  <g fill="#e5ede3" stroke="#8ea38a" stroke-width="1.2"><circle cx="370" cy="72" r="15"/><circle cx="370" cy="142" r="15"/><circle cx="370" cy="212" r="15"/><circle cx="370" cy="282" r="15"/></g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#245b4b" text-anchor="middle"><text x="370" y="79" font-style="italic">x</text><text x="370" y="149" font-style="italic">b</text><text x="370" y="219" font-style="italic">a</text><text x="370" y="289">0</text></g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#252d29"><text x="425" y="79">x = {a, b}</text><text x="425" y="149">b = {a}</text><text x="425" y="219">a = {0}</text><text x="425" y="289">0 = ∅</text></g>
  <text x="380" y="338" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#73796f">Arrows point to members.</text>
</svg>
