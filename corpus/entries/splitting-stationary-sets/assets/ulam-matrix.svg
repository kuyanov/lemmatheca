<svg xmlns="http://www.w3.org/2000/svg" width="760" height="465" viewBox="0 0 760 465" role="img" aria-labelledby="title desc">
<title id="title">Selecting a row of the Ulam matrix</title><desc id="desc">A finite schematic window has rows indexed by i and columns by alpha. A star marks one chosen stationary intersection in each column. The retained choices in row one are highlighted, and different cells in that row are disjoint.</desc>
