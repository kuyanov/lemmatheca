<text x="380" y="430" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">In column α:   ⋃<tspan baseline-shift="sub" font-size="70%">i</tspan> Aⁱ<tspan baseline-shift="sub" font-size="70%">α</tspan> = λ ∖ (α + 1),    λ = κ⁺</text>
