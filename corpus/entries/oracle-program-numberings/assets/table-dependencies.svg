<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" role="img" aria-labelledby="title desc">
  <title id="title">Bounded oracle evaluation uses completed finite tables</title>
  <desc id="desc">A row at the new allowance receives values from the same code's row at the old allowance, or from a smaller code's completed row at the new allowance. All entries are optional-output codes. The query row writes the oracle answer plus one.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#245b4b" stroke="none"/></marker></defs>
  <rect width="760" height="510" fill="#f3f4ef"/>
  <g font-family="Georgia, Times New Roman, serif" fill="#252d29">
    <text x="380" y="34" text-anchor="middle" font-size="24">Fill each row from completed information</text>
    <text x="186" y="70" text-anchor="middle" font-size="22">Old allowance k</text>
    <text x="574" y="70" text-anchor="middle" font-size="22">New allowance k + 1</text>
    <rect x="36" y="86" width="300" height="288" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
    <rect x="424" y="86" width="300" height="288" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
    <text x="186" y="123" text-anchor="middle" font-size="22" fill="#245b4b">H<tspan baseline-shift="sub" font-size="70%">k</tspan>(e)</text>
    <text x="574" y="123" text-anchor="middle" font-size="22" fill="#245b4b">H<tspan baseline-shift="sub" font-size="70%">k+1</tspan>(e)</text>
    <rect x="52" y="155" width="268" height="54" rx="3" fill="#eff1e9" stroke="#bbc7b9" stroke-width="1.2"/>
    <rect x="440" y="155" width="268" height="54" rx="3" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
    <text x="186" y="189" text-anchor="middle" font-size="20">earlier rows</text>
    <text x="574" y="189" text-anchor="middle" font-size="20">completed row r &lt; p</text>
    <text x="186" y="249" text-anchor="middle" font-size="24" fill="#73796f">⋮</text>
    <rect x="52" y="280" width="268" height="54" rx="3" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
    <rect x="440" y="280" width="268" height="54" rx="3" fill="#e1e9dc" stroke="#245b4b" stroke-width="1.2"/>
    <text x="186" y="314" text-anchor="middle" font-size="20">row p: inputs x &lt; k</text>
    <text x="574" y="314" text-anchor="middle" font-size="20">row p: inputs x &lt; k + 1</text>
    <path d="M320.6 307L439.4 307" fill="none" stroke="#245b4b" stroke-width="1.7" stroke-linecap="butt" marker-end="url(#arrow)"/>
    <text x="380" y="292" text-anchor="middle" font-size="17" fill="#245b4b">same code</text>
    <path d="M574 209.6L574 279.4" fill="none" stroke="#245b4b" stroke-width="1.7" stroke-linecap="butt" marker-end="url(#arrow)"/>
    <text x="508" y="242" text-anchor="middle" font-size="17" fill="#245b4b">smaller code</text>
    <text x="574" y="358" text-anchor="middle" font-size="17" fill="#73796f">build this row after its children</text>
    <rect x="36" y="404" width="688" height="82" rx="5" fill="#e1e9dc"/>
    <text x="380" y="434" text-anchor="middle" font-size="21" fill="#245b4b">Query row (code 4): entry at x is χ<tspan baseline-shift="sub" font-size="70%">A</tspan>(x) + 1</text>
    <text x="380" y="470" text-anchor="middle" font-size="19">An input outside its row's allowance gives failure code 0.</text>
  </g>
</svg>
