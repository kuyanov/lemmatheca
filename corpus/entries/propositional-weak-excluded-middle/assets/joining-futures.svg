<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" role="img" aria-labelledby="title desc">
  <title id="title">Two futures with and without a common continuation</title>
  <desc id="desc">A three-world fork has root w and incomparable terminal futures u and v. A second diagram has w below u and v and a common extension z above both.</desc>
  <g fill="#304a3e" font-family="Georgia, 'Times New Roman', serif" font-size="20">
    <text x="170" y="30" text-anchor="middle">The fork</text>
    <text x="525" y="30" text-anchor="middle">A common continuation</text>
  </g>
  <g fill="none" stroke="#546b61" stroke-width="1.5">
    <path d="M 170 230 L 90 105"/><path d="M 170 230 L 250 105"/>
    <path d="M 525 230 L 445 160"/><path d="M 525 230 L 605 160"/>
    <path d="M 445 160 L 525 80"/><path d="M 605 160 L 525 80"/>
  </g>
  <g fill="#dce7de" stroke="#496454" stroke-width="1.5">
    <circle cx="170" cy="230" r="4"/><circle cx="90" cy="105" r="4"/><circle cx="250" cy="105" r="4"/>
    <circle cx="525" cy="230" r="4"/><circle cx="445" cy="160" r="4"/><circle cx="605" cy="160" r="4"/><circle cx="525" cy="80" r="4"/>
  </g>
  <g fill="#233b2d" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic">
    <text x="170" y="260" text-anchor="middle">w</text><text x="78" y="91" text-anchor="middle">u</text><text x="262" y="91" text-anchor="middle">v</text>
    <text x="525" y="260" text-anchor="middle">w</text><text x="430" y="157" text-anchor="end">u</text><text x="620" y="157">v</text><text x="525" y="64" text-anchor="middle">z</text>
  </g>
  <text x="170" y="60" text-anchor="middle" fill="#6a756d" font-family="Georgia, 'Times New Roman', serif" font-size="17">no shared future</text>
</svg>
