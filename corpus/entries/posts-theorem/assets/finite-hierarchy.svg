<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" role="img" aria-labelledby="title desc">
  <title id="title">The first levels above a fixed oracle</title>
  <desc id="desc">Strict inclusion arrows split from the common computable base to Sigma one and Pi one, merge at Delta two, split at Sigma two and Pi two, and merge at Delta three. Delta zero and Delta one coincide.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="10" refY="5" orient="auto">
      <path d="M0 1 L10 5 L0 9 Z" fill="#496c59"/>
    </marker>
  </defs>
  <rect width="760" height="680" fill="#fff"/>
  <g stroke="#496c59" stroke-width="1.7" fill="none" marker-end="url(#arrow)">
    <!-- Each endpoint lies on the outer painted box boundary. The marker's
         painted tip is its reference point, so the arrow meets that boundary.
         Vertical offset is 29 + 0.75; horizontal offset is 190*29.75/128. -->
    <path d="M335.83984375 91.75 L234.16015625 160.25"/>
    <path d="M424.16015625 91.75 L525.83984375 160.25"/>
    <path d="M234.16015625 219.75 L335.83984375 288.25"/>
    <path d="M525.83984375 219.75 L424.16015625 288.25"/>
    <path d="M335.83984375 347.75 L234.16015625 416.25"/>
    <path d="M424.16015625 347.75 L525.83984375 416.25"/>
    <path d="M234.16015625 475.75 L335.83984375 544.25"/>
    <path d="M525.83984375 475.75 L424.16015625 544.25"/>
  </g>
  <g stroke="#8c9d91" stroke-width="1.5" fill="#f5f8f4">
    <rect x="140" y="33" width="480" height="58" rx="9"/>
    <rect x="90" y="161" width="200" height="58" rx="9"/>
    <rect x="470" y="161" width="200" height="58" rx="9"/>
    <rect x="280" y="289" width="200" height="58" rx="9"/>
    <rect x="90" y="417" width="200" height="58" rx="9"/>
    <rect x="470" y="417" width="200" height="58" rx="9"/>
    <rect x="280" y="545" width="200" height="58" rx="9"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#273d31" text-anchor="middle">
    <text x="380" y="73">Σ<tspan font-size="20" dy="7">0</tspan><tspan font-size="19" dy="-23">B</tspan><tspan font-size="30" dy="16"> = Π</tspan><tspan font-size="20" dy="7">0</tspan><tspan font-size="19" dy="-23">B</tspan><tspan font-size="30" dy="16"> = Δ</tspan><tspan font-size="20" dy="7">0</tspan><tspan font-size="19" dy="-23">B</tspan><tspan font-size="30" dy="16"> = Δ</tspan><tspan font-size="20" dy="7">1</tspan><tspan font-size="19" dy="-23">B</tspan></text>
    <text x="190" y="201">Σ<tspan font-size="20" dy="7">1</tspan><tspan font-size="19" dy="-23">B</tspan></text>
    <text x="570" y="201">Π<tspan font-size="20" dy="7">1</tspan><tspan font-size="19" dy="-23">B</tspan></text>
    <text x="380" y="329">Δ<tspan font-size="20" dy="7">2</tspan><tspan font-size="19" dy="-23">B</tspan></text>
    <text x="190" y="457">Σ<tspan font-size="20" dy="7">2</tspan><tspan font-size="19" dy="-23">B</tspan></text>
    <text x="570" y="457">Π<tspan font-size="20" dy="7">2</tspan><tspan font-size="19" dy="-23">B</tspan></text>
    <text x="380" y="585">Δ<tspan font-size="20" dy="7">3</tspan><tspan font-size="19" dy="-23">B</tspan></text>
  </g>
  <text x="380" y="648" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#526157" text-anchor="middle">Every arrow is a proper inclusion.</text>
</svg>
