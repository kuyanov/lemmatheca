<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Three countably infinite well-order types</title>
  <desc id="desc">Omega has the natural-number positions and no last point. Omega plus one has those positions followed by a final point labelled omega. Omega times two has two consecutive infinite blocks; the second starts at omega. The dots indicate that each infinite block continues beyond the positions shown.</desc>
  <style>
    .order-label { fill: #252d29; font: 25px Georgia, "Times New Roman", serif; }
    .position-label { fill: #252d29; font: 18px Georgia, "Times New Roman", serif; text-anchor: middle; }
    .annotation { fill: #73796f; font: 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
    .order-line { fill: none; stroke: #a8b2a2; stroke-width: 1.5; stroke-linecap: round; }
    .point { fill: #245b4b; }
    .continuation { fill: #73796f; }
    .separator { stroke: #dedfd6; stroke-width: 1; }
  </style>

  <path class="separator" d="M28 123H692 M28 235H692"/>

  <g aria-label="Omega: no last point">
    <text x="28" y="77" class="order-label">ω</text>
    <path class="order-line" d="M152 68H326"/>
    <g class="point">
      <circle cx="160" cy="68" r="4"/><circle cx="202" cy="68" r="4"/>
      <circle cx="244" cy="68" r="4"/><circle cx="286" cy="68" r="4"/>
    </g>
    <g class="continuation">
      <circle cx="344" cy="68" r="1.5"/><circle cx="354" cy="68" r="1.5"/><circle cx="364" cy="68" r="1.5"/>
    </g>
    <g class="position-label">
      <text x="160" y="99">0</text><text x="202" y="99">1</text>
      <text x="244" y="99">2</text><text x="286" y="99">3</text>
    </g>
    <text x="521" y="73" class="annotation">no last point</text>
  </g>

  <g aria-label="Omega plus one: a final point after the infinite block">
    <text x="28" y="189" class="order-label">ω + 1</text>
    <path class="order-line" d="M152 180H326 M391 180H521"/>
    <g class="point">
      <circle cx="160" cy="180" r="4"/><circle cx="202" cy="180" r="4"/>
      <circle cx="244" cy="180" r="4"/><circle cx="286" cy="180" r="4"/>
    </g>
    <g class="continuation">
      <circle cx="344" cy="180" r="1.5"/><circle cx="354" cy="180" r="1.5"/><circle cx="364" cy="180" r="1.5"/>
    </g>
    <circle cx="521" cy="180" r="5" fill="#f3f4ef" stroke="#245b4b" stroke-width="1.8"/>
    <g class="position-label">
      <text x="160" y="211">0</text><text x="202" y="211">1</text>
      <text x="244" y="211">2</text><text x="286" y="211">3</text>
      <text x="521" y="211">ω</text>
    </g>
    <text x="521" y="155" class="annotation">last point</text>
  </g>

  <g aria-label="Omega times two: two successive infinite blocks">
    <text x="28" y="301" class="order-label">ω · 2</text>
    <path class="order-line" d="M152 292H326 M428 292H650"/>
    <g class="point">
      <circle cx="160" cy="292" r="4"/><circle cx="202" cy="292" r="4"/>
      <circle cx="244" cy="292" r="4"/><circle cx="286" cy="292" r="4"/>
      <circle cx="436" cy="292" r="4"/><circle cx="496" cy="292" r="4"/>
      <circle cx="556" cy="292" r="4"/><circle cx="616" cy="292" r="4"/>
    </g>
    <g class="continuation">
      <circle cx="344" cy="292" r="1.5"/><circle cx="354" cy="292" r="1.5"/><circle cx="364" cy="292" r="1.5"/>
      <circle cx="668" cy="292" r="1.5"/><circle cx="678" cy="292" r="1.5"/><circle cx="688" cy="292" r="1.5"/>
    </g>
    <g class="position-label">
      <text x="160" y="323">0</text><text x="202" y="323">1</text>
      <text x="244" y="323">2</text><text x="286" y="323">3</text>
      <text x="436" y="323">ω</text><text x="496" y="323">ω + 1</text>
      <text x="556" y="323">ω + 2</text><text x="616" y="323">ω + 3</text>
    </g>
    <text x="254" y="267" class="annotation">first infinite block</text>
    <text x="562" y="267" class="annotation">second infinite block</text>
  </g>
</svg>
