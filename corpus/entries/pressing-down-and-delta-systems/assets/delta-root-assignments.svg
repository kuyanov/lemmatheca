<svg xmlns="http://www.w3.org/2000/svg" width="760" height="555" viewBox="0 0 760 555" role="img" aria-labelledby="title desc">
<title id="title">A common root needs common values</title><desc id="desc">Three disjoint petals attach to the shared root x. Below, maps with the same root value have a function as their union; maps giving x zero and one cannot have a common extension.</desc>
<rect width="760" height="555" fill="#f3f4ef"/>
<defs>
<marker id="arrow" viewBox="-1 0 11 10" refX="8.7" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#356653" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="grey-arrow" viewBox="-1 0 11 10" refX="8.7" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#768278" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="warn-arrow" viewBox="-1 0 11 10" refX="8.7" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#8b6d48" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="380.0" y="34" font-family="Georgia, Times New Roman, serif" font-size="23" text-anchor="middle" fill="#29352e" font-weight="bold">First fix the root; then fix the values on the root</text>
<path d="M317.8263267229963 156.2956857412195L242.02289226497342 145.68320491709628" fill="none" stroke="#a7b5a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M442.1736732770037 156.2956857412195L517.9771077350266 145.68320491709628" fill="none" stroke="#a7b5a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M380.0 205.65L380.0 235.35000000000002" fill="none" stroke="#a7b5a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="180" cy="137" rx="63" ry="38" fill="#e8ece4" stroke="#a7b5a6" stroke-width="1.3"/>
<circle cx="168" cy="137" r="5" fill="#356653" stroke="#356653" stroke-width="1.6"/>
<text x="191" y="144" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">a</text>
<text x="180" y="84" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#29352e">D<tspan baseline-shift="sub" font-size="70%">0</tspan> = r ∪ {a}</text>
<ellipse cx="580" cy="137" rx="63" ry="38" fill="#e8ece4" stroke="#a7b5a6" stroke-width="1.3"/>
<circle cx="568" cy="137" r="5" fill="#356653" stroke="#356653" stroke-width="1.6"/>
<text x="591" y="144" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">b</text>
<text x="580" y="84" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#29352e">D<tspan baseline-shift="sub" font-size="70%">1</tspan> = r ∪ {b}</text>
<ellipse cx="380" cy="274" rx="63" ry="38" fill="#e8ece4" stroke="#a7b5a6" stroke-width="1.3"/>
<circle cx="368" cy="274" r="5" fill="#356653" stroke="#356653" stroke-width="1.6"/>
<text x="391" y="281" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">c</text>
<text x="470" y="281" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="start" fill="#29352e">D<tspan baseline-shift="sub" font-size="70%">2</tspan> = r ∪ {c}</text>
<ellipse cx="380" cy="165" rx="63" ry="40" fill="#dce9dc" stroke="#356653" stroke-width="1.3"/>
<text x="380" y="172" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#29352e">r = {x}</text>
<path d="M40 329L720 329" fill="none" stroke="#a7b5a6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="203" y="369" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#356653">Root values agree</text>
<text x="566" y="369" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#8b6d48">Root values conflict</text>
<text x="102" y="413" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#29352e">p<tspan baseline-shift="sub" font-size="70%">0</tspan>: x ↦ 0</text>
<text x="204" y="413" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#29352e">p<tspan baseline-shift="sub" font-size="70%">1</tspan>: x ↦ 0</text>
<text x="306" y="413" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#29352e">p<tspan baseline-shift="sub" font-size="70%">2</tspan>: x ↦ 0</text>
<path d="M110 432Q203 472 297 432" fill="none" stroke="#356653" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="203" y="483" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#29352e">p<tspan baseline-shift="sub" font-size="70%">0</tspan> ∪ p<tspan baseline-shift="sub" font-size="70%">1</tspan> is a function</text>
<text x="493" y="413" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">p<tspan baseline-shift="sub" font-size="70%">0</tspan>: x ↦ 0</text>
<text x="641" y="413" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">p<tspan baseline-shift="sub" font-size="70%">1</tspan>: x ↦ 1</text>
<path d="M514 435L619 465" fill="none" stroke="#8b6d48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M619 435L514 465" fill="none" stroke="#8b6d48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="566" y="496" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#8b6d48">No common extension</text>
<text x="380" y="535" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">Finite sample: the petals {a}, {b}, {c} are disjoint.</text>
</svg>
