<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">Two different infinite syntax-tree shapes</title><desc id="desc">An allowed countable conjunction has children with increasingly long finite quantifier chains. A forbidden infinite quantifier prefix instead has one infinitely descending chain.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" viewBox="0 0 8 8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 L2.5 4 Z" fill="#245b4b"/></marker></defs>
<rect width="760" height="500" fill="#f3f4ef"/>
<text x="258" y="31" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">allowed: one well-founded formula</text>
<circle cx="255" cy="80" r="25" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.3"/>
<text x="255" y="80" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#245b4b" dominant-baseline="central">∧</text>
<path d="M231.12462352169607 87.41393269589437 L65 139" fill="none" stroke="#8ea38a" stroke-width="1.5"/>
<text x="65" y="164" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#245b4b">A</text>
<path d="M234.8799272819018 94.83855362959744 L175 139" fill="none" stroke="#8ea38a" stroke-width="1.5"/>
<text x="175" y="164" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#303b34">∀x<tspan baseline-shift="sub" font-size="75%">0</tspan></text>
<path d="M175 174 L175 208" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="175" y="235" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#245b4b">A</text>
<path d="M266.3311669094085 102.28462825517009 L285 139" fill="none" stroke="#8ea38a" stroke-width="1.5"/>
<text x="285" y="164" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#303b34">∀x<tspan baseline-shift="sub" font-size="75%">0</tspan></text>
<path d="M285 174 L285 208" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="285" y="235" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#303b34">∀x<tspan baseline-shift="sub" font-size="75%">1</tspan></text>
<path d="M285 245 L285 279" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="285" y="306" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#245b4b">A</text>
<path d="M278.0377856866225 89.70878111079092 L395 139" fill="none" stroke="#8ea38a" stroke-width="1.5"/>
<text x="395" y="164" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#303b34">∀x<tspan baseline-shift="sub" font-size="75%">0</tspan></text>
<path d="M395 174 L395 208" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="395" y="235" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#303b34">∀x<tspan baseline-shift="sub" font-size="75%">1</tspan></text>
<path d="M395 245 L395 279" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="395" y="306" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#303b34">∀x<tspan baseline-shift="sub" font-size="75%">2</tspan></text>
<path d="M395 316 L395 350" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="395" y="377" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#245b4b">A</text>
<path d="M278.9841375392818 87.05415809978875 L459 140" fill="none" stroke="#8ea38a" stroke-width="1.5"/>
<text x="470" y="166" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="27" fill="#303b34">…</text>
<text x="254" y="428" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">every descending path is finite</text>
<path d="M517 43 L517 449" fill="none" stroke="#8ea38a" stroke-width="1.5"/>
<text x="638" y="31" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">not a formula</text>
<text x="641" y="91" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#303b34">∀x<tspan baseline-shift="sub" font-size="75%">0</tspan></text>
<path d="M641 107 L641 153" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="641" y="184" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#303b34">∀x<tspan baseline-shift="sub" font-size="75%">1</tspan></text>
<path d="M641 200 L641 246" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="641" y="277" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#303b34">∀x<tspan baseline-shift="sub" font-size="75%">2</tspan></text>
<path d="M641 293 L641 339" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="641" y="376" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="32" fill="#956b60">⋮</text>
<path d="M688 196 L712 220" fill="none" stroke="#956b60" stroke-width="2"/>
<path d="M688 220 L712 196" fill="none" stroke="#956b60" stroke-width="2"/>
<text x="638" y="427" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">one infinite branch</text>
<text x="380" y="477" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">The conjunction’s children share one fixed finite free-variable context.</text>
</svg>
