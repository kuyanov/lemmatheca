<text x="380" y="242" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#29352e">Starts: C<tspan baseline-shift="sub" font-size="70%">0</tspan> = {0, 1}.  The A-nodes reached form C.</text>
