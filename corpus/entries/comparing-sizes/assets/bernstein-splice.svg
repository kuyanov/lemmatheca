<svg xmlns="http://www.w3.org/2000/svg" width="760" height="535" viewBox="0 0 760 535" role="img" aria-labelledby="title desc">
<title id="title">Splicing the two injections</title><desc id="desc">Two alternating chains start at A zero and A one outside the image of g. Below them, h sends zero through five to one, two, zero, four, five, three, using f on C and inverse g on the remaining inputs.</desc>
<rect width="760" height="535" fill="#f3f4ef"/>
<defs>
<marker id="arrow" viewBox="-1 0 11 10" refX="8.7" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#356653" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="grey-arrow" viewBox="-1 0 11 10" refX="8.7" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#768278" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="warn-arrow" viewBox="-1 0 11 10" refX="8.7" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#8b6d48" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="380.0" y="34" font-family="Georgia, Times New Roman, serif" font-size="23" text-anchor="middle" fill="#29352e" font-weight="bold">First follow the chains; then splice the maps</text>
<text x="380" y="70" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">f(n) = n + 1,     g(n) = n + 2</text>
