<svg xmlns="http://www.w3.org/2000/svg" width="660" height="330" viewBox="0 0 660 330" role="img" aria-labelledby="title desc">
  <title id="title">Root gluing of two ordered models</title>
  <desc id="desc">Two shaded old upward cones have least worlds w zero and w one. A new root rho with empty atom valuation lies below both. Old branches remain disjoint.</desc>
  <g fill="#f1f5f2" stroke="#9cafa5" stroke-width="1.2">
    <rect x="60" y="20" width="220" height="210" rx="18"/>
    <rect x="380" y="20" width="220" height="210" rx="18"/>
  </g>
  <g stroke="#5f7b6d" stroke-width="1.6" fill="none">
    <path d="M 330 290 L 170 190"/>
    <path d="M 330 290 L 490 190"/>
  </g>
  <g fill="#315b47">
    <circle cx="170" cy="190" r="4.5"/>
    <circle cx="490" cy="190" r="4.5"/>
    <circle cx="330" cy="290" r="4.5"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#263b30">
    <text x="170" y="58" font-size="25">↑w₀</text>
    <text x="490" y="58" font-size="25">↑w₁</text>
    <text x="170" y="101" font-size="24">old future worlds</text>
    <text x="490" y="101" font-size="24">old future worlds</text>
    <text x="170" y="148" font-size="26">⋮</text>
    <text x="490" y="148" font-size="26">⋮</text>
    <text x="150" y="218" font-size="24">w₀</text>
    <text x="510" y="218" font-size="24">w₁</text>
    <text x="330" y="320" font-size="24">ρ : no atoms</text>
  </g>
</svg>
