<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc">
  <title id="title">A four-world countermodel</title>
  <desc id="desc">A root rho with no verified atoms lies below three incomparable leaves: u verifies only q, v verifies only r, and t verifies only p.</desc>
  <g stroke="#5f7b6d" stroke-width="1.6" fill="none">
    <path d="M 300 245 L 110 75"/>
    <path d="M 300 245 L 300 75"/>
    <path d="M 300 245 L 490 75"/>
  </g>
  <g fill="#315b47">
    <circle cx="110" cy="75" r="4.5"/>
    <circle cx="300" cy="75" r="4.5"/>
    <circle cx="490" cy="75" r="4.5"/>
    <circle cx="300" cy="245" r="4.5"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#263b30" font-size="25">
    <text x="110" y="45">u : q only</text>
    <text x="300" y="45">v : r only</text>
    <text x="490" y="45">t : p only</text>
    <text x="300" y="282">ρ : no atoms</text>
  </g>
</svg>
