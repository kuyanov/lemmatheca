<path d="M343 300 C430 289 475 189 571 178" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M343 305 C430 357 489 352 570 344" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="270" cy="335" r="5" fill="#245b4b" stroke="#245b4b" stroke-width="1.3"/>
<text x="251" y="342" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#303b34">b</text>
<path d="M309 309 C285 306 269 317 270 326" fill="none" stroke="#245b4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270" y="442" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">guarded outputs stay selected</text>
<text x="380" y="464" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#303b34">T → S → U</text>
<text x="380" y="498" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b">I(J(N)) ← J(N) ← N</text>
