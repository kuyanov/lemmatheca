<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc"><title id="title">The domain of a composite interpretation</title><desc id="desc">The composite domain is the subset of N satisfying both δJ and translated δI. The direct and nested subtype presentations carry the same underlying point a.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" viewBox="0 0 8 8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 L2.5 4 Z" fill="#245b4b"/></marker></defs>
