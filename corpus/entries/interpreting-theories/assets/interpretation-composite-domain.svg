<ellipse cx="288" cy="259" rx="174" ry="137" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.2"/>
<ellipse cx="316" cy="288" rx="105" ry="80" fill="#d8e6d7" stroke="#8ea38a" stroke-width="1.2"/>
<text x="111" y="105" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#303b34">N</text>
<text x="178" y="164" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#303b34">δJ</text>
<text x="316" y="245" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#245b4b">δJ ∧ (δI)<tspan baseline-shift="super" font-size="75%">J</tspan></text>
<circle cx="318" cy="303" r="6" fill="#245b4b" stroke="#245b4b" stroke-width="1.3"/>
<text x="339" y="310" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#245b4b">a</text>
<text x="607" y="131" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#73796f">direct carrier</text>
<circle cx="607" cy="177" r="24" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.3"/>
<text x="607" y="184" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b">a</text>
<text x="607" y="295" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#73796f">nested carriers</text>
<circle cx="607" cy="341" r="24" fill="#e5ede3" stroke="#8ea38a" stroke-width="1.3"/>
<text x="607" y="348" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b">a</text>
