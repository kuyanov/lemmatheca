<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Two-point blocks and two infinite blocks</title>
  <desc id="desc">Two times omega places infinitely many two-point blocks in sequence, giving the natural positions zero, one, two, and so on. Omega times two places a whole infinite block before a second infinite block, whose first point is omega. Dots indicate that the sequences continue beyond the positions drawn.</desc>
  <style>
    .order-label { fill: #252d29; font: 25px Georgia, "Times New Roman", serif; }
    .position-label { fill: #252d29; font: 18px Georgia, "Times New Roman", serif; text-anchor: middle; }
    .annotation { fill: #73796f; font: 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
    .order-line { fill: none; stroke: #a8b2a2; stroke-width: 1.5; stroke-linecap: round; }
    .block { fill: #eef2eb; stroke: #cbdccf; stroke-width: 1; }
    .point { fill: #245b4b; }
    .continuation { fill: #73796f; }
  </style>

  <path d="M28 181H692" stroke="#dedfd6" stroke-width="1"/>

  <g aria-label="Two times omega: infinitely many two-point blocks">
    <text x="28" y="111" class="order-label">2 · ω</text>
    <text x="406" y="53" class="annotation">infinitely many two-point blocks</text>
    <g class="block">
      <rect x="132" y="80" width="78" height="44" rx="4"/>
      <rect x="232" y="80" width="78" height="44" rx="4"/>
      <rect x="332" y="80" width="78" height="44" rx="4"/>
      <rect x="432" y="80" width="78" height="44" rx="4"/>
      <rect x="532" y="80" width="78" height="44" rx="4"/>
    </g>
    <path class="order-line" d="M142 102H630"/>
    <g class="point">
      <circle cx="150" cy="102" r="4"/><circle cx="192" cy="102" r="4"/>
      <circle cx="250" cy="102" r="4"/><circle cx="292" cy="102" r="4"/>
      <circle cx="350" cy="102" r="4"/><circle cx="392" cy="102" r="4"/>
      <circle cx="450" cy="102" r="4"/><circle cx="492" cy="102" r="4"/>
      <circle cx="550" cy="102" r="4"/><circle cx="592" cy="102" r="4"/>
    </g>
    <g class="continuation">
      <circle cx="650" cy="102" r="1.5"/><circle cx="660" cy="102" r="1.5"/><circle cx="670" cy="102" r="1.5"/>
    </g>
    <g class="position-label">
      <text x="150" y="149">0</text><text x="192" y="149">1</text>
      <text x="250" y="149">2</text><text x="292" y="149">3</text>
      <text x="350" y="149">4</text><text x="392" y="149">5</text>
      <text x="450" y="149">6</text><text x="492" y="149">7</text>
      <text x="550" y="149">8</text><text x="592" y="149">9</text>
    </g>
  </g>

  <g aria-label="Omega times two: two consecutive infinite blocks">
    <text x="28" y="285" class="order-label">ω · 2</text>
    <text x="413" y="219" class="annotation">two infinite blocks</text>
    <text x="254" y="251" class="annotation">first infinite block</text>
    <text x="562" y="251" class="annotation">second infinite block</text>
    <path class="order-line" d="M152 276H326 M428 276H650"/>
    <g class="point">
      <circle cx="160" cy="276" r="4"/><circle cx="202" cy="276" r="4"/>
      <circle cx="244" cy="276" r="4"/><circle cx="286" cy="276" r="4"/>
      <circle cx="436" cy="276" r="4"/><circle cx="496" cy="276" r="4"/>
      <circle cx="556" cy="276" r="4"/><circle cx="616" cy="276" r="4"/>
    </g>
    <g class="continuation">
      <circle cx="344" cy="276" r="1.5"/><circle cx="354" cy="276" r="1.5"/><circle cx="364" cy="276" r="1.5"/>
      <circle cx="668" cy="276" r="1.5"/><circle cx="678" cy="276" r="1.5"/><circle cx="688" cy="276" r="1.5"/>
    </g>
    <g class="position-label">
      <text x="160" y="307">0</text><text x="202" y="307">1</text>
      <text x="244" y="307">2</text><text x="286" y="307">3</text>
      <text x="436" y="307">ω</text><text x="496" y="307">ω + 1</text>
      <text x="556" y="307">ω + 2</text><text x="616" y="307">ω + 3</text>
    </g>
  </g>
</svg>
