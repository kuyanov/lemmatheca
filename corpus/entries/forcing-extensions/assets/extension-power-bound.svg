<svg xmlns="http://www.w3.org/2000/svg" width="760" height="485" viewBox="0 0 760 485" role="img" aria-labelledby="title desc">
<title id="title">Bounding extension subsets by evaluating ground-model names</title><desc id="desc">A ground-model set Q of attachment subsets maps by name evaluation onto B[G]. Its values include every extension subset of x, but may include other values. Separation selects exactly those values that are subsets of x.</desc>
<rect width="760" height="485" fill="#f3f4ef"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#356653" stroke-width="1.4"/></marker><marker id="grey-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#768278" stroke-width="1.4"/></marker></defs>
<text x="380.0" y="34" font-family="Georgia, Times New Roman, serif" font-size="23" text-anchor="middle" fill="#29352e" font-weight="bold">First bound possible values; then separate the subsets</text>
<text x="177" y="79" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#29352e">Names in M</text>
<text x="586" y="79" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#29352e">Values in M[G]</text>
<rect x="40" y="110" width="280" height="260" rx="8" fill="#e8ece4" stroke="#a7b5a6" stroke-width="1.2"/>
<rect x="443" y="110" width="280" height="260" rx="8" fill="#e8ece4" stroke="#a7b5a6" stroke-width="1.2"/>
<text x="180" y="143" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">Q = 𝒫ᴹ(dom(σ) × P)</text>
<text x="583" y="143" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#29352e">B[G]</text>
<rect x="473" y="168" width="220" height="107" rx="8" fill="#dce9dc" stroke="#356653" stroke-width="1.2"/>
<text x="583" y="195" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">y ⊆ x = σ[G]</text>
<circle cx="180" cy="228" r="5" fill="#356653" stroke="#356653" stroke-width="1.6"/>
<text x="161" y="222" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="end" fill="#29352e">τ</text>
<circle cx="581" cy="233" r="5" fill="#356653" stroke="#356653" stroke-width="1.6"/>
<text x="601" y="240" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="start" fill="#29352e">y</text>
<path d="M193 228C318 195 423 195 566 231" fill="none" stroke="#356653" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="380" y="188" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">τ[G] = y</text>
<circle cx="180" cy="324" r="5" fill="#768278" stroke="#768278" stroke-width="1.6"/>
<text x="159" y="332" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="end" fill="#29352e">η</text>
<circle cx="586" cy="325" r="5" fill="#768278" stroke="#768278" stroke-width="1.6"/>
<text x="606" y="332" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="start" fill="#29352e">η[G]</text>
<path d="M193 324C332 350 443 350 571 325" fill="none" stroke="#768278" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#grey-arrow)"/>
<text x="380" y="397" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#29352e">Possible extra values need not be subsets of x.</text>
<text x="380" y="423" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">B = Q × {1<tspan baseline-shift="sub" font-size="70%">P</tspan>}</text>
<text x="380" y="451" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">Select { y ∈ B[G] : y ⊆ x } by Separation in M[G].</text>
</svg>
