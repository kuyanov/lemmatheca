<svg xmlns="http://www.w3.org/2000/svg" width="650" height="230" viewBox="0 0 650 230" role="img" aria-labelledby="title desc">
<title id="title">A monotone atom-preserving map without back</title>
<desc id="desc">The singleton world star has no atoms and maps to zero, the lower world of a chain. The upper world one verifies p and cannot be lifted to the singleton.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4e8174"/></marker></defs>
<path d="M470 160 L470 55" fill="none" stroke="#59645f" stroke-width="1.5"/>
<path d="M100 160 L470 160" fill="none" stroke="#4e8174" stroke-width="1.5" marker-end="url(#arrow)"/>
<g fill="#263a32"><circle cx="100" cy="160" r="4"/><circle cx="470" cy="160" r="4"/><circle cx="470" cy="55" r="4"/></g>
<g font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#263a32" text-anchor="middle"><text x="100" y="24">S</text><text x="470" y="24">N</text><text x="100" y="194">*: ∅</text><text x="285" y="144" fill="#4e8174">f</text></g>
<g font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#263a32"><text x="490" y="61">1: {p}</text><text x="490" y="166">0: ∅</text></g>
</svg>
