<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300" role="img" aria-labelledby="title desc">
<title id="title">A bounded morphism collapses the two equally valued leaves of a fork</title>
<desc id="desc">The source fork has root r and leaves u and v, both verifying p. A green function sends r to zero of a two-world chain and sends both u and v to one, where p holds.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4e8174"/></marker></defs>
<g fill="none" stroke="#59645f" stroke-width="1.5"><path d="M150 240 L90 90 M150 240 L210 90 M565 240 L565 90"/></g>
<g fill="none" stroke="#4e8174" stroke-width="1.5" marker-end="url(#arrow)"><path d="M90 90 C130 20 470 20 565 90"/><path d="M210 90 L565 90"/><path d="M150 240 L565 240"/></g>
<g fill="#263a32"><circle cx="150" cy="240" r="4"/><circle cx="90" cy="90" r="4"/><circle cx="210" cy="90" r="4"/><circle cx="565" cy="90" r="4"/><circle cx="565" cy="240" r="4"/></g>
<g font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#263a32" text-anchor="middle"><text x="150" y="21">M</text><text x="565" y="21">N</text><text x="90" y="65">{p}</text><text x="210" y="65">{p}</text><text x="90" y="117">u</text><text x="210" y="117">v</text><text x="150" y="271">r: ∅</text><text x="360" y="158" fill="#4e8174">f</text></g>
<g font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#263a32"><text x="585" y="96">1: {p}</text><text x="585" y="246">0: ∅</text></g>
</svg>
