<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
<title id="title">Substitute queries, then freeze the original diagonal input</title>
<desc id="desc">Ordinary code maps send e to tau(d,e), then to theta(d,e)=f(tau(d,e),e). If d decides A with oracle B, running e with A on e, tau(d,e) with B on e, and theta(d,e) with B on theta(d,e) gives the same partial output.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="-1 -1 11 11" refX="8.7" refY="3" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L8 3 L0 6 Z" fill="#245b4b" stroke="#245b4b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="350" fill="#f3f4ef"/>
<text id="top-heading" x="380" y="33" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#252d29">Ordinary maps on program codes</text>
<rect x="28" y="72" width="196" height="72" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<rect x="282" y="72" width="196" height="72" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<rect x="536" y="72" width="196" height="72" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<path d="M224.6 103 L281.4 103" fill="none" stroke="#245b4b" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M478.6 103 L535.4 103" fill="none" stroke="#245b4b" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<text id="substitute-label" x="253" y="87" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#245b4b">subst</text>
<text id="freeze-label" x="507" y="87" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#245b4b">freeze</text>
<text id="index-0" x="126.0" y="103" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b" font-style="italic">e</text>
<text id="index-note-0" x="126.0" y="128" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#73796f">original index</text>
<text id="index-1" x="380.0" y="103" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b" font-style="italic">τ(d,e)</text>
<text id="index-note-1" x="380.0" y="128" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#73796f">substituted index</text>
<text id="index-2" x="634.0" y="103" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#245b4b" font-style="italic">θ(d,e)</text>
<text id="index-note-2" x="634.0" y="128" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#73796f">= f(τ(d,e),e)</text>
<text id="hypothesis" x="380" y="184" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#252d29">Assume d decides A using oracle B.</text>
<rect x="28" y="214" width="196" height="92" rx="5" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
<rect x="282" y="214" width="196" height="92" rx="5" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
<rect x="536" y="214" width="196" height="92" rx="5" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
<path d="M224.6 260 L281.4 260" fill="none" stroke="#245b4b" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M478.6 260 L535.4 260" fill="none" stroke="#245b4b" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text id="oracle-0" x="126.0" y="239" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="17" fill="#73796f">oracle A</text>
<text id="run-0" x="126.0" y="264" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#252d29">run e</text>
<text id="input-0" x="126.0" y="289" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#252d29">on input e</text>
<text id="oracle-1" x="380.0" y="239" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="17" fill="#73796f">oracle B</text>
<text id="run-1" x="380.0" y="264" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#252d29">run τ(d,e)</text>
<text id="input-1" x="380.0" y="289" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#252d29">on input e</text>
<text id="oracle-2" x="634.0" y="239" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="17" fill="#73796f">oracle B</text>
<text id="run-2" x="634.0" y="264" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#252d29">run θ(d,e)</text>
<text id="input-2" x="634.0" y="289" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#252d29">on input θ(d,e)</text>
<text id="footer" x="380" y="338" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#73796f">The last program runs on its new index but has stored the old input e.</text>
</svg>
