<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
<title id="title">Coding an old real in a fresh countable block</title>
<desc id="desc">The new condition retains the old prefix p, fills a gap with zeroes, then assigns the successive bits of a real r in a fresh omega block.</desc>
<g font-family="Georgia, Times New Roman, serif" fill="#293b33" text-anchor="middle">
<text x="360" y="30" font-size="24">An extension q keeps p and codes the whole real r</text>
<rect x="40" y="79" width="150" height="57" fill="#e6f0e9" stroke="#6b8b7d" stroke-width="1.3"/>
<rect x="190" y="79" width="150" height="57" fill="#f6f7f3" stroke="#6b8b7d" stroke-width="1.3"/>
<rect x="340" y="79" width="300" height="57" fill="#e6f0e9" stroke="#6b8b7d" stroke-width="1.3"/>
<path d="M 415 79 V 136 M 490 79 V 136 M 565 79 V 136" stroke="#9bb2a7" stroke-width="1"/>
<text x="115" y="113" font-size="28" font-style="italic">p</text>
<text x="265" y="113" font-size="26">fill with 0</text>
<text x="377.5" y="113" font-size="26">r(0)</text>
<text x="452.5" y="113" font-size="26">r(1)</text>
<text x="527.5" y="113" font-size="26">r(2)</text>
<text x="602.5" y="113" font-size="28">…</text>
<path d="M 40 143 V 153 M 190 143 V 153 M 340 143 V 153 M 640 143 V 153" stroke="#6b8b7d" stroke-width="1.2"/>
<text x="40" y="184" font-size="26">0</text>
<text x="190" y="184" font-size="26">γ</text>
<text x="340" y="184" font-size="26">ω·α</text>
<text x="640" y="184" font-size="26">ω·(α+1)</text>
<text x="490" y="240" font-size="24">one countable block</text>
</g>
</svg>
