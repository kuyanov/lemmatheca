<svg xmlns="http://www.w3.org/2000/svg" width="760" height="750" viewBox="0 0 760 750" role="img" aria-labelledby="title desc">
<title id="title">Dependencies in the bounded evaluator</title><desc id="desc">A recursion call obtains an earlier value from the same program with a smaller allowance and then calls the proper step subprogram at the original allowance. A search call first tests its proper subprogram at the original allowance and continues the search at a smaller allowance only after a positive test value. Every call repeats its input guard.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245b4b"/></marker></defs>
<rect width="760" height="750" fill="#f3f4ef"/>
<text x="28" y="36" font-family="Georgia, Times New Roman, serif" font-size="23" text-anchor="start" fill="#252d29">Every dependency decreases allowance or program size</text>
<text x="28" y="75" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="start" fill="#73796f" font-weight="600">RECURSION</text>
<rect x="93" y="94" width="574" height="68" rx="5" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="380.0" y="134.0" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#252d29">B<tspan baseline-shift="sub" font-size="70%">k+1</tspan>(rec(c,d), ⟨a,n+1⟩)</text>
<path d="M237 162L193 233" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="54" y="202" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="start" fill="#73796f">smaller allowance</text>
<path d="M522 162L563 233" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="511" y="202" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="start" fill="#73796f">proper subprogram</text>
<rect x="28" y="242" width="335" height="84" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="195.5" y="277.0" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">B<tspan baseline-shift="sub" font-size="70%">k</tspan>(rec(c,d), ⟨a,n⟩)</text>
<text x="195.5" y="303.0" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">if it returns v</text>
<rect x="397" y="242" width="335" height="84" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="564.5" y="277.0" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">B<tspan baseline-shift="sub" font-size="70%">k+1</tspan>(d, ⟨a,⟨n,v⟩⟩)</text>
<text x="564.5" y="303.0" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">uses the original allowance</text>
<path d="M363 283L397 283" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="380" y="271" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#252d29">v</text>
<path d="M28 365L732 365" fill="none" stroke="#bbc7b9" stroke-width="1"/>
<text x="28" y="403" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="start" fill="#73796f" font-weight="600">SEARCH</text>
<rect x="28" y="434" width="310" height="80" rx="5" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="183.0" y="480.0" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">B<tspan baseline-shift="sub" font-size="70%">k+1</tspan>(find(c), ⟨a,m⟩)</text>
<path d="M338 474L401 474" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="411" y="434" width="321" height="80" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="571.5" y="467.0" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">B<tspan baseline-shift="sub" font-size="70%">k+1</tspan>(c, ⟨a,m⟩)</text>
<text x="571.5" y="493.0" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">test a proper subprogram</text>
<path d="M496 514L198 576" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="266" y="551" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="middle" fill="#73796f">test value = 0</text>
<path d="M615 514L615 576" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="636" y="551" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="start" fill="#73796f">&gt; 0</text>
<rect x="28" y="586" width="310" height="68" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="183.0" y="626.0" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">return m</text>
<rect x="393" y="586" width="339" height="68" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="562.5" y="626.0" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">B<tspan baseline-shift="sub" font-size="70%">k</tspan>(find(c), ⟨a,m+1⟩)</text>
<text x="380" y="692" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="middle" fill="#73796f">An insufficient test returns none; it does not continue the search.</text>
<text x="380" y="724" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="middle" fill="#73796f">Every call applies its own input guard. Allowance is not an output bound.</text>
</svg>
