<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">A map with a repeated output and a missed output</title>
  <desc id="desc">The domain A contains 0, 1, and 2. The codomain B contains p, q, and r. Arrows send 0 to p, 1 to q, and 2 to q. No arrow ends at r.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#2d6053" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="720" height="300" fill="#f3f4ef"/>
  <g font-family="Georgia, serif" font-size="23" text-anchor="middle" fill="#263c33">
    <text x="210" y="35">A</text><text x="510" y="35">B</text>
    <text x="360" y="49" font-style="italic">f</text>
  </g>
  <g fill="#fafbf7" stroke="#b9c8ba" stroke-width="1.5"><rect x="132" y="57" width="156" height="204" rx="60"/><rect x="432" y="57" width="156" height="204" rx="60"/></g>
  <g fill="none" stroke="#2d6053" stroke-width="2" marker-end="url(#arrow)">
    <path d="M228 101 L487 101"/><path d="M228 158 L487 158"/><path d="M228 215 C326 215 385 158 487 158"/>
  </g>
  <g font-family="Georgia, serif" font-size="23" text-anchor="middle" fill="#263c33">
    <text x="210" y="108">0</text><text x="210" y="165">1</text><text x="210" y="222">2</text>
    <text x="510" y="108">p</text><text x="510" y="165">q</text><text x="510" y="222">r</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#617063"><text x="210" y="286">domain</text><text x="510" y="286">codomain</text></g>
</svg>
