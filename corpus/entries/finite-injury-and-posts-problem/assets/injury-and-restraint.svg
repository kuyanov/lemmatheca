<svg xmlns="http://www.w3.org/2000/svg" width="460" height="535" viewBox="150 0 460 535" role="img" aria-labelledby="title desc">
  <title id="title">A higher-priority action can injure a temporary restraint</title>
  <desc id="desc">A conditional three-stage pattern: a lower requirement acts and restrains its oracle; a higher requirement changes a queried bit; the lower requirement's strategy data is reset while target membership remains permanent.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#547264" stroke-width="1.5" stroke-linejoin="round"/></marker></defs>
  <style>text{font-family:Georgia,'Times New Roman',serif;font-size:19px;fill:#26352d}.small{font-size:17px}.edge-label{font-size:17px;font-style:italic}.box{fill:#f3f7f3;stroke:#698373;stroke-width:1.4}.edge{fill:none;stroke:#547264;stroke-width:1.5;marker-end:url(#arrow)}</style>
  <text x="380" y="28" text-anchor="middle">Priority can injure a temporary commitment</text>
  <rect class="box" x="190" y="65" width="380" height="110" rx="7"/>
  <text x="380" y="94" text-anchor="middle">Lower requirement i acts</text>
  <text class="small" x="380" y="122" text-anchor="middle">Observed output 0; target witness enters</text>
  <text class="small" x="380" y="151" text-anchor="middle">Oracle queries are protected below r</text>
  <path class="edge" d="M380 175 V235"/>
  <text class="edge-label" x="405" y="211">Higher j &lt; i acts</text>
  <rect class="box" x="190" y="235" width="380" height="100" rx="7"/>
  <text x="380" y="263" text-anchor="middle">A queried bit q &lt; r enters the oracle</text>
  <text class="small" x="380" y="291" text-anchor="middle">The old output may change</text>
  <text class="small" x="380" y="319" text-anchor="middle">The target witness stays enumerated</text>
  <path class="edge" d="M380 335 V395"/>
  <text class="edge-label" x="405" y="371">Reset lower priority i</text>
  <rect class="box" x="190" y="395" width="380" height="110" rx="7"/>
  <text x="380" y="425" text-anchor="middle">Discard the temporary strategy data</text>
  <text class="small" x="380" y="453" text-anchor="middle">Acted flag 0; restraint 0</text>
  <text class="small" x="380" y="482" text-anchor="middle">Await another eligible private witness</text>
</svg>
