<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">A three-point Mostowski collapse</title>
  <desc id="desc">The chain of two relation links from p to q to r is represented by membership from the empty set to its singleton to that singleton's singleton. Horizontal arrows show the collapse map.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#245b4b" stroke-width="1.2"/></marker></defs>
  <rect width="760" height="340" fill="#f3f4ef"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#73796f" text-anchor="middle"><text x="185" y="37">Relation on A</text><text x="565" y="37">Membership on M</text></g>
  <g fill="#e5ede3" stroke="#8ea38a" stroke-width="1.2"><rect x="135" y="58" width="100" height="40" rx="5"/><rect x="135" y="143" width="100" height="40" rx="5"/><rect x="135" y="228" width="100" height="40" rx="5"/><rect x="490" y="58" width="150" height="40" rx="5"/><rect x="490" y="143" width="150" height="40" rx="5"/><rect x="490" y="228" width="150" height="40" rx="5"/></g>
  <g fill="none" stroke="#245b4b" stroke-width="1.4" marker-end="url(#arrow)"><path d="M185 139 V103"/><path d="M185 224 V188"/><path d="M565 139 V103"/><path d="M565 224 V188"/><path d="M250 78 H475"/><path d="M250 163 H475"/><path d="M250 248 H475"/></g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#245b4b" text-anchor="middle"><text x="185" y="85" font-style="italic">r</text><text x="185" y="170" font-style="italic">q</text><text x="185" y="255" font-style="italic">p</text><text x="565" y="85">{{0}}</text><text x="565" y="170">{0}</text><text x="565" y="255">0 = ∅</text><text x="360" y="64" font-style="italic">π</text><text x="360" y="149" font-style="italic">π</text><text x="360" y="234" font-style="italic">π</text></g>
  <text x="380" y="314" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#73796f">Vertical arrows are precisely the two links preserved by π.</text>
</svg>
