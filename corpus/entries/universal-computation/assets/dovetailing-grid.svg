<title id="title">Dovetailing by finite stages</title><desc id="desc">Rows are the indexed programs and columns are resource allowances. At stage k the first k plus one programs receive allowance k. The highlighted column at stage three contains rows zero through three. A success at row two, allowance three remains available in all later stages.</desc>
