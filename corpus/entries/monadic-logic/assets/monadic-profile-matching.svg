<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img" aria-labelledby="title desc"><title id="title">Matching profile capacities</title><desc id="desc">For r=3, corresponding profile cells retain all points in a small class and three representatives in a large class. Used points are paired; a fresh point is matched to an unused point of the same profile.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" viewBox="0 0 8 8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 L2.5 4 Z" fill="#245b4b"/></marker></defs>
<rect width="760" height="480" fill="#f3f4ef"/>
<text x="380" y="32" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">two unary predicates; capacity r = 3</text>
<text x="145" y="69" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">(0,0)</text>
<text x="315" y="69" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">(0,1)</text>
<text x="485" y="69" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">(1,0)</text>
<text x="655" y="69" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">(1,1)</text>
<text x="32" y="151" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#245b4b">M</text>
<rect x="80" y="90" width="140" height="113" rx="6" fill="none" stroke="#8ea38a" stroke-width="1.2"/>
<rect x="250" y="90" width="140" height="113" rx="6" fill="none" stroke="#8ea38a" stroke-width="1.2"/>
<rect x="420" y="90" width="140" height="113" rx="6" fill="none" stroke="#8ea38a" stroke-width="1.2"/>
<rect x="590" y="90" width="140" height="113" rx="6" fill="none" stroke="#8ea38a" stroke-width="1.2"/>
<circle cx="105" cy="132" r="7" fill="#245b4b" stroke="#245b4b" stroke-width="1.3"/>
<circle cx="173" cy="132" r="7" fill="#f3f4ef" stroke="#245b4b" stroke-width="1.3"/>
<text x="116" y="179" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">a<tspan baseline-shift="sub" font-size="75%">0</tspan> = a<tspan baseline-shift="sub" font-size="75%">1</tspan></text>
<text x="181" y="158" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">fresh</text>
<circle cx="271" cy="132" r="6" fill="#f3f4ef" stroke="#8ea38a" stroke-width="1.3"/>
<circle cx="302" cy="132" r="6" fill="#f3f4ef" stroke="#8ea38a" stroke-width="1.3"/>
<circle cx="333" cy="132" r="6" fill="#f3f4ef" stroke="#8ea38a" stroke-width="1.3"/>
<circle cx="364" cy="132" r="6" fill="#f3f4ef" stroke="#8ea38a" stroke-width="1.3"/>
<text x="320" y="174" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">≥ 3 points</text>
<text x="490" y="155" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">empty</text>
<circle cx="660" cy="133" r="6" fill="#f3f4ef" stroke="#8ea38a" stroke-width="1.3"/>
<text x="32" y="346" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" fill="#245b4b">N</text>
<rect x="80" y="285" width="140" height="113" rx="6" fill="none" stroke="#8ea38a" stroke-width="1.2"/>
<rect x="250" y="285" width="140" height="113" rx="6" fill="none" stroke="#8ea38a" stroke-width="1.2"/>
<rect x="420" y="285" width="140" height="113" rx="6" fill="none" stroke="#8ea38a" stroke-width="1.2"/>
<rect x="590" y="285" width="140" height="113" rx="6" fill="none" stroke="#8ea38a" stroke-width="1.2"/>
<circle cx="105" cy="327" r="7" fill="#245b4b" stroke="#245b4b" stroke-width="1.3"/>
<circle cx="173" cy="327" r="7" fill="#f3f4ef" stroke="#245b4b" stroke-width="1.3"/>
<text x="116" y="374" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">b<tspan baseline-shift="sub" font-size="75%">0</tspan> = b<tspan baseline-shift="sub" font-size="75%">1</tspan></text>
<text x="181" y="353" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">fresh</text>
<circle cx="279" cy="327" r="6" fill="#f3f4ef" stroke="#8ea38a" stroke-width="1.3"/>
<circle cx="317" cy="327" r="6" fill="#f3f4ef" stroke="#8ea38a" stroke-width="1.3"/>
<circle cx="355" cy="327" r="6" fill="#f3f4ef" stroke="#8ea38a" stroke-width="1.3"/>
<text x="320" y="369" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">keep 3</text>
<text x="490" y="350" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">empty</text>
<circle cx="660" cy="328" r="6" fill="#f3f4ef" stroke="#8ea38a" stroke-width="1.3"/>
<path d="M98 132 H65 V327 H98" fill="none" stroke="#8ea38a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M180 132 H210 V327 H180" fill="none" stroke="#245b4b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="223" y="248" text-anchor="start" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#245b4b">fresh x ↦ unused y</text>
<text x="580" y="241" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">small cells: all points</text>
<text x="580" y="265" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">large cells: enough unused points</text>
<text x="380" y="445" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#73796f">Labels 0 and 1 reuse one point: repeated coordinates consume no extra capacity.</text>
</svg>
