<svg xmlns="http://www.w3.org/2000/svg" width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="title desc">
<title id="title">Removing one complement marker</title>
<desc id="desc">The value two is removed from the sorted missing numbers. Zero retains rank zero; three, five, and six shift down one rank.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" viewBox="0 0 8 8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#557668"/></marker></defs>
<rect width="420" height="340" fill="#fbfcfa"/>
<g font-family="Georgia, Times New Roman, serif" fill="#273e34" text-anchor="middle">
<text x="210" y="25" font-size="18">Remove the current rank-one marker</text>
<text x="210" y="50" font-size="17">B = {1, 4}</text>
<path d="M64.0000 128.0000 L64.0000 236.0000" fill="none" stroke="#557668" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M200.6824 126.2286 L143.3176 237.7714" fill="none" stroke="#557668" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M272.6824 126.2286 L215.3176 237.7714" fill="none" stroke="#557668" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M344.6824 126.2286 L287.3176 237.7714" fill="none" stroke="#557668" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="64" y="79" font-size="17">m<tspan font-size="11" dy="4">0</tspan><tspan dy="-4"> </tspan></text>
<circle cx="64" cy="112" r="16" fill="#f0f4ef" stroke="#789589" stroke-width="1.2"/>
<text x="64" y="118" font-size="18">0</text>
<text x="136" y="79" font-size="17">m<tspan font-size="11" dy="4">1</tspan><tspan dy="-4"> </tspan></text>
<circle cx="136" cy="112" r="16" fill="#e0ebe3" stroke="#789589" stroke-width="1.2"/>
<text x="136" y="118" font-size="18">2</text>
<path d="M123 129 L149 129" stroke="#557668" stroke-width="1.5"/><text x="136" y="158" font-size="15">2 added</text>
<text x="208" y="79" font-size="17">m<tspan font-size="11" dy="4">2</tspan><tspan dy="-4"> </tspan></text>
<circle cx="208" cy="112" r="16" fill="#f0f4ef" stroke="#789589" stroke-width="1.2"/>
<text x="208" y="118" font-size="18">3</text>
<text x="280" y="79" font-size="17">m<tspan font-size="11" dy="4">3</tspan><tspan dy="-4"> </tspan></text>
<circle cx="280" cy="112" r="16" fill="#f0f4ef" stroke="#789589" stroke-width="1.2"/>
<text x="280" y="118" font-size="18">5</text>
<text x="352" y="79" font-size="17">m<tspan font-size="11" dy="4">4</tspan><tspan dy="-4"> </tspan></text>
<circle cx="352" cy="112" r="16" fill="#f0f4ef" stroke="#789589" stroke-width="1.2"/>
<text x="352" y="118" font-size="18">6</text>
<text x="400" y="118" font-size="20">…</text>
<circle cx="64" cy="252" r="16" fill="#f0f4ef" stroke="#789589" stroke-width="1.2"/>
<text x="64" y="258" font-size="18">0</text>
<text x="64" y="285" font-size="17">m<tspan font-size="11" dy="4">0</tspan><tspan dy="-4"> </tspan></text>
<circle cx="136" cy="252" r="16" fill="#f0f4ef" stroke="#789589" stroke-width="1.2"/>
<text x="136" y="258" font-size="18">3</text>
<text x="136" y="285" font-size="17">m<tspan font-size="11" dy="4">1</tspan><tspan dy="-4"> </tspan></text>
<circle cx="208" cy="252" r="16" fill="#f0f4ef" stroke="#789589" stroke-width="1.2"/>
<text x="208" y="258" font-size="18">5</text>
<text x="208" y="285" font-size="17">m<tspan font-size="11" dy="4">2</tspan><tspan dy="-4"> </tspan></text>
<circle cx="280" cy="252" r="16" fill="#f0f4ef" stroke="#789589" stroke-width="1.2"/>
<text x="280" y="258" font-size="18">6</text>
<text x="280" y="285" font-size="17">m<tspan font-size="11" dy="4">3</tspan><tspan dy="-4"> </tspan></text>
<circle cx="352" cy="252" r="16" fill="#f0f4ef" stroke="#789589" stroke-width="1.2"/>
<text x="352" y="258" font-size="18">7</text>
<text x="352" y="285" font-size="17">m<tspan font-size="11" dy="4">4</tspan><tspan dy="-4"> </tspan></text>
<text x="400" y="258" font-size="20">…</text>
<text x="210" y="316" font-size="17">B′ = {1, 2, 4}</text>
</g></svg>
