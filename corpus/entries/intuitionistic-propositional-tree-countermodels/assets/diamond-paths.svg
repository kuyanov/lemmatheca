<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
  <title id="title">A diamond and its strict rooted paths</title>
  <desc id="desc">The diamond has root r, incomparable middle worlds u and v, and top t. Its prefix tree has six paths. The direct path r t forms its own branch, alongside the branches through u and v.</desc>
  <rect width="760" height="350" fill="#fafaf7"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#293e35" text-anchor="middle">
    <text x="150" y="30" font-size="20">Original diamond</text>
    <text x="560" y="30" font-size="20">Strict-path tree</text>
  </g>
  <path d="M340 48V338" stroke="#d7e0d9" stroke-width="1"/>
  <g stroke="#657d6b" stroke-width="1.7" fill="none" stroke-linecap="round">
    <path d="M150 310L90 200L150 95L210 200L150 310"/>
    <path d="M560 310L420 200L420 95M560 310L560 200M560 310L700 200L700 95"/>
  </g>
  <g fill="#3f7054">
    <circle cx="150" cy="310" r="4"/><circle cx="90" cy="200" r="4"/><circle cx="210" cy="200" r="4"/><circle cx="150" cy="95" r="4"/>
    <circle cx="560" cy="310" r="4"/><circle cx="420" cy="200" r="4"/><circle cx="560" cy="200" r="4"/><circle cx="700" cy="200" r="4"/><circle cx="420" cy="95" r="4"/><circle cx="700" cy="95" r="4"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#293e35">
    <text x="150" y="334" text-anchor="middle">r</text><text x="77" y="206" text-anchor="end">u</text><text x="223" y="206">v</text><text x="150" y="74" text-anchor="middle">t</text>
    <text x="560" y="334" text-anchor="middle">[r]</text><text x="407" y="206" text-anchor="end">[r,u]</text><text x="560" y="179" text-anchor="middle">[r,t]</text><text x="713" y="206">[r,v]</text><text x="420" y="74" text-anchor="middle">[r,u,t]</text><text x="700" y="74" text-anchor="middle">[r,v,t]</text>
  </g>
</svg>
