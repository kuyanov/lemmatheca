<text x="380" y="151" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">g(n) = m<tspan baseline-shift="sub" font-size="70%">j</tspan></text>
<text x="380" y="494" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#29352e">n<tspan baseline-shift="sub" font-size="70%">j-1</tspan> &lt; n ≤ n<tspan baseline-shift="sub" font-size="70%">j</tspan>:    f(n) ≤ f̂(n) ≤ f̂(n<tspan baseline-shift="sub" font-size="70%">j</tspan>) ≤ m<tspan baseline-shift="sub" font-size="70%">j</tspan></text>
