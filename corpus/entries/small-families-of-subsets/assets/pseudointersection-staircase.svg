<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title desc">
<title id="title">Reading a bound from sparse points to the right</title><desc id="desc">A nondecreasing graph is shaded above. Selected grid points above it define horizontal staircase pieces extending left from each point to the preceding selected column. An early point below the graph is marked as a possible exception.</desc>
