<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
<title id="title">Implication components in a satisfiable 2-CNF</title>
<desc id="desc">A directed diamond from N through A and B to T.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0.7 L 8 4 L 0 7.3 Z" fill="#4d7163"/></marker></defs>
<g fill="none" stroke="#4d7163" stroke-width="1.5" marker-end="url(#arrow)">
<path d="M 124.228 130.214 L 225.772 84.786"/>
<path d="M 124.228 169.786 L 225.772 215.214"/>
<path d="M 314.228 84.786 L 415.772 130.214"/>
<path d="M 314.228 215.214 L 415.772 169.786"/>
</g>
<ellipse cx="80" cy="150" rx="65" ry="27" fill="#f0f5f2" stroke="#6b8b7d" stroke-width="1.2"/>
<text x="80" y="150" text-anchor="middle" dominant-baseline="central" font-family="Georgia, Times New Roman, serif" font-size="17" fill="#293b33">N = {¬q, ¬r}</text>
<ellipse cx="270" cy="65" rx="65" ry="27" fill="#f0f5f2" stroke="#6b8b7d" stroke-width="1.2"/>
<text x="270" y="65" text-anchor="middle" dominant-baseline="central" font-family="Georgia, Times New Roman, serif" font-size="17" fill="#293b33">A = {p}</text>
<ellipse cx="270" cy="235" rx="65" ry="27" fill="#f0f5f2" stroke="#6b8b7d" stroke-width="1.2"/>
<text x="270" y="235" text-anchor="middle" dominant-baseline="central" font-family="Georgia, Times New Roman, serif" font-size="17" fill="#293b33">B = {¬p}</text>
<ellipse cx="460" cy="150" rx="65" ry="27" fill="#f0f5f2" stroke="#6b8b7d" stroke-width="1.2"/>
<text x="460" y="150" text-anchor="middle" dominant-baseline="central" font-family="Georgia, Times New Roman, serif" font-size="17" fill="#293b33">T = {q, r}</text>
</svg>
