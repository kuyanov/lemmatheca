<svg xmlns="http://www.w3.org/2000/svg" width="420" height="280" viewBox="0 0 420 280" role="img" aria-labelledby="title desc">
  <title id="title">A current omission need not persist</title>
  <desc id="desc">The finite streams D and E eventually both contain zero, whereas F remains empty. At stage two E and F are both empty; their later behavior differs.</desc>
  <rect width="420" height="280" fill="#fafbf8"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#283c32">
    <text x="210" y="28" font-size="18">One stage leaves the future open</text>
  </g>
  <rect x="20" y="48" width="380" height="142" rx="5" fill="#f0f4ee" stroke="#789084" stroke-width="1.2"/>
  <g stroke="#becbbf" stroke-width="1">
    <path d="M20 89 H400 M20 139 H400"/>
    <path d="M110 48 V190 M210 48 V190 M310 48 V190"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#283c32" font-size="18">
    <text x="65" y="75">stage</text><text x="160" y="75">D<tspan baseline-shift="sub" font-size="13">s</tspan></text><text x="260" y="75">E<tspan baseline-shift="sub" font-size="13">s</tspan></text><text x="355" y="75">F<tspan baseline-shift="sub" font-size="13">s</tspan></text>
    <text x="65" y="121">2</text><text x="160" y="121">{0}</text><text x="260" y="121">∅</text><text x="355" y="121">∅</text>
    <text x="65" y="171">4</text><text x="160" y="171">{0}</text><text x="260" y="171">{0}</text><text x="355" y="171">∅</text>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#345f49" font-size="16">
    <text x="210" y="226">E eventually answers the obligation.</text>
    <text x="210" y="253">F never answers it.</text>
  </g>
</svg>
