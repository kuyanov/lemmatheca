<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
<title id="title">Closing witness requirements at a limit</title><desc id="desc">Nested domains show a finite tuple inside M alpha n, its existential witness in M alpha n plus one, and both inside the union level M lambda. The iteration is for one fixed finite formula family.</desc>
<rect width="760" height="470" fill="#f3f4ef"/>
<defs>
<marker id="arrow" viewBox="-1 0 11 10" refX="8.7" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#356653" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="grey-arrow" viewBox="-1 0 11 10" refX="8.7" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#768278" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="warn-arrow" viewBox="-1 0 11 10" refX="8.7" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#8b6d48" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="380.0" y="34" font-family="Georgia, Times New Roman, serif" font-size="23" text-anchor="middle" fill="#29352e" font-weight="bold">A tuple fits at one stage; its witness fits at the next</text>
<rect x="42" y="75" width="676" height="304" rx="8" fill="none" stroke="#356653" stroke-width="1.2"/>
<text x="666" y="105" font-family="Georgia, Times New Roman, serif" font-size="23" text-anchor="middle" fill="#29352e">M<tspan baseline-shift="sub" font-size="70%">λ</tspan></text>
<rect x="85" y="135" width="570" height="210" rx="8" fill="#e8ece4" stroke="#a7b5a6" stroke-width="1.2"/>
<text x="568" y="165" font-family="Georgia, Times New Roman, serif" font-size="24" text-anchor="middle" fill="#29352e">M<tspan baseline-shift="sub" font-size="70%">α<tspan baseline-shift="sub" font-size="70%">n+1</tspan></tspan></text>
<rect x="117" y="220" width="310" height="110" rx="8" fill="#dce9dc" stroke="#356653" stroke-width="1.2"/>
<text x="369" y="300" font-family="Georgia, Times New Roman, serif" font-size="24" text-anchor="middle" fill="#29352e">M<tspan baseline-shift="sub" font-size="70%">α<tspan baseline-shift="sub" font-size="70%">n</tspan></tspan></text>
<circle cx="173" cy="270" r="5" fill="#356653" stroke="#356653" stroke-width="1.6"/>
<text x="173" y="295" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">a<tspan baseline-shift="sub" font-size="70%">0</tspan></text>
<circle cx="240" cy="286" r="5" fill="#356653" stroke="#356653" stroke-width="1.6"/>
<text x="240" y="311" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">a<tspan baseline-shift="sub" font-size="70%">1</tspan></text>
<text x="304" y="259" font-family="Georgia, Times New Roman, serif" font-size="25" text-anchor="middle" fill="#29352e">⋯</text>
<circle cx="535" cy="220" r="5" fill="#356653" stroke="#356653" stroke-width="1.6"/>
<text x="553" y="218" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="start" fill="#29352e">b</text>
<path d="M245.8 286.0C355 286 415 180 529.497636871307 218.16587895710234" fill="none" stroke="#356653" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="373" y="194" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#29352e">witness bound h</text>
<text x="380" y="407" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">α<tspan baseline-shift="sub" font-size="70%">n+1</tspan> = h(α<tspan baseline-shift="sub" font-size="70%">n</tspan>),    λ = sup<tspan baseline-shift="sub" font-size="70%">n</tspan> α<tspan baseline-shift="sub" font-size="70%">n</tspan></text>
<text x="380" y="435" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">M<tspan baseline-shift="sub" font-size="70%">λ</tspan> = ⋃<tspan baseline-shift="sub" font-size="70%">n</tspan> M<tspan baseline-shift="sub" font-size="70%">α<tspan baseline-shift="sub" font-size="70%">n</tspan></tspan>    •    fixed finite family of formulas</text>
</svg>
