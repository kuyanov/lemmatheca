<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" role="img" aria-labelledby="title desc">
  <title id="title">The binary join combines exactly two sets of oracle information</title>
  <desc id="desc">Input tags reduce A and B to their join. If both reduce to C, the displayed construction reduces their join to C. These are reducibility arrows, not a claim of distinct or incomparable degrees.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#245b4b" stroke="none"/>
    </marker>
  </defs>
  <rect width="760" height="510" fill="#f3f4ef"/>
  <text x="380" y="30" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#252d29">One oracle can answer both parts</text>
  <path d="M380 217.4L380 118.6" fill="none" stroke="#245b4b" stroke-width="1.7" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <path d="M190 375.4L330 278.6" fill="none" stroke="#245b4b" stroke-width="1.7" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <path d="M570 375.4L430 278.6" fill="none" stroke="#245b4b" stroke-width="1.7" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <rect x="290" y="62" width="180" height="56" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
  <text x="380" y="99.5" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="27" fill="#252d29">C</text>
  <rect x="250" y="218" width="260" height="60" rx="5" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
  <text x="380.270264" y="257.5" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="27" fill="#245b4b">A ⊕ B</text>
  <rect x="110" y="376" width="160" height="56" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
  <text x="189.961914" y="413.5" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="27" fill="#252d29">A</text>
  <rect x="490" y="376" width="160" height="56" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
  <text x="570" y="413.5" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="27" fill="#252d29">B</text>
  <text x="410" y="166" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#245b4b">the constructed join program</text>
  <text x="150" y="329" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#245b4b">n ↦ 2n</text>
  <text x="610" y="329" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#245b4b">n ↦ 2n + 1</text>
  <text x="380" y="471" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#252d29">Arrows mean Turing reductions.</text>
  <text x="380" y="499" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#73796f">No distinctness or incomparability is assumed.</text>
</svg>
