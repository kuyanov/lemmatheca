<text x="380.0" y="34" font-family="Georgia, Times New Roman, serif" font-size="23" text-anchor="middle" fill="#29352e" font-weight="bold">At candidate δ, test only the rows ξ &lt; δ</text>
<text x="380" y="69" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#29352e">Strict tails C<tspan baseline-shift="sub" font-size="70%">ξ</tspan> = {δ &lt; κ : ξ &lt; δ}</text>
