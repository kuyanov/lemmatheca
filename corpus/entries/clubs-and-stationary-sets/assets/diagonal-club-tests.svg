<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title desc">
<title id="title">Only earlier club indices are tested diagonally</title><desc id="desc">A matrix for the strict club tails shades the cells with row index smaller than the candidate ordinal. Each diagonal cell fails its own ordinary tail test but is not tested diagonally. A lower sequence panel shows a fixed row enforced eventually before closure at its supremum.</desc>
