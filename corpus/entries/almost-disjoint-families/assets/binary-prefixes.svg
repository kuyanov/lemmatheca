<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Two binary sequences separate after a common prefix</title>
  <desc id="desc">A diagram of binary words with two highlighted paths. Both pass through the empty word and zero. One continues through zero zero and zero zero zero; the other through zero one and zero one zero.</desc>
  <rect width="760" height="390" fill="#f3f4ef"/>
  <g stroke="#cbd1c5" stroke-width="1.2" fill="none">
    <path d="M380 45L230 112L120 185 M230 112L340 185 M380 45L530 112L450 185 M530 112L630 185"/>
    <path d="M120 185L75 260 M120 185L165 260 M340 185L295 260 M340 185L385 260 M450 185L425 260 M450 185L495 260 M630 185L585 260 M630 185L675 260"/>
  </g>
  <g fill="none" stroke="#245b4b" stroke-width="2.3"><path d="M380 45L230 112L120 185L75 260"/></g>
  <g fill="none" stroke="#7f8b79" stroke-width="2" stroke-dasharray="6 4"><path d="M230 112L340 185L295 260"/></g>
  <g fill="#f3f4ef" stroke="#b6bfb0" stroke-width="1">
    <ellipse cx="380" cy="45" rx="38" ry="20"/><ellipse cx="230" cy="112" rx="26" ry="20"/><ellipse cx="530" cy="112" rx="26" ry="20"/>
    <ellipse cx="120" cy="185" rx="31" ry="20"/><ellipse cx="340" cy="185" rx="31" ry="20"/><ellipse cx="450" cy="185" rx="31" ry="20"/><ellipse cx="630" cy="185" rx="31" ry="20"/>
    <ellipse cx="75" cy="260" rx="35" ry="20"/><ellipse cx="295" cy="260" rx="35" ry="20"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#252d29" text-anchor="middle">
    <text x="380" y="51">∅</text><text x="230" y="119">0</text><text x="530" y="119">1</text>
    <text x="120" y="192">00</text><text x="340" y="192">01</text><text x="450" y="192">10</text><text x="630" y="192">11</text>
    <text x="75" y="267">000</text><text x="295" y="267">010</text>
    <text x="165" y="277">…</text><text x="385" y="277">…</text><text x="460" y="277">…</text><text x="630" y="277">…</text>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#73796f">
    <path d="M160 328H193" stroke="#245b4b" stroke-width="2.3"/>
    <text x="206" y="334">x = 000…</text>
    <path d="M435 328H468" stroke="#7f8b79" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="481" y="334">y = 010…</text>
    <text x="380" y="367" text-anchor="middle">Common words: the empty word and 0</text>
  </g>
</svg>
