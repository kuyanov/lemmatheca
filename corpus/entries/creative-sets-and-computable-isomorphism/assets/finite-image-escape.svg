<svg xmlns="http://www.w3.org/2000/svg" width="420" height="620" viewBox="0 0 420 620" role="img" aria-labelledby="title desc">
  <title id="title">Escape from a finite image list</title>
  <desc id="desc">Two specified self-referential programs give a query with a fresh image and the same halting answer at zero. A collision of the first program forces divergence of the old query. A collision of the second would then contradict the reduction property.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" viewBox="0 0 6 6" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L6 3 L0 6 Z" fill="#365b50"/>
    </marker>
  </defs>
  <rect width="420" height="620" fill="#fff"/>
  <g fill="#202b27" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="210" y="26" font-size="19" font-weight="600">Escape from a finite image list</text>
    <g fill="#f1f7f4" stroke="#517466" stroke-width="1.2">
      <rect x="40" y="50" width="340" height="70" rx="8"/>
      <rect x="40" y="170" width="340" height="90" rx="8"/>
      <rect x="15" y="355" width="170" height="70" rx="8"/>
      <rect x="235" y="355" width="170" height="110" rx="8"/>
      <rect x="235" y="510" width="170" height="65" rx="8"/>
    </g>
    <text x="210" y="78" font-size="19">old query e and finite list L</text>
    <text x="210" y="104" font-size="17">every query in L matches e at 0</text>
    <text x="210" y="198" font-size="20" font-weight="600">build n(e,L)</text>
    <text x="210" y="224" font-size="17">run e if g(n) is outside B</text>
    <text x="210" y="247" font-size="17">otherwise diverge</text>
    <text x="100" y="291" font-size="17">fresh image</text>
    <text x="320" y="291" font-size="17">collision</text>
    <text x="100" y="384" font-size="20" font-weight="600">return n</text>
    <text x="100" y="412" font-size="17">g(n) outside B</text>
    <text x="320" y="378" font-size="17">e diverges at 0</text>
    <text x="320" y="404" font-size="20" font-weight="600">build m</text>
    <text x="320" y="429" font-size="17">m halts iff</text>
    <text x="320" y="451" font-size="18">g(m) in B</text>
    <text x="306" y="492" font-size="16" text-anchor="end">collision impossible</text>
    <text x="320" y="537" font-size="20" font-weight="600">return m</text>
    <text x="320" y="563" font-size="18">g(m) outside B</text>
    <text x="210" y="608" font-size="17">same halting answer as e at input 0</text>
  </g>
  <g fill="none" stroke="#365b50" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M210 120 V170"/>
    <path d="M210 260 V305" marker-end="none"/>
    <path d="M205 310 H100 V355"/>
    <path d="M215 310 H320 V355"/>
    <path d="M320 465 V510"/>
  </g>
  <circle cx="210" cy="310" r="5" fill="#365b50"/>
</svg>
