<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title desc">
<title id="title">Constructing and running the recursion-theorem index</title><desc id="desc">Construction proceeds from a given partial recursive g to the auxiliary function h, then to an index q for h, and finally to e equals d(q). At runtime program e supplies its stored q together with the input x to program q, computing g(e,x) as a partial value.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245b4b"/></marker></defs>
<rect width="760" height="540" fill="#f3f4ef"/>
<text x="28" y="36" font-family="Georgia, Times New Roman, serif" font-size="23" text-anchor="start" fill="#252d29">First construct h, then choose q, then form e</text>
<text x="28" y="75" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="start" fill="#73796f" font-weight="600">CONSTRUCTION</text>
<rect x="28" y="96" width="119" height="84" rx="5" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="87.5" y="144.0" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#252d29">given g</text>
<path d="M147 137L198 137" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="208" y="96" width="242" height="84" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="329.0" y="131.0" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#252d29">h(a,x) ≃ g(d(a),x)</text>
<text x="329.0" y="157.0" font-family="Georgia, Times New Roman, serif" font-size="18" text-anchor="middle" fill="#252d29">partial recursive function</text>
<path d="M450 137L497 137" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="507" y="96" width="91" height="84" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="552.5" y="131.0" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">index</text>
<text x="552.5" y="157.0" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">q for h</text>
<path d="M598 137L630 137" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="640" y="96" width="92" height="84" rx="5" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="686.0" y="144.0" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#252d29">e=d(q)</text>
<text x="380" y="218" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="middle" fill="#73796f">q is chosen for the already defined h; the number e is formed afterwards.</text>
<path d="M28 248L732 248" fill="none" stroke="#bbc7b9" stroke-width="1"/>
<text x="28" y="285" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="start" fill="#73796f" font-weight="600">EXECUTION</text>
<rect x="121" y="308" width="565" height="126" rx="6" fill="#e1e9dc" stroke="#245b4b" stroke-width="1.4"/>
<text x="403" y="335" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#252d29">program e = d(q) = s(q,q)</text>
<text x="59" y="391" font-family="Georgia, Times New Roman, serif" font-size="26" text-anchor="middle" fill="#252d29">x</text>
<path d="M80 382L151 382" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="163" y="352" width="207" height="62" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="266.5" y="389.0" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#252d29">form ⟨q,x⟩</text>
<path d="M370 382L438 382" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="404" y="366" font-family="Georgia, Times New Roman, serif" font-size="15" text-anchor="middle" fill="#73796f">q as data</text>
<rect x="448" y="352" width="207" height="62" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="551.5" y="389.0" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#252d29">run program q</text>
<text x="380" y="480" font-family="Georgia, Times New Roman, serif" font-size="23" text-anchor="middle" fill="#252d29">φ<tspan baseline-shift="sub" font-size="70%">e</tspan>(x) ≃ φ<tspan baseline-shift="sub" font-size="70%">q</tspan>(⟨q,x⟩) ≃ g(d(q),x) = g(e,x)</text>
<text x="380" y="518" font-family="Georgia, Times New Roman, serif" font-size="17" text-anchor="middle" fill="#73796f">Code formation d is total; the execution equalities also allow divergence.</text>
</svg>
