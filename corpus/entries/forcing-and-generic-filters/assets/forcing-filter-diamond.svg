<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
<title id="title">Compatibility is not directedness inside the proposed filter</title><desc id="desc">In the four-point forcing diamond the top three elements 1,a,b form an upward-closed set G. The common refinement c is outside G, so G fails directedness even though a and b are compatible.</desc>
<rect width="760" height="360" fill="#f3f4ef"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#356653" stroke-width="1.4"/></marker><marker id="grey-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#768278" stroke-width="1.4"/></marker></defs>
<text x="380.0" y="34" font-family="Georgia, Times New Roman, serif" font-size="23" text-anchor="middle" fill="#29352e" font-weight="bold">The common refinement must itself belong to the filter</text>
<rect x="105" y="65" width="330" height="145" rx="30" fill="#dce9dc" stroke="#a7b5a6" stroke-width="1.2"/>
<path d="M270 93L170 180" fill="none" stroke="#356653" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M270 93L370 180" fill="none" stroke="#356653" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M170 180L270 280" fill="none" stroke="#356653" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M370 180L270 280" fill="none" stroke="#356653" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="270" cy="93" r="18" fill="#dce9dc" stroke="#356653" stroke-width="1.6"/>
<text x="270" y="100" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">1</text>
<circle cx="170" cy="180" r="18" fill="#dce9dc" stroke="#356653" stroke-width="1.6"/>
<text x="170" y="187" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">a</text>
<circle cx="370" cy="180" r="18" fill="#dce9dc" stroke="#356653" stroke-width="1.6"/>
<text x="370" y="187" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">b</text>
<circle cx="270" cy="280" r="18" fill="#f3f4ef" stroke="#768278" stroke-width="1.6"/>
<text x="270" y="287" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#29352e">c</text>
<text x="270" y="238" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#29352e">c ∉ G</text>
<text x="497" y="100" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="start" fill="#29352e">G = {1, a, b}</text>
<path d="M510 144L510 243" fill="none" stroke="#356653" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="541" y="178" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="start" fill="#29352e">Stronger</text>
<text x="541" y="203" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="start" fill="#29352e">conditions</text>
<text x="500" y="291" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#29352e">c ≤ a, b</text>
<text x="500" y="318" font-family="Georgia, Times New Roman, serif" font-size="19" text-anchor="middle" fill="#29352e">compatible, but not directed in G</text>
</svg>
