<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
<title id="title">The threshold makes the finite counting map injective</title><desc id="desc">Distinct selected values in the interval from zero to two n choose distinct producing indices below n. The arrows are the least-index assignment, not the output direction of the selector.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#245b4b" stroke="none"/></marker></defs>
<rect width="760" height="460" fill="#f3f4ef"/>
<text x="380" y="31" font-family="Georgia, Times New Roman, serif" font-size="23" text-anchor="middle" fill="#252d29">Distinct selected values require distinct indices</text>
<text x="380" y="68" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#245b4b">I<tspan baseline-shift="sub" font-size="70%">n</tspan> = {0, …, 2n}</text>
<rect x="40" y="80" width="680" height="110" rx="5" fill="#fbfcf8" stroke="#bbc7b9" stroke-width="1.2"/>
<circle cx="80" cy="135" r="4" fill="#73796f"/>
<text x="80" y="114" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#73796f">0</text>
<circle cx="280" cy="135" r="7" fill="#245b4b"/>
<text x="280" y="114" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#245b4b">x</text>
<circle cx="480" cy="135" r="7" fill="#245b4b"/>
<text x="480" y="114" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#245b4b">y</text>
<circle cx="680" cy="135" r="4" fill="#73796f"/>
<text x="680" y="114" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#73796f">2n</text>
<text x="175" y="141" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#73796f">…</text>
<text x="380" y="141" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#73796f">…</text>
<text x="585" y="141" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#73796f">…</text>
<rect x="150" y="260" width="460" height="110" rx="5" fill="#e1e9dc" stroke="#bbc7b9" stroke-width="1.2"/>
<text x="380" y="285" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#245b4b">{0, …, n − 1}</text>
<circle cx="280" cy="315" r="7" fill="#245b4b"/>
<text x="280" y="350" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#245b4b">ν<tspan baseline-shift="sub" font-size="70%">n</tspan>(x)</text>
<path d="M280 142L280 308" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<circle cx="480" cy="315" r="7" fill="#245b4b"/>
<text x="480" y="350" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#245b4b">ν<tspan baseline-shift="sub" font-size="70%">n</tspan>(y)</text>
<path d="M480 142L480 308" fill="none" stroke="#245b4b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="380" y="230" font-family="Georgia, Times New Roman, serif" font-size="25" text-anchor="middle" fill="#245b4b">ν<tspan baseline-shift="sub" font-size="70%">n</tspan></text>
<text x="380" y="323" font-family="Georgia, Times New Roman, serif" font-size="22" text-anchor="middle" fill="#73796f">…</text>
<text x="380" y="406" font-family="Georgia, Times New Roman, serif" font-size="21" text-anchor="middle" fill="#252d29">ψ(e) = x ≤ 2n  ⇒  2e &lt; x ≤ 2n  ⇒  e &lt; n</text>
<text x="380" y="442" font-family="Georgia, Times New Roman, serif" font-size="20" text-anchor="middle" fill="#73796f">One index has one value: ν<tspan baseline-shift="sub" font-size="70%">n</tspan>(x) = ν<tspan baseline-shift="sub" font-size="70%">n</tspan>(y) forces x = y.</text>
</svg>
