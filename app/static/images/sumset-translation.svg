<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title description">
  <title id="title">A translated copy inside a sumset</title>
  <desc id="description">A is {0, 1, 2}, B is {0, 2}. Translation by 2 maps the three elements of A to 2, 3, 4 inside A plus B, which is {0, 1, 2, 3, 4}.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#387560"/></marker></defs>
  <g font-family="Georgia,serif" fill="#263b33" font-size="20"><text x="44" y="75">A</text><text x="44" y="209">A + B</text></g>
  <g stroke="#d5ddd6" stroke-width="1.5"><path d="M172 70H644"/><path d="M172 204H644"/></g>
  <rect x="365" y="181" width="287" height="46" rx="23" fill="#e3eee6"/>
  <g fill="none" stroke="#387560" stroke-width="1.5" marker-end="url(#arrow)"><path d="M204 81 C230 137 356 139 387 191"/><path d="M310 81 C336 137 462 139 493 191"/><path d="M416 81 C442 137 568 139 599 191"/></g>
  <g fill="#245b4b"><circle cx="204" cy="70" r="6"/><circle cx="310" cy="70" r="6"/><circle cx="416" cy="70" r="6"/><circle cx="392" cy="204" r="6"/><circle cx="498" cy="204" r="6"/><circle cx="604" cy="204" r="6"/></g>
  <g fill="#faf9f6" stroke="#9ca9a0" stroke-width="1.5"><circle cx="180" cy="204" r="5"/><circle cx="286" cy="204" r="5"/></g>
  <g font-family="Georgia,serif" fill="#53665c" font-size="17" text-anchor="middle"><text x="204" y="50">0</text><text x="310" y="50">1</text><text x="416" y="50">2</text><text x="180" y="251">0</text><text x="286" y="251">1</text><text x="392" y="251">2</text><text x="498" y="251">3</text><text x="604" y="251">4</text></g>
  <g font-family="system-ui,sans-serif" fill="#387560" font-size="13"><text x="570" y="72">translate by +2</text></g>
</svg>
