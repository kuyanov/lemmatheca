<span class="formalization-badge formalization-{{ formal.status }}" title="{{ formal.description }}"
  aria-label="{{ formal.description }}">
  <span
    aria-hidden="true">{% if formal.status == "complete" %}✓{% elif formal.status == "not_applicable" %}–{% else %}◷{% endif %}</span>
  Formalization: {{ formal.label }}
  {% if expandable %}
  <svg class="formalization-chevron" width="10" height="10" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
    <path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
  {% endif %}
</span>
