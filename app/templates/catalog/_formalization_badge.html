{% with status=formal|default:entry.formalization %}
<span class="formalization-badge formalization-{{ status.status }}" title="{{ status.description }}"
  aria-label="{{ status.description }}">
  <span
    aria-hidden="true">{% if status.status == "complete" %}✓{% elif status.status == "not_applicable" %}–{% else %}◷{% endif %}</span>
  Formalization: {{ status.label }}
  {% if compact and block.formal_nodes %}
  <svg class="formalization-chevron" width="10" height="10" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
    <path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
  {% endif %}
</span>
{% endwith %}
