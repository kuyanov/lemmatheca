<button class="metric-history-toggle" type="button" data-metric="{{ key }}" data-label="{{ label }}"
  aria-label="Show {{ label|lower }} history" title="Show {{ label|lower }} history" aria-controls="{{ key }}-history"
  aria-expanded="false" hidden>
  <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
    <path d="M3 3v14h14M6 12l4-5 3 3 4-6" />
  </svg>
</button>
<div class="metric-history" id="{{ key }}-history" hidden>
  <div class="metric-plot"></div>
  <div class="metric-chart-dates"></div>
  <div class="metric-chart-legend"></div>
</div>
