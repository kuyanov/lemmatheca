<ul class="{{ list_class|default:'formal-node-list' }}">
  {% for node in nodes %}
  <li>
    <a href="{{ node.url }}" target="_blank" rel="noopener" title="Open in a new tab"><code>{{ node.id }}</code></a>
    {% include "catalog/_node_status.html" with node=node inline=True only %}
  </li>
  {% endfor %}
</ul>
