<div class="statement-box">
    <p>If \(A\) and \(B\) are nonempty, then \(A+B\) is nonempty.</p>
</div>
<p class="proof-label">Proof</p>
<p>Choose \(a\in A\) and \(b\in B\). By definition, \(a+b\in A+B\), so the sumset has an element. <span class="qed"
        aria-label="End of proof">□</span></p>
