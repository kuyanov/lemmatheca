{% if block.formal_nodes %}
<details class="formal-nodes">
  <summary class="block-heading" aria-label="{{ block.label }}: {{ block.formalization.description }}. Show formal nodes">
    {% include "catalog/_block_heading.html" %}
  </summary>
  <ul class="formal-node-list">
    {% for node in block.formal_nodes %}
    <li>
      <a href="{{ node.url }}"><code>{{ node.id }}</code></a>
      <span class="node-status formalization-{{ node.status }}">
        <span aria-hidden="true">{% if node.status == "complete" %}✓{% else %}◷{% endif %}</span>
        {{ node.status_label }}
      </span>
    </li>
    {% endfor %}
  </ul>
</details>
{% else %}
<div class="block-heading">
  {% include "catalog/_block_heading.html" %}
</div>
{% endif %}
