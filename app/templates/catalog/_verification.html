{% if block.formal_nodes %}
<details class="formal-nodes">
  <summary class="block-heading"
    aria-label="{{ block.label }}: {{ block.formalization.description }}. Show formal nodes">
    {% include "catalog/_block_heading.html" %}
  </summary>
  <ul class="formal-node-list">
    {% for node in block.formal_nodes %}
    <li>
      <a href="{{ node.url }}"><code>{{ node.id }}</code></a>
      {% include "formalization/_status_badge.html" with node=node inline=True only %}
    </li>
    {% endfor %}
  </ul>
</details>
{% else %}
<div class="block-heading">
  {% include "catalog/_block_heading.html" %}
</div>
{% endif %}
